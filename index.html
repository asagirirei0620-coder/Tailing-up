<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ゲーム開発記</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#111827;
  color:#fff;
  overflow:hidden;
}
button,input,select{font:inherit}
button{
  border:0;
  border-radius:8px;
  padding:9px 14px;
  cursor:pointer;
  font-weight:700;
  transition:.15s;
}
button:hover{filter:brightness(1.12);transform:translateY(-1px)}
button:active{transform:translateY(0)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}

#startScreen{
  position:fixed;
  inset:0;
  z-index:9999;
  background:
    radial-gradient(circle at 20% 20%,#263d69 0,#111827 35%),
    #111827;
  display:flex;
  align-items:center;
  justify-content:center;
}
.startBox{
  width:min(520px,92vw);
  padding:34px;
  background:#1f2937;
  border:1px solid #4b5563;
  border-radius:18px;
  box-shadow:0 20px 70px #0008;
}
.startBox h1{
  text-align:center;
  margin:0 0 8px;
  font-size:38px;
}
.startSub{text-align:center;color:#9ca3af;margin-bottom:28px}
.field{margin:14px 0}
.field label{display:block;color:#cbd5e1;font-size:14px;margin-bottom:6px}
.field input,.field select{
  width:100%;
  padding:12px;
  border:1px solid #4b5563;
  background:#111827;
  color:#fff;
  border-radius:8px;
}
.startBtn{
  width:100%;
  margin-top:16px;
  background:#2563eb;
  color:white;
  font-size:18px;
  padding:14px;
}

#game{
  height:100vh;
  display:none;
  flex-direction:column;
}
#topbar{
  height:66px;
  flex-shrink:0;
  background:#172033;
  border-bottom:1px solid #334155;
  display:flex;
  align-items:center;
  gap:18px;
  padding:8px 16px;
  position:relative;
  z-index:100;
}
.logo{
  font-size:20px;
  font-weight:900;
  white-space:nowrap;
}
.stat{
  display:flex;
  flex-direction:column;
  min-width:105px;
}
.stat small{color:#94a3b8;font-size:11px}
.stat strong{font-size:15px}
#pauseBtn{margin-left:auto;background:#475569;color:#fff}
#saveBtn{background:#334155;color:#fff}

#main{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) 380px;
}

#office{
  position:relative;
  overflow:hidden;
  background:#d9c6a4;
}
#officeCanvas{
  position:absolute;
  inset:0;
}
.wall{
  position:absolute;
  left:0;right:0;top:0;
  height:28%;
  background:
    repeating-linear-gradient(90deg,#c5b08e 0 45px,#bda784 45px 47px);
  border-bottom:8px solid #927b59;
}
.floor{
  position:absolute;
  left:0;right:0;top:28%;bottom:0;
  background:
    repeating-linear-gradient(0deg,#b68e64 0 34px,#aa825b 34px 36px),
    repeating-linear-gradient(90deg,transparent 0 58px,#9e764f 58px 60px);
}
.window{
  position:absolute;
  top:5%;
  width:18%;
  height:16%;
  background:linear-gradient(#8bd4ff,#d9f4ff);
  border:7px solid #725b3e;
  box-shadow:inset 0 0 0 4px #b9a07a;
}
.window:before{
  content:"";
  position:absolute;
  left:50%;
  top:0;bottom:0;
  width:4px;
  background:#725b3e;
}
.window:after{
  content:"";
  position:absolute;
  top:50%;left:0;right:0;
  height:4px;
  background:#725b3e;
}
.w1{left:9%}.w2{left:33%}.w3{left:57%}.w4{left:81%}

.sign{
  position:absolute;
  top:7%;
  left:43%;
  padding:7px 20px;
  background:#374151;
  border:3px solid #111827;
  border-radius:5px;
  font-weight:900;
  letter-spacing:2px;
}

.desk{
  position:absolute;
  width:150px;
  height:72px;
  background:#805d3a;
  border:5px solid #5b4128;
  border-radius:5px;
  z-index:8;
  box-shadow:0 8px 0 #674827;
}
.desk:before{
  content:"";
  position:absolute;
  left:8px;right:8px;
  bottom:-27px;
  height:28px;
  background:#604426;
  clip-path:polygon(0 0,10% 0,10% 100%,90% 100%,90% 0,100% 0,100% 100%,0 100%);
}
.monitor{
  position:absolute;
  width:47px;height:34px;
  left:50%;top:-38px;
  transform:translateX(-50%);
  background:#263238;
  border:4px solid #17212b;
  border-radius:4px;
}
.monitor:after{
  content:"";
  position:absolute;
  left:6px;right:6px;top:5px;bottom:6px;
  background:#67e8f9;
  opacity:.8;
}
.keyboard{
  position:absolute;
  left:48px;top:8px;
  width:55px;height:13px;
  background:#cbd5e1;
  border-radius:3px;
}

.d1{left:11%;top:41%}
.d2{left:34%;top:57%}
.d3{left:61%;top:40%}
.d4{left:80%;top:58%;transform:translateX(-50%)}

.whiteboard{
  position:absolute;
  left:39%;top:31%;
  width:22%;height:17%;
  background:#f8fafc;
  border:7px solid #475569;
  border-radius:4px;
  color:#334155;
  padding:8px;
  font-size:12px;
  z-index:5;
}
.whiteboard b{font-size:14px}
.sofa{
  position:absolute;
  left:4%;bottom:8%;
  width:190px;height:80px;
  background:#53657a;
  border-radius:15px 15px 5px 5px;
  border:6px solid #3d4b5c;
  z-index:7;
}
.sofa:before{
  content:"";
  position:absolute;
  left:10px;right:10px;bottom:-12px;
  height:15px;background:#303b48;
}
.table{
  position:absolute;
  left:27%;bottom:7%;
  width:150px;height:70px;
  background:#765333;
  border:5px solid #533a24;
  border-radius:50%;
  z-index:7;
}
.plant{
  position:absolute;
  right:4%;top:32%;
  font-size:60px;
  z-index:7;
}
.coffee{
  position:absolute;
  left:29%;top:17%;
  font-size:34px;
  z-index:7;
}
.door{
  position:absolute;
  right:1%;top:14%;
  width:9%;height:27%;
  background:#70492c;
  border:7px solid #4c321f;
  z-index:6;
}
.door span{
  position:absolute;
  right:10px;top:50%;
  width:9px;height:9px;border-radius:50%;
  background:#eab308;
}

#employeesLayer{
  position:absolute;
  inset:0;
  z-index:30;
  pointer-events:none;
}
.employee{
  position:absolute;
  width:42px;
  height:68px;
  transform-origin:50% 90%;
  will-change:transform,opacity;
  image-rendering:pixelated;
  pointer-events:auto;
  z-index:40;
}
.employee.hidden{opacity:0}
.employee .shadow{
  position:absolute;
  left:6px;bottom:0;
  width:31px;height:8px;
  background:#0005;
  border-radius:50%;
  transform:scaleX(1.1);
}
.employee .body{
  position:absolute;
  left:9px;top:25px;
  width:24px;height:30px;
  background:var(--shirt);
  border:3px solid #18202b;
  border-radius:5px 5px 3px 3px;
}
.employee .head{
  position:absolute;
  left:11px;top:7px;
  width:20px;height:21px;
  background:var(--skin);
  border:3px solid #18202b;
  border-radius:5px 5px 8px 8px;
  z-index:3;
}
.employee .hair{
  position:absolute;
  left:9px;top:4px;
  width:24px;height:12px;
  background:var(--hair);
  border:3px solid #18202b;
  border-radius:8px 8px 2px 2px;
  z-index:4;
}
.employee .leg{
  position:absolute;
  top:52px;
  width:8px;height:14px;
  background:#263241;
  border:2px solid #17202a;
  transform-origin:50% 0;
  z-index:1;
}
.employee .leg.l{left:11px}
.employee .leg.r{left:23px}
.employee .arm{
  position:absolute;
  top:29px;
  width:7px;height:18px;
  background:var(--skin);
  border:2px solid #17202a;
  transform-origin:50% 3px;
  z-index:2;
}
.employee .arm.l{left:5px}
.employee .arm.r{right:5px}
.employee .tool{
  position:absolute;
  z-index:5;
}
.employee.programmer .tool,
.employee.designer .tool{
  left:31px;top:28px;
  width:25px;height:17px;
  background:#263238;
  border:3px solid #111827;
  border-radius:3px;
}
.employee.programmer .tool:after,
.employee.designer .tool:after{
  content:"";
  position:absolute;
  left:5px;right:5px;top:4px;bottom:4px;
  background:#5eead4;
}
.employee.designer .tool{
  top:40px;
  width:27px;height:8px;
  background:#cbd5e1;
}
.employee.designer .tool:after{
  background:#f472b6;
  height:3px;top:2px;
}
.employee.planner .tool{
  left:31px;top:34px;
  width:20px;height:15px;
  background:#f8fafc;
  border:2px solid #475569;
  transform:rotate(-8deg);
}
.employee.sound .tool{
  left:30px;top:18px;
  width:25px;height:25px;
  border:4px solid #111827;
  border-radius:50%;
  background:transparent;
}
.employee.sound .tool:after{
  content:"";
  position:absolute;
  width:10px;height:10px;
  left:4px;top:4px;
  background:#111827;
  border-radius:50%;
}
.employee .badge{
  position:absolute;
  top:-19px;
  left:50%;
  transform:translateX(-50%);
  background:#111827;
  color:white;
  border-radius:5px;
  padding:2px 5px;
  white-space:nowrap;
  font-size:9px;
  opacity:0;
  transition:.2s;
}
.employee:hover .badge{opacity:1}

.employee.typing .arm.l{animation:typeL .23s ease-in-out infinite alternate}
.employee.typing .arm.r{animation:typeR .21s ease-in-out infinite alternate}
.employee.typing .body{animation:typeBody .4s ease-in-out infinite}
.employee.typing .head{animation:typeHead .4s ease-in-out infinite}
.employee.walking .leg.l{animation:walkL .22s ease-in-out infinite alternate}
.employee.walking .leg.r{animation:walkR .22s ease-in-out infinite alternate}
.employee.walking .body{animation:walkBody .22s ease-in-out infinite alternate}
.employee.talking .body{animation:talkBody .6s ease-in-out infinite}
.employee.talking .head{animation:talkHead .6s ease-in-out infinite}
.employee.resting .body{animation:restBody 1.8s ease-in-out infinite}

@keyframes typeL{from{transform:rotate(22deg)}to{transform:rotate(-18deg)}}
@keyframes typeR{from{transform:rotate(-18deg)}to{transform:rotate(22deg)}}
@keyframes typeBody{from{transform:translateY(0)}to{transform:translateY(1px)}}
@keyframes typeHead{from{transform:translateY(0)}to{transform:translateY(1px)}}
@keyframes walkL{from{transform:rotate(25deg)}to{transform:rotate(-25deg)}}
@keyframes walkR{from{transform:rotate(-25deg)}to{transform:rotate(25deg)}}
@keyframes walkBody{from{transform:translateY(0)}to{transform:translateY(-2px)}}
@keyframes talkBody{from{transform:translateY(0)}to{transform:translateY(-2px)}}
@keyframes talkHead{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
@keyframes restBody{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}

#ceo{
  position:absolute;
  left:50%;bottom:8%;
  transform:translateX(-50%);
  width:120px;height:115px;
  z-index:35;
  text-align:center;
}
.ceoDesk{
  position:absolute;
  left:0;bottom:0;
  width:120px;height:48px;
  background:#624528;
  border:5px solid #432f1d;
  border-radius:7px;
}
.ceoChair{
  position:absolute;
  left:42px;bottom:38px;
  width:36px;height:45px;
  background:#374151;
  border-radius:10px;
  border:4px solid #1f2937;
}
.ceoChar{
  position:absolute;
  left:40px;bottom:52px;
  width:40px;height:62px;
}
.ceoChar .head{
  position:absolute;
  left:9px;top:0;
  width:22px;height:23px;
  background:#f1c7a6;
  border:3px solid #17202a;
  border-radius:5px;
}
.ceoChar .hair{
  position:absolute;
  left:7px;top:-3px;
  width:26px;height:13px;
  background:#292524;
  border:3px solid #17202a;
  border-radius:8px 8px 2px 2px;
}
.ceoChar .body{
  position:absolute;
  left:5px;top:22px;
  width:30px;height:35px;
  background:#1e3a8a;
  border:3px solid #17202a;
  border-radius:5px;
}
.ceoName{
  position:absolute;
  top:-17px;
  width:100%;
  color:#111827;
  font-size:11px;
  font-weight:900;
  text-shadow:0 1px #fff;
}

#panel{
  background:#0f172a;
  border-left:1px solid #334155;
  min-width:0;
  display:flex;
  flex-direction:column;
}
.tabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-bottom:1px solid #334155;
}
.tab{
  border-radius:0;
  background:#172033;
  color:#94a3b8;
  padding:13px 4px;
}
.tab.active{background:#2563eb;color:#fff}
#panelContent{
  overflow:auto;
  padding:16px;
  flex:1;
}
.card{
  background:#1e293b;
  border:1px solid #334155;
  border-radius:10px;
  padding:14px;
  margin-bottom:12px;
}
.card h3{margin:0 0 10px;font-size:16px}
.muted{color:#94a3b8;font-size:13px}
.money{color:#86efac}
.good{color:#4ade80}
.bad{color:#f87171}
.progress{
  height:10px;
  background:#334155;
  border-radius:10px;
  overflow:hidden;
}
.progress>div{
  height:100%;
  background:#3b82f6;
  transition:width .3s;
}
.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.smallBtn{width:100%;margin-top:6px}
.blue{background:#2563eb;color:#fff}
.green{background:#16a34a;color:#fff}
.orange{background:#d97706;color:#fff}
.red{background:#dc2626;color:#fff}
.gray{background:#475569;color:#fff}
.purple{background:#7c3aed;color:#fff}

.employeeRow{
  padding:10px;
  border:1px solid #334155;
  background:#172033;
  border-radius:8px;
  margin-bottom:8px;
}
.employeeRowTop{
  display:flex;
  justify-content:space-between;
  gap:5px;
}
.statline{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:#cbd5e1;
  margin-top:4px;
}

#toast{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translateX(-50%) translateY(20px);
  background:#020617;
  border:1px solid #475569;
  padding:11px 18px;
  border-radius:10px;
  opacity:0;
  pointer-events:none;
  z-index:9000;
  transition:.25s;
}
#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

#eventOverlay{
  position:fixed;
  inset:0;
  background:#0009;
  z-index:8000;
  display:none;
  align-items:center;
  justify-content:center;
}
.eventBox{
  width:min(560px,90vw);
  background:#111827;
  border:2px solid #64748b;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 30px 100px #000;
}
.eventTitle{
  background:#1e293b;
  padding:15px 20px;
  font-weight:900;
  font-size:18px;
}
.eventBody{
  padding:20px;
}
.eventCharacter{
  height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.bigEmployee{
  position:relative;
  width:100px;
  height:130px;
  transform:scale(1.6);
}
.bigEmployee .body{
  position:absolute;
  left:32px;top:52px;
  width:45px;height:55px;
  background:var(--shirt);
  border:5px solid #17202a;
  border-radius:7px;
}
.bigEmployee .head{
  position:absolute;
  left:35px;top:15px;
  width:37px;height:40px;
  background:var(--skin);
  border:5px solid #17202a;
  border-radius:8px 8px 12px 12px;
}
.bigEmployee .hair{
  position:absolute;
  left:31px;top:9px;
  width:45px;height:22px;
  background:var(--hair);
  border:5px solid #17202a;
  border-radius:13px 13px 4px 4px;
}
.bigEmployee .arm{
  position:absolute;
  top:58px;
  width:12px;height:30px;
  background:var(--skin);
  border:4px solid #17202a;
  border-radius:4px;
}
.bigEmployee .arm.l{left:22px}
.bigEmployee .arm.r{right:22px}
.eventText{
  font-size:17px;
  line-height:1.7;
  text-align:center;
  margin-bottom:18px;
}
.eventButtons{
  display:flex;
  gap:10px;
  justify-content:center;
}
.eventButtons button{min-width:130px}

#centerEmployeeEvent{
  position:fixed;
  inset:0;
  z-index:7900;
  pointer-events:none;
  display:none;
}
.centerCharacter{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-58%);
  width:120px;
  height:160px;
  filter:drop-shadow(0 15px 10px #0008);
}
.centerBubble{
  position:absolute;
  left:50%;
  top:calc(50% + 80px);
  transform:translateX(-50%);
  background:white;
  color:#111827;
  border-radius:14px;
  padding:13px 20px;
  min-width:250px;
  text-align:center;
  font-weight:700;
  box-shadow:0 8px 30px #0008;
}
.centerLabel{
  position:absolute;
  left:50%;
  top:calc(50% - 125px);
  transform:translateX(-50%);
  background:#111827;
  border:1px solid #64748b;
  padding:5px 14px;
  border-radius:20px;
  white-space:nowrap;
}

#gameOver{
  position:fixed;
  inset:0;
  background:#020617eF;
  z-index:9998;
  display:none;
  align-items:center;
  justify-content:center;
}
.gameOverBox{
  background:#111827;
  border:2px solid #dc2626;
  padding:40px;
  border-radius:18px;
  text-align:center;
}

@media(max-width:1000px){
  #main{grid-template-columns:1fr 330px}
  .desk{transform:scale(.85)}
  .d4{transform:translateX(-50%) scale(.85)}
}
</style>
</head>

<body>

<div id="startScreen">
  <div class="startBox">
    <h1>🎮 ゲーム開発記</h1>
    <div class="startSub">小さな会社から、世界一のゲーム会社へ。</div>

    <div class="field">
      <label>会社名</label>
      <input id="companyInput" value="キノコゲームズ">
    </div>

    <div class="field">
      <label>社長名</label>
      <input id="presidentInput" value="社長">
    </div>

    <div class="field">
      <label>難易度</label>
      <select id="difficultyInput">
        <option value="normal">ノーマル</option>
        <option value="easy">イージー</option>
        <option value="hard">ハード</option>
      </select>
    </div>

    <button class="startBtn" onclick="startGame()">会社を設立する</button>
  </div>
</div>

<div id="game">

  <div id="topbar">
    <div class="logo">🎮 ゲーム開発記</div>

    <div class="stat">
      <small>会社</small>
      <strong id="topCompany">---</strong>
    </div>

    <div class="stat">
      <small>資金</small>
      <strong id="topMoney" class="money">¥20,000,000</strong>
    </div>

    <div class="stat">
      <small>日付</small>
      <strong id="topDate">1年目 4月</strong>
    </div>

    <div class="stat">
      <small>ランク</small>
      <strong id="topRank">G</strong>
    </div>

    <div class="stat">
      <small>ファン</small>
      <strong id="topFans">0</strong>
    </div>

    <div class="stat">
      <small>社員</small>
      <strong id="topEmployees">0 / 4</strong>
    </div>

    <div class="stat">
      <small>開発</small>
      <strong id="topDevelopment">なし</strong>
    </div>

    <button id="pauseBtn" onclick="togglePause()">⏸ 一時停止</button>
    <button id="saveBtn" onclick="saveGame()">💾 保存</button>
  </div>

  <div id="main">

    <div id="office">
      <div id="officeCanvas">

        <div class="wall"></div>
        <div class="floor"></div>

        <div class="window w1"></div>
        <div class="window w2"></div>
        <div class="window w3"></div>
        <div class="window w4"></div>

        <div class="sign">MY GAME STUDIO</div>

        <div class="desk d1"><div class="monitor"></div><div class="keyboard"></div></div>
        <div class="desk d2"><div class="monitor"></div><div class="keyboard"></div></div>
        <div class="desk d3"><div class="monitor"></div><div class="keyboard"></div></div>
        <div class="desk d4"><div class="monitor"></div><div class="keyboard"></div></div>

        <div class="whiteboard">
          <b>今週の開発予定</b><br>
          ・企画会議<br>
          ・プログラム<br>
          ・グラフィック制作<br>

    ["ノベル",["探偵","現代","学校"]],
    ["ミステリー",["学校","探偵","現代"]],
    ["経営",["料理","スポーツ","現代"]],
    ["サンドボックス",["動物","海","未来"]],
    ["タワーディフェンス",["戦争","魔法"]],
    ["MMO",["未来","中世","魔法"]]
  ];

  for(const p of pairs){
    if(p[0]===genre && p[1].includes(theme))base+=25;
  }

  base+=randi(-12,12);
  return clamp(base,10,95);
}

}

function assignDesk(e){
  const spots=[
    {x:16,y:51},
    {x:39,y:67},
    {x:66,y:50},
    {x:82,y:68}
  ];
  const s=spots[e.deskIndex%spots.length];
  e.homeX=s.x;
  e.homeY=s.y;
}

function employeeToState(e,s){
  e.prevState=e.state;
  e.state=s;

  if(!e.el)return;

  e.el.classList.remove(
    "typing","walking","talking","resting"
  );

  if(s==="work"){
    e.el.classList.add("typing");
  }else if(s==="walk"||s==="walking"||s==="leave"){
    e.el.classList.add("walking");
  }else if(s==="talk"){
    e.el.classList.add("talking");
  }else if(s==="break"||s==="rest"){
    e.el.classList.add("resting");
  }
}

function setTarget(e,x,y){
  e.targetX=clamp(x,5,94);
  e.targetY=clamp(y,30,90);

  if(Math.abs(e.targetX-e.x)>1 || Math.abs(e.targetY-e.y)>1){
    employeeToState(e,"walking");
  }
}

function distance(e){
  return Math.hypot(e.targetX-e.x,e.targetY-e.y);
}

/* =========================================================
   滑らかな社員AI
========================================================= */

function updateEmployeeAI(e,dt){
  if(e.eventCooldown>0)e.eventCooldown-=dt;

  if(e.returningFromEvent){
    if(e.state!=="walking")employeeToState(e,"walking");
    setTarget(e,e.homeX,e.homeY);

    if(distance(e)<1.5){
      e.returningFromEvent=false;
      employeeToState(e,"work");
    }
    return;
  }

  if(e.state==="work"){
    if(Math.random()<0.0008*dt){
      const r=Math.random();

      if(r<0.10 && state.employees.length>=2){
        startTalk(e);
        return;
      }

      if(r<0.17){
        employeeToState(e,"break");
        e.breakTime=rand(3,7);
        return;
      }
    }

    setTarget(e,e.homeX,e.homeY);
    return;
  }

  if(e.state==="break"){
    e.breakTime=(e.breakTime||4)-dt;

    if(e.breakTime<=0){
      setTarget(e,e.homeX,e.homeY);
      e.breakTime=0;
    }

    if(distance(e)<1.5 && e.breakTime<=0){
      employeeToState(e,"work");
    }
    return;
  }

  if(e.state==="talk"){
    if(!e.talkTarget || !state.employees.includes(e.talkTarget)){
      setTarget(e,e.homeX,e.homeY);
      e.talkTarget=null;
      return;
    }

    const t=e.talkTarget;

    const tx=(e.x+t.x)/2;
    const ty=(e.y+t.y)/2;

    if(distance(e)>2){
      setTarget(e,tx-1.5,ty);
    }else{
      const dx=t.x-e.x;
      e.direction=dx>=0?1:-1;
      e.talkTime=(e.talkTime||0)+dt;

      if(e.talkTime>rand(3,6)){
        e.talkTarget=null;
        e.talkTime=0;
        setTarget(e,e.homeX,e.homeY);
      }
    }
    return;
  }

  if(e.state==="walking"){
    if(distance(e)<1.2){
      if(e.talkTarget){
        employeeToState(e,"talk");
      }else{
        employeeToState(e,"work");
      }
    }
  }
}

function startTalk(e){
  const others=state.employees.filter(x=>x!==e && x.state==="work");
  if(!others.length)return;

  const t=choice(others);

  e.talkTarget=t;
  t.talkTarget=e;

  const mx=(e.x+t.x)/2;
  const my=(e.y+t.y)/2;

  setTarget(e,mx-2,my);
  setTarget(t,mx+2,my);

  employeeToState(e,"walking");
  employeeToState(t,"walking");
}

function animateEmployee(e,dt){
  if(!e.el)return;

  if(e.state==="walking"||e.state==="leave"){
    const dx=e.targetX-e.x;
    const dy=e.targetY-e.y;
    const d=Math.hypot(dx,dy);

    if(d>0.05){
      const speed=13;

      const desiredX=dx/d*speed;
      const desiredY=dy/d*speed;

      const smooth=1-Math.exp(-7*dt);

      e.vx+=(desiredX-e.vx)*smooth;
      e.vy+=(desiredY-e.vy)*smooth;

      e.x+=e.vx*dt;
      e.y+=e.vy*dt;

      if(Math.abs(e.vx)>0.2)e.direction=e.vx>0?1:-1;
    }else{
      e.vx*=0.7;
      e.vy*=0.7;
      e.x=e.targetX;
      e.y=e.targetY;
    }
  }else{
    e.vx*=0.8;
    e.vy*=0.8;

    e.x+=(e.targetX-e.x)*(1-Math.exp(-8*dt));
    e.y+=(e.targetY-e.y)*(1-Math.exp(-8*dt));
  }

  const bob=
    e.state==="walking"
      ? Math.sin(performance.now()/75+e.phase)*1.2
      : e.state==="work"
        ? Math.sin(performance.now()/350+e.phase)*.25
        : 0;

  const scaleX=e.direction<0?-1:1;

  e.el.style.transform=
    `translate3d(calc(${e.x}% - 21px),calc(${e.y}% - 60px + ${bob}px),0) scaleX(${scaleX})`;
}

  const ceoX=50;
  const ceoY=76;

  setTarget(e,ceoX+rand(-3,3),ceoY);

  const check=()=>{
    if(!state || paused)return;

    if(distance(e)<2.2){
      employeeToState(e,"talk");
      showEmployeeEvent(e);
      return;
    }

    requestAnimationFrame(check);
  };

  requestAnimationFrame(check);
}

function recruitment(type){

  const data={
    general:{fee:200000,min:2,max:4,qualityMin:30,qualityMax:58,name:"一般採用"},
    active:{fee:400000,min:3,max:6,qualityMin:40,qualityMax:68,name:"積極採用"},

/* =========================================================
   ゲーム開発
========================================================= */

function startDevelopment(){
  if(state.development){
    showToast("現在すでにゲームを開発中です。");
    return;
  }

  const genre=$("devGenre").value;
  const theme=$("devTheme").value;
  const scale=$("devScale").value;

  const data={
    small:{name:"小規模",min:1000000,max:2500000,weeks:4,qualityCap:70},
    medium:{name:"中規模",min:3000000,max:8000000,weeks:8,qualityCap:85},
    large:{name:"大規模",min:8000000,max:25000000,weeks:16,qualityCap:95},
    huge:{name:"超大規模",min:20000000,max:80000000,weeks:32,qualityCap:100}
  }[scale];

  const budget=Number($("devBudget").value);

  if(!budget || budget<data.min || budget>data.max){
    showToast("予算は"+money(data.min)+"〜"+money(data.max)+"の範囲で設定してください。");
    return;
  }

  if(state.money<budget){
    showToast("その予算を支払う資金がありません。");
    return;
  }

  if(state.employees.length===0){
    showToast("社員がいないためゲームを作れません。");
    return;
  }

  state.money-=budget;

  const compatibility=getCompatibility(genre,theme);

  const teamAvg=state.employees.reduce((a,e)=>a+average(e),0)/state.employees.length;

  const relevantAvg=
    state.employees.reduce((sum,e)=>{
      let v=
        e.programming*.22+
        e.graphics*.22+
        e.scenario*.18+
        e.sound*.18+
        e.planning*.20;

      if(e.specialty===genre)v+=5;

      return sum+v;
    },0)/state.employees.length;

  const speedBonus=clamp(
    1+(teamAvg-45)/250+
    state.employees.length*.018,
    .85,
    1.35
  );

  const requiredWeeks=Math.max(
    data.weeks,
    Math.round(data.weeks/speedBonus)
  );

  state.development={
    title:"",
    genre,
    theme,
    scale,
    scaleName:data.name,
    budget,
    originalBudget:budget,
    minWeeks:data.weeks,
    requiredWeeks,
    elapsedWeeks:0,
    progress:0,
    compatibility,
    teamAvg,
    relevantAvg,
    qualityCap:data.qualityCap,
    innovation:0,
    qualityBonus:0,
    quality:0,
    released:false
  };

  panelDirty=true;
  showToast("ゲーム開発開始！ "+data.name+" / "+money(budget));
}

function cancelDevelopment(){
  if(!state.development)return;

  const d=state.development;
  const refund=Math.floor(d.budget*.35);

  if(!confirm("開発を中止しますか？\n返金は"+money(refund)+"です。"))return;

  state.money+=refund;
  state.development=null;

  showToast("開発を中止しました。");
  panelDirty=true;
}

function advanceDevelopment(){
  const d=state.development;
  if(!d)return;

  d.elapsedWeeks++;

  const team=state.employees.reduce((sum,e)=>{
    let v=average(e);

    if(e.specialty===d.genre)v+=6;

    return sum+v;
  },0)/Math.max(1,state.employees.length);

  const weeklyGain=
    100/d.requiredWeeks*
    (1+
      (team-50)/250+
      d.compatibility/500+
      state.employees.length/500
    );

  d.progress=clamp(
    d.progress+weeklyGain,
    0,
    100
  );

  for(const e of state.employees){
    let growth=.08;

    if(e.personality.name==="努力家")growth=.16;
    if(e.personality.name==="熱血")growth=.12;

    e.experience+=growth;
    e.motivation=clamp(e.motivation-rand(.2,.8),0,100);
  }

  if(d.elapsedWeeks>=d.requiredWeeks || d.progress>=100){
    d.progress=100;
    finishDevelopment();
  }
}

function finishDevelopment(){
  const d=state.development;
  if(!d)return;

  let quality=
    d.relevantAvg*.38+
    d.compatibility*.28+
    Math.min(100,d.budget/d.maxBudgetForQuality||d.budget/500000)*.05+
    d.qualityBonus+
    d.innovation+
    rand(-7,7);

  if(d.scale==="small")quality-=4;
  if(d.scale==="medium")quality+=2;
  if(d.scale==="large")quality+=5;
  if(d.scale==="huge")quality+=8;

  quality=clamp(quality,20,d.qualityCap);

  const price=randi(1980,6980);

  const titleParts=[
    "クロニクル","レジェンド","ネクサス","フロンティア",
    "メモリーズ","エクリプス","ブレイブ","ワールド",
    "クロス","オデッセイ","プロジェクト"
  ];

  const title=choice(titleParts)+" "+choice(["I","II","X","ZERO","R","NEXT","ONLINE"]);

  const game={
    id:"g"+Date.now(),
    title,
    genre:d.genre,
    theme:d.theme,
    scale:d.scaleName,
    budget:d.budget,
    price,
    quality:Math.round(quality),
    releaseWeek:state.totalWeeks,
    weeklySales:0,
    lifetimeSales:0,
    revenue:0,
    weeksOnSale:0,
    rating:clamp(
      3+
      (quality-50)/15+
      rand(-.4,.4),
      1,
      5
    ),
    active:true,
    hype:clamp(
      30+
      quality*.5+
      d.compatibility*.15+
      rand(-10,10),
      10,100
    )
  };

  state.games.push(game);
  state.gameCount++;

  state.development=null;

  state.fans+=Math.floor(game.quality*2);

  showToast("🎉「"+title+"」が完成しました！ 評価 "+game.rating.toFixed(1)+" / 5");
  panelDirty=true;
}

/* =========================================================
   ゲーム販売
========================================================= */

function processGameSales(){
  for(const g of state.games){
    if(!g.active)continue;

    g.weeksOnSale++;

    const trendBonus=
      g.genre===state.market.genre?1+state.market.strength/100:1;

    const themeBonus=
      g.theme===state.market.theme?1+state.market.strength/160:1;

    const qualityBonus=
      .45+(g.quality/100)*1.2;

    const ratingBonus=
      .5+g.rating/4;

    const hypeBonus=
      .7+g.hype/120;

    let base=
      35+
      g.quality*2.3+
      g.hype*.8+
      state.fans*.015;

    base*=trendBonus*themeBonus*qualityBonus*ratingBonus*hypeBonus;

    base*=Math.pow(.94,Math.max(0,g.weeksOnSale-1));

    if(Math.random()<.08){
      base*=rand(1.5,3.5);
      showToast("📢 SNSで"+g.title+"が話題になりました！");
    }

    const sales=Math.max(0,Math.floor(base*rand(.65,1.25)));

    const revenue=sales*g.price;
    const actual=Math.floor(revenue*.72);

    g.weeklySales=sales;
    g.lifetimeSales+=sales;
    g.revenue+=actual;

    state.money+=actual;
    state.totalSales+=sales;
    state.totalRevenue+=actual;

    state.fans+=Math.max(
      0,
      Math.floor(
        sales*(.008+g.rating/1000)
      )
    );

    g.hype=clamp(
      g.hype*(.97)+rand(-1,2),
      5,
      100
    );

    if(g.weeksOnSale>100 && sales<5){
      g.active=false;
    }
  }
}

/* =========================================================
   時間
========================================================= */

function advanceWeek(){
  if(paused || !state || state.gameOver)return;

  state.totalWeeks++;
  state.week++;

  if(state.week>4){
    state.week=1;
    state.month++;

    if(state.month>12){
      state.month=1;
      state.year++;
    }
  }

  advanceDevelopment();
  processGameSales();
  updateMarket();

  /* 給料は翌年度4月から */
  if(state.month===4 && state.week===1 && state.year>=2){
    if(!state.salaryPaidYears.includes(state.year)){
      paySalaries();
    }
  }

  /* 社員成長 */
  for(const e of state.employees){
    const gain=e.personality.name==="努力家"?.35:.18;
    e.experience+=gain;

    if(e.personality.name==="熱血"){
      e.motivation=clamp(e.motivation+1,0,100);
    }
  }

  state.rank=getRank();

  employeeEventTimer++;

  if(employeeEventTimer>=state.nextEmployeeEvent && !eventBusy){
    employeeEventTimer=0;
    state.nextEmployeeEvent=rand(30,65);

    const e=chooseEmployeeForVisit();

    if(e){
      sendEmployeeToPresident(e);
    }
  }

  renderTop();

  if(panelDirty){
    renderPanel();
    panelDirty=false;
  }

  checkBankruptcy();
}

function paySalaries(){
  let total=0;

  for(const e of state.employees){
    e.salary=e.salary||salaryOf(e);
    total+=e.salary;
  }

  state.money-=total;
  state.salaryPaidYears.push(state.year);

  showToast("💴 "+state.year+"年目の給与を支払いました："+money(total));
}

      <h3>👥 社員 ${state.employees.length}/${currentMaxEmployees()}</h3>
      <p class="muted">
        採用そのものにも費用がかかります。応募者が必ず集まります。
      </p>

      <button class="blue smallBtn" onclick="recruitment('general')">
        📢 一般採用　20万円
      </button>
      <button class="blue smallBtn" onclick="recruitment('active')">
        📣 積極採用　40万円
      </button>
      <button class="purple smallBtn" onclick="recruitment('skilled')">
        ⭐ 優秀人材採用　80万円
      </button>
      <button class="orange smallBtn" onclick="recruitment('headhunt')">
        💎 ヘッドハント　150万円
      </button>
    </div>
  `;

  if(!state.employees.length){
    html+=`
      <div class="card">
        <p>まだ社員はいません。</p>
        <p class="muted">まずは採用して会社を動かしましょう。</p>
      </div>
    `;
  }

  for(const e of state.employees){
    const a=Math.round(average(e));

    html+=`
      <div class="employeeRow">
        <div class="employeeRowTop">
          <b>${e.personality.icon} ${e.name}</b>
          <span>${e.age}歳</span>
        </div>

        <div class="muted">
          ${jobName(e.job)} / 得意：${e.specialty}
        </div>

        <div class="statline">
          <span>総合能力</span><b>${a}</b>
        </div>
        <div class="statline">
          <span>経験</span><b>${e.experience.toFixed(1)}</b>
        </div>
        <div class="statline">
          <span>モチベーション</span><b>${Math.round(e.motivation)}</b>
        </div>
        <div class="statline">
          <span>年収</span><b>${money(e.salary||salaryOf(e))}</b>
        </div>

        <div class="muted" style="margin-top:6px">
          ${e.personality.name}：${e.personality.desc}
        </div>
      </div>
    `;
  }

  box.innerHTML=html;
}

function jobName(id){
  const j=jobs.find(x=>x.id===id);
  return j?j.icon+" "+j.name:"社員";
}

  for(const g of [...state.games].reverse()){

      <div class="card">

function renderCompanyPanel(box){
  const nextRank=rankOrder[
    Math.min(rankOrder.length-1,rankOrder.indexOf(getRank())+1)
  ];

  const need=
    getRank()==="S"
      ? "最高ランク"
      : num(Math.max(0,rankData[nextRank].need-state.fans));

  let awardHtml=state.awards.length
    ? state.awards.map(a=>`<p>🏆 ${a.year}年 ${a.name}：${a.game}</p>`).join("")
    : `<p class="muted">まだ受賞していません。</p>`;

  box.innerHTML=`
    <div class="card">
      <h3>🏢 ${state.company}</h3>
      <p>社長：${state.president}</p>
      <p>会社ランク：<b>${getRank()}</b></p>
      <p>次ランクまで：<b>${need}</b></p>
      <p>ファン：<b>${num(state.fans)}</b></p>
      <p>ゲーム発売数：<b>${state.gameCount}</b></p>
    </div>

    <div class="card">
      <h3>💴 財務</h3>
      <div class="statline"><span>現在資金</span><b>${money(state.money)}</b></div>
      <div class="statline"><span>総売上</span><b>${money(state.totalRevenue)}</b></div>
      <div class="statline"><span>販売本数</span><b>${num(state.totalSales)}</b></div>
      <p class="muted">
        毎週の固定費：0円<br>

/* =========================================================
   年末賞
========================================================= */

function checkAwards(){
  if(state.month!==12 || state.week!==4)return;

  if(!state.games.length)return;

  const year=state.year;

  const eligible=state.games.filter(g=>
    g.releaseWeek<state.totalWeeks &&
    g.weeksOnSale>=1
  );

  if(!eligible.length)return;

  const categories=[
    {name:"年間ゲーム大賞",score:g=>g.quality+g.rating*10+g.hype*.2},
    {name:"最優秀グラフィック賞",score:g=>g.quality+(g.genre==="アクション"?8:0)},
    {name:"最優秀シナリオ賞",score:g=>g.quality+(g.genre==="ノベル"||g.genre==="ミステリー"?12:0)},
    {name:"最優秀サウンド賞",score:g=>g.quality+(g.genre==="音楽"?15:0)},
    {name:"最優秀アイデア賞",score:g=>g.quality+g.hype*.3},
    {name:"プレイヤー投票賞",score:g=>g.lifetimeSales*.01+g.rating*15}
  ];

  for(const c of categories){
    let winner=eligible[0];

    for(const g of eligible){
      if(c.score(g)>c.score(winner))winner=g;
    }

    state.awards.push({
      year,
      name:c.name,
      game:winner.title
    });

    state.fans+=randi(100,800);
    winner.hype=clamp(winner.hype+20,0,100);
  }

  showToast("🏆 "+year+"年のゲーム・オブ・ザ・イヤーが発表されました！");
}

/* =========================================================
   セーブ
========================================================= */

function saveGame(){
  if(!state)return;

  const copy=JSON.parse(JSON.stringify(state));

  copy.employees.forEach(e=>{
    delete e.el;
  });

  localStorage.setItem("gameDevelopmentSave",JSON.stringify(copy));
  showToast("ゲームを保存しました。");
}

function loadGame(){
  const raw=localStorage.getItem("gameDevelopmentSave");

  if(!raw){
    showToast("セーブデータがありません。");
    return;
  }

  try{
    state=JSON.parse(raw);

    state.employees.forEach((e,i)=>{
      e.el=null;
      e.returningFromEvent=false;
      e.talkTarget=null;
      e.deskIndex=i%4;
      assignDesk(e);
    });

    gameStarted=true;
    paused=false;

    $("startScreen").style.display="none";
    $("game").style.display="flex";

    createEmployeeLayer();
    renderTop();
    renderPanel();

    showToast("セーブデータを読み込みました。");
  }catch(err){
    alert("セーブデータを読み込めませんでした。");
  }
}

/* =========================================================
   一時停止
========================================================= */

function togglePause(){
  paused=!paused;

  $("pauseBtn").textContent=
    paused?"▶ 再開":"⏸ 一時停止";

  showToast(paused?"ゲームを一時停止しました。":"ゲームを再開しました。");
}

/* =========================================================
   倒産
========================================================= */

function checkBankruptcy(){
  if(state.money<-5000000){
    state.gameOver=true;
    paused=true;
    $("gameOver").style.display="flex";
  }
}

/* =========================================================
   トースト
========================================================= */

let toastTimeout=null;

function showToast(text){
  const t=$("toast");
  t.textContent=text;
  t.classList.add("show");

  clearTimeout(toastTimeout);

  toastTimeout=setTimeout(()=>{
    t.classList.remove("show");
  },2600);
}

/* =========================================================
   メインループ
========================================================= */

function gameLoop(now){
  if(!gameStarted)return;

  const dt=Math.min(.05,(now-lastFrame)/1000);
  lastFrame=now;

  if(!paused && state && !state.gameOver){

    /* 社員のAIとアニメーション */
    for(const e of state.employees){
      updateEmployeeAI(e,dt);
      animateEmployee(e,dt);
    }

    /* 15秒 = 1週間 */
    weekTimer+=dt;

    if(weekTimer>=15){
      weekTimer-=15;
      advanceWeek();
    }

    /* UIは毎フレーム作り直さず、約0.2秒ごとに数字だけ更新 */
    uiTimer+=dt;

    if(uiTimer>=.2){
      uiTimer=0;
      updateLiveUI();
    }

    saveTimer+=dt;

    if(saveTimer>=20){
      saveTimer=0;
      saveGameSilent();
    }
  }

  requestAnimationFrame(gameLoop);
}

function saveGameSilent(){
  if(!state)return;

  const copy=JSON.parse(JSON.stringify(state));

  copy.employees.forEach(e=>{
    delete e.el;
    delete e.talkTarget;
  });

  localStorage.setItem("gameDevelopmentSave",JSON.stringify(copy));
}

/* =========================================================
   キーボード
========================================================= */

document.addEventListener("keydown",e=>{
  if(e.key===" " && gameStarted){
    e.preventDefault();
    togglePause();
  }

  if(e.key==="s" && !gameStarted){
    startGame();
  }
});

/* =========================================================
   開発予算の初期設定
========================================================= */

document.addEventListener("change",e=>{
  if(e.target.id==="devScale"){
    updateBudgetRange();
  }
});

/* =========================================================
   ページ読み込み時
========================================================= */

window.addEventListener("load",()=>{
  if(localStorage.getItem("gameDevelopmentSave")){
    const b=document.createElement("button");

    b.textContent="💾 前回のデータを読み込む";
    b.className="gray";
    b.style.width="100%";
    b.style.marginTop="8px";

    b.onclick=loadGame;

    $("startScreen").querySelector(".startBox").appendChild(b);
  }
});
</script>
