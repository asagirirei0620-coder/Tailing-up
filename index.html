<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ゲーム開発記</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#07111f;
  --panel:#0e1b2d;
  --panel2:#13243a;
  --line:#28425f;
  --text:#eef6ff;
  --muted:#91a6bd;
  --accent:#58b7ff;
  --green:#4be39b;
  --yellow:#ffd166;
  --red:#ff637d;
  --purple:#ad8cff;
}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}

#app{height:100%;display:flex;flex-direction:column}
.topbar{
  height:78px;flex:0 0 78px;
  display:flex;align-items:center;gap:18px;
  padding:10px 18px;background:#091625;
  border-bottom:1px solid var(--line);z-index:10
}
.logo{font-weight:900;font-size:24px;letter-spacing:1px;white-space:nowrap}
.companyTop{min-width:170px}
.companyTop b{display:block;font-size:15px}
.companyTop span{font-size:12px;color:var(--muted)}
.topStat{padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:#0d1d30;min-width:110px}
.topStat small{display:block;color:var(--muted);font-size:10px}
.topStat strong{font-size:16px}
.rankBadge{font-weight:900;color:var(--yellow)}
.topActions{margin-left:auto;display:flex;gap:8px}
.topActions button{
  background:#14283f;color:white;border:1px solid #31516f;
  border-radius:10px;padding:10px 14px
}
.topActions button:hover{background:#1b3655}

.main{flex:1;display:flex;min-height:0}
.officeWrap{flex:1;min-width:0;position:relative;padding:18px}
.office{
  width:100%;height:100%;position:relative;overflow:hidden;
  border:1px solid #31516d;border-radius:20px;
  background:
    radial-gradient(circle at 15% 15%,rgba(88,183,255,.10),transparent 25%),
    linear-gradient(#172c42 0 58%,#9a6a43 58% 100%);
  box-shadow:inset 0 0 80px rgba(0,0,0,.25)
}
.window{
  position:absolute;top:8%;width:22%;height:25%;
  background:linear-gradient(135deg,#8bd7ff,#294f72 65%,#122b45);
  border:9px solid #60442f;border-radius:8px;
  box-shadow:0 10px 20px rgba(0,0,0,.25)
}
.window:after,.window:before{content:"";position:absolute;background:#74533a}
.window:after{left:50%;top:0;width:6px;height:100%;transform:translateX(-50%)}
.window:before{top:50%;left:0;width:100%;height:6px;transform:translateY(-50%)}
.w1{left:5%}.w2{left:31%}.w3{left:57%}

.wallLogo{
  position:absolute;right:4%;top:9%;width:25%;height:15%;
  display:flex;align-items:center;justify-content:center;
  font-weight:1000;font-size:clamp(16px,2vw,30px);
  color:#dff4ff;border:3px solid #31516d;
  background:rgba(7,17,31,.65);border-radius:16px;
  text-shadow:0 2px 10px #000
}
.floorLine{position:absolute;left:0;right:0;top:58%;height:8px;background:#754e32}

.desk{
  position:absolute;width:150px;height:60px;background:#563a28;
  border:4px solid #38261b;border-radius:5px;box-shadow:0 8px 10px rgba(0,0,0,.25)
}
.desk:before{content:"";position:absolute;left:15px;right:15px;top:9px;height:27px;background:#1c2c3b;border:4px solid #0c1824}
.desk:after{content:"";position:absolute;left:14px;bottom:-25px;width:8px;height:25px;background:#38261b;box-shadow:110px 0 #38261b}
.d1{left:7%;top:45%}.d2{left:34%;top:43%}.d3{left:61%;top:45%}.d4{left:13%;top:72%}.d5{left:43%;top:70%}.d6{left:70%;top:72%}

.ceoArea{
  position:absolute;left:50%;bottom:3%;transform:translateX(-50%);
  width:230px;height:120px;border-radius:16px;
  background:rgba(8,17,28,.65);border:2px solid #5b7894;
  display:flex;align-items:center;justify-content:center;gap:14px;
  z-index:3
}
.ceoDesk{position:absolute;bottom:13px;width:150px;height:45px;background:#4a3020;border:4px solid #2b1d15;border-radius:4px}
.ceoChar{position:relative;width:55px;height:82px;z-index:2}
.ceoChar .head{position:absolute;top:0;left:16px;width:25px;height:25px;background:#e9b38e;border-radius:50%;border:2px solid #34261e}
.ceoChar .hair{position:absolute;top:-2px;left:14px;width:29px;height:11px;background:#242a33;border-radius:10px 10px 3px 3px}
.ceoChar .body{position:absolute;top:25px;left:11px;width:35px;height:38px;background:#182435;border-radius:7px;border:2px solid #0b1119}
.ceoChar .tie{position:absolute;top:29px;left:25px;width:7px;height:23px;background:#d84c61;clip-path:polygon(20% 0,80% 0,100% 65%,50% 100%,0 65%)}
.ceoChar .arm{position:absolute;top:29px;width:10px;height:34px;background:#182435;border-radius:8px}
.ceoChar .a1{left:3px;transform:rotate(12deg)}.ceoChar .a2{right:3px;transform:rotate(-12deg)}
.ceoChar .leg{position:absolute;top:60px;width:12px;height:22px;background:#17202d;border-radius:5px}
.ceoChar .l1{left:15px}.ceoChar .l2{left:29px}
.ceoLabel{position:absolute;bottom:5px;font-size:11px;color:#b8cee2}

.employeeLayer{position:absolute;inset:0;z-index:5;pointer-events:none}
.employee{
  position:absolute;width:54px;height:76px;pointer-events:auto;
  transition:none;cursor:pointer;filter:drop-shadow(0 5px 4px rgba(0,0,0,.3))
}
.empBody{position:absolute;left:13px;top:27px;width:28px;height:30px;border:2px solid #222;border-radius:6px}
.empHead{position:absolute;left:16px;top:5px;width:23px;height:23px;border:2px solid #222;border-radius:50%;background:#e4ae87;z-index:3}
.empHair{position:absolute;left:14px;top:2px;width:28px;height:12px;border-radius:13px 13px 4px 4px;z-index:4}
.empArm{position:absolute;top:29px;width:8px;height:27px;border-radius:8px;background:inherit}
.empArm.a{left:6px;transform:rotate(16deg)}.empArm.b{right:6px;transform:rotate(-16deg)}
.empLeg{position:absolute;top:55px;width:9px;height:19px;background:#202b38;border-radius:5px}
.empLeg.a{left:17px}.empLeg.b{left:29px}
.empTool{position:absolute;z-index:5;font-size:15px;right:-4px;bottom:20px}
.empName{
  position:absolute;top:-18px;left:50%;transform:translateX(-50%);
  white-space:nowrap;font-size:10px;background:#07111fdd;
  border:1px solid #46627d;border-radius:5px;padding:2px 5px
}
.walking .empLeg.a{animation:walk .25s infinite alternate}
.walking .empLeg.b{animation:walk .25s infinite alternate-reverse}
.working .empArm.a{animation:type .18s infinite alternate}
.working .empArm.b{animation:type .18s infinite alternate-reverse}
@keyframes walk{to{transform:translateY(-3px) rotate(12deg)}}
@keyframes type{to{transform:rotate(28deg)}}

.officeHint{
  position:absolute;left:20px;bottom:18px;padding:9px 13px;
  background:#07111dcc;border:1px solid #38536e;border-radius:10px;
  color:#b9cde0;font-size:12px;z-index:8
}

.menuBar{
  flex:0 0 270px;width:270px;padding:18px 18px 18px 0;
  display:flex;flex-direction:column;gap:10px
}
.menuBtn{
  min-height:65px;background:linear-gradient(135deg,#13283e,#0d1c2e);
  border:1px solid #2d4c68;border-radius:14px;color:#eef6ff;
  display:flex;align-items:center;gap:14px;padding:0 18px;
  font-size:17px;font-weight:800;text-align:left;
  transition:.15s;box-shadow:0 5px 12px rgba(0,0,0,.16)
}
.menuBtn .icon{font-size:25px;width:35px;text-align:center}
.menuBtn:hover{transform:translateX(-3px);border-color:#5caeff;background:#17334f}
.menuBtn:active{transform:translateX(0) scale(.98)}
.menuSpacer{flex:1}
.smallMenu{
  min-height:48px;font-size:14px;background:#0c1a2a;color:#91a6bd;
  border:1px solid #233b53;border-radius:11px
}

.overlay{
  position:fixed;inset:0;background:rgba(1,6,12,.76);backdrop-filter:blur(8px);
  z-index:100;display:none;align-items:center;justify-content:center;padding:30px
}
.overlay.open{display:flex}
.modal{
  width:min(1180px,94vw);height:min(760px,90vh);
  background:#0b1727;border:1px solid #3c5e7e;border-radius:22px;
  box-shadow:0 30px 100px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow:hidden
}
.modalHeader{
  height:72px;flex:0 0 72px;padding:0 24px;display:flex;align-items:center;
  border-bottom:1px solid #27435e;background:#0e1c2e
}
.modalHeader h2{margin:0;font-size:24px}
.modalClose{
  margin-left:auto;width:44px;height:44px;border-radius:12px;
  background:#1a2d43;color:white;font-size:22px
}
.modalBody{padding:24px;overflow:auto;flex:1}

.grid{display:grid;gap:14px}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{
  background:#102136;border:1px solid #2b4966;border-radius:15px;padding:16px
}
.card h3{margin:0 0 10px}
.muted{color:var(--muted)}
.bigMoney{font-size:32px;font-weight:1000;color:var(--green)}
.value{font-size:22px;font-weight:900}
.tag{
  display:inline-flex;padding:4px 8px;border-radius:999px;
  background:#1a3854;border:1px solid #355c7e;font-size:11px;margin:2px
}
.btn{
  padding:11px 15px;border-radius:10px;background:#1a3651;
  color:white;border:1px solid #3d6487;font-weight:800
}
.btn:hover{background:#224766}
.btn.green{background:#15563e;border-color:#3ba878}
.btn.red{background:#5a1e2a;border-color:#a94358}
.btn.yellow{background:#594719;border-color:#b79237}
.btn:disabled{opacity:.4;cursor:not-allowed}
.input,.select{
  width:100%;padding:12px;background:#091523;color:white;
  border:1px solid #35516b;border-radius:10px;outline:none
}
.input:focus,.select:focus{border-color:#63baff}
.label{font-size:12px;color:#9db1c6;margin-bottom:5px;display:block}

.progress{
  height:13px;background:#081321;border-radius:999px;overflow:hidden;border:1px solid #2b465e
}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#4eb5ff,#8d7dff);width:0;transition:width .3s}

.statGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.statBox{padding:10px;border-radius:10px;background:#0a1726;border:1px solid #263f58;text-align:center}
.statBox small{display:block;color:#8da4ba;font-size:10px}.statBox b{font-size:18px}

.recruitLayout{display:grid;grid-template-columns:1fr 1.05fr;gap:18px;height:100%}
.candidateList{overflow:auto;padding-right:5px}
.candidate{
  padding:15px;border:1px solid #2a4660;border-radius:13px;
  background:#0d1d30;margin-bottom:9px;cursor:pointer
}
.candidate.selected{border:2px solid #63bcff;background:#15304a;box-shadow:0 0 20px rgba(88,183,255,.12)}
.candidateTop{display:flex;justify-content:space-between;gap:8px}
.candidateName{font-weight:900}.candidateMeta{font-size:11px;color:#9bb0c4}
.candidateCost{color:#ffd166;font-weight:900}
.candidateStats{font-size:11px;color:#a9bed1;margin-top:7px;line-height:1.6}
.candidatePreview{
  border:1px solid #2b4965;border-radius:17px;background:#091625;
  display:flex;flex-direction:column;min-height:0
}
.previewArt{
  flex:1;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at center,rgba(88,183,255,.12),transparent 45%),
    #07111f;position:relative;min-height:330px
}
.bigPixel{transform:scale(2.3)}
.previewInfo{padding:18px;border-top:1px solid #27435e}

.employeeList{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.employeeCard{
  padding:15px;border-radius:14px;border:1px solid #2a4761;
  background:#0e2034;cursor:pointer
}
.employeeCard:hover{border-color:#5dbaff;transform:translateY(-2px)}
.empCardHead{display:flex;align-items:center;gap:10px}
.miniPixel{width:50px;height:65px;position:relative;flex:none}
.miniPixel>*{position:absolute}
.miniPixel .mh{left:14px;top:2px;width:23px;height:23px;border-radius:50%;border:2px solid #222;background:#e4ae87}
.miniPixel .mc{left:11px;top:25px;width:29px;height:30px;border:2px solid #222;border-radius:6px}
.miniPixel .ml{left:14px;top:54px;width:9px;height:12px;background:#202b38;box-shadow:14px 0 #202b38}
.empLevel{margin-left:auto;color:#ffd166;font-weight:900}
.employeeCard .progress{margin-top:10px;height:9px}
.employeeActions{display:flex;gap:8px;margin-top:12px}

.detailLayout{display:grid;grid-template-columns:230px 1fr;gap:22px}
.detailArt{
  background:#091625;border:1px solid #29465f;border-radius:16px;
  min-height:390px;display:flex;align-items:center;justify-content:center
}
.detailMain{min-width:0}
.detailTitle{display:flex;align-items:center;gap:10px}
.detailTitle h3{font-size:27px;margin:0}
.levelLine{font-size:18px;color:#ffd166;font-weight:900}
.xpText{color:#9eb4c9;font-size:12px;margin:6px 0}
.eventBox{
  background:#122b43;border:1px solid #396486;border-radius:13px;
  padding:14px;margin-bottom:10px
}

.gameCard{
  border:1px solid #2b4963;background:#0e2034;border-radius:15px;padding:16px
}
.gameTitle{font-size:21px;font-weight:1000}
.gameMeta{color:#9eb2c5;font-size:12px;margin:4px 0 12px}
.gameStats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gameStat{background:#091625;padding:9px;border-radius:9px;text-align:center}
.gameStat small{display:block;color:#8fa4b8}.gameStat b{font-size:15px}

.notice{
  padding:12px 14px;border-radius:11px;background:#152c43;
  border:1px solid #355875;margin-bottom:12px
}
.notice.good{border-color:#2e9b71;background:#0f3228}
.notice.warn{border-color:#a37d2d;background:#332812}
.notice.bad{border-color:#a33b52;background:#381521}

.rankHero{
  padding:22px;border:1px solid #395976;border-radius:18px;
  background:linear-gradient(135deg,#142c45,#0b1828)
}
.rankText{font-size:46px;font-weight:1000;color:#ffd166}
.rankBar{margin-top:12px}

.log{
  max-height:230px;overflow:auto;background:#07111f;border:1px solid #263f57;
  padding:10px;border-radius:10px;font-size:12px;line-height:1.7
}
.log div{border-bottom:1px solid #162b40;padding:3px 0}

@media(max-width:1000px){
  .menuBar{width:210px;flex-basis:210px}
  .menuBtn{font-size:14px;padding:0 12px}.menuBtn .icon{font-size:20px}
  .topStat{min-width:90px}.companyTop{display:none}
}
@media(max-width:760px){
  .topbar{height:65px;flex-basis:65px;padding:8px}
  .logo{font-size:17px}.topStat{padding:5px 8px;min-width:75px}
  .topStat strong{font-size:12px}.topActions button{padding:8px}
  .officeWrap{padding:8px}.menuBar{padding:8px 8px 8px 0;width:115px;flex-basis:115px}
  .menuBtn{min-height:55px;justify-content:center;padding:5px}.menuBtn span{display:none}
  .menuBtn .icon{width:auto;font-size:24px}
  .grid2,.grid3,.recruitLayout,.detailLayout{grid-template-columns:1fr}
  .employeeList{grid-template-columns:1fr}
  .statGrid{grid-template-columns:repeat(3,1fr)}
  .gameStats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="logo">🎮 ゲーム開発記</div>
    <div class="companyTop">
      <b id="topCompany">未設定</b>
      <span id="topPresident">社長：未設定</span>
    </div>
    <div class="topStat">
      <small>資金</small>
      <strong id="topMoney">2,000万円</strong>
    </div>
    <div class="topStat">
      <small>会社ランク</small>
      <strong id="topRank" class="rankBadge">G−</strong>
    </div>
    <div class="topStat">
      <small>会社Lv.</small>
      <strong id="topCompanyLv">1</strong>
    </div>
    <div class="topStat">
      <small>経過</small>
      <strong id="topDate">1年4月 第1週</strong>
    </div>
    <div class="topActions">
      <button onclick="togglePause()" id="pauseBtn">⏸ 停止</button>
      <button onclick="saveGame()">💾 保存</button>
    </div>
  </header>

  <main class="main">
    <section class="officeWrap">
      <div class="office" id="office">
        <div class="window w1"></div>
        <div class="window w2"></div>
        <div class="window w3"></div>
        <div class="wallLogo" id="officeLogo">YOUR GAME COMPANY</div>
        <div class="floorLine"></div>

        <div class="desk d1"></div>
        <div class="desk d2"></div>
        <div class="desk d3"></div>
        <div class="desk d4"></div>
        <div class="desk d5"></div>
        <div class="desk d6"></div>

        <div class="ceoArea">
          <div class="ceoChar">
            <div class="hair"></div><div class="head"></div>
            <div class="body"></div><div class="tie"></div>
            <div class="arm a1"></div><div class="arm a2"></div>
            <div class="leg l1"></div><div class="leg l2"></div>
          </div>
          <div>
            <b id="ceoName">社長</b><br>
            <span class="muted" style="font-size:11px">CEO</span>
          </div>
          <div class="ceoDesk"></div>
          <div class="ceoLabel">会社の未来を見守っている</div>
        </div>

        <div class="employeeLayer" id="employeeLayer"></div>

        <div class="officeHint">
          🏢 オフィスを眺めながら会社を経営しよう　｜　社員をクリックすると詳細を確認できます
        </div>
      </div>
    </section>

    <aside class="menuBar">
      <button class="menuBtn" onclick="openMenu('development')"><span class="icon">🎮</span><span>ゲーム開発</span></button>
      <button class="menuBtn" onclick="openMenu('recruit')"><span class="icon">👥</span><span>社員採用</span></button>
      <button class="menuBtn" onclick="openMenu('employees')"><span class="icon">🧑‍💻</span><span>社員</span></button>
      <button class="menuBtn" onclick="openMenu('games')"><span class="icon">📦</span><span>ゲーム</span></button>
      <button class="menuBtn" onclick="openMenu('company')"><span class="icon">🏢</span><span>会社</span></button>
      <button class="menuBtn" onclick="openMenu('finance')"><span class="icon">💰</span><span>財務</span></button>
      <button class="menuBtn" onclick="openMenu('awards')"><span class="icon">🏆</span><span>実績</span></button>
      <div class="menuSpacer"></div>
      <button class="menuBtn smallMenu" onclick="openMenu('settings')"><span class="icon">⚙️</span><span>設定</span></button>
    </aside>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modalHeader">
      <h2 id="modalTitle"></h2>
      <button class="modalClose" onclick="closeMenu()">✕</button>
    </div>
    <div class="modalBody" id="modalBody"></div>
  </div>
</div>

<script>
"use strict";

/* =========================================================
   基本定数
========================================================= */
const WEEK_MS = 15000;
const SAVE_KEY = "GAME_DEVELOPMENT_RECORD_V5";

const RANKS = [
  {id:"G-",name:"G−",xp:0},
  {id:"G",name:"G",xp:100},
  {id:"G+",name:"G＋",xp:250},
  {id:"F-",name:"F−",xp:500},
  {id:"F",name:"F",xp:850},
  {id:"F+",name:"F＋",xp:1300},
  {id:"E-",name:"E−",xp:1900},
  {id:"E",name:"E",xp:2700},
  {id:"E+",name:"E＋",xp:3700},
  {id:"D-",name:"D−",xp:5000},
  {id:"D",name:"D",xp:6500},
  {id:"D+",name:"D＋",xp:8500},
  {id:"C",name:"C",xp:11000},
  {id:"B",name:"B",xp:15000},
  {id:"A",name:"A",xp:20000},
  {id:"S",name:"S",xp:30000}
];

const RANK_INFO = {
  "G-":{max:4},
  "G":{max:4},
  "G+":{max:4},
  "F-":{max:4},
  "F":{max:4},
  "F+":{max:4},
  "E-":{max:4},
  "E":{max:4},
  "E+":{max:4},
  "D-":{max:8},
  "D":{max:8},
  "D+":{max:8},
  "C":{max:10},
  "B":{max:10},
  "A":{max:20},
  "S":{max:Infinity}
};

const EXP_THRESHOLD = level => 100 + (level - 1) * 50;

const RECRUIT_TYPES = {
  general:{
    name:"📢 一般募集",fee:200000,min:2,max:4,
    minLv:1,maxLv:4,boost:0
  },
  active:{
    name:"📣 積極募集",fee:400000,min:3,max:6,
    minLv:2,maxLv:6,boost:5
  },
  skilled:{
    name:"⭐ 技能募集",fee:800000,min:2,max:5,
    minLv:4,maxLv:10,boost:12
  },
  headhunt:{
    name:"💎 ヘッドハンティング",fee:1500000,min:1,max:3,
    minLv:7,maxLv:15,boost:22
  }
};

const JOBS = [

/* =========================================================
   汎用
========================================================= */
function rand(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}

function formatMoney(yen){
  yen = Math.max(0,Math.round(yen));
  if(yen < 10000) return yen.toLocaleString("ja-JP")+"円";
  const man = yen/10000;
  if(Number.isInteger(man)) return man.toLocaleString("ja-JP")+"万円";
  return man.toLocaleString("ja-JP",{maximumFractionDigits:1})+"万円";
}
function formatNumber(n){return Math.round(n).toLocaleString("ja-JP")}
function addLog(text){
  state.financeLog.unshift(`${state.year}年${state.month}月 第${state.week}週　${text}`);
  state.financeLog = state.financeLog.slice(0,100);
}
function notify(text,type="good"){
  state.notifications.unshift({text,type,time:Date.now()});
  state.notifications = state.notifications.slice(0,8);
}
function currentRank(){
  return RANKS[state.rankIndex] || RANKS[0];
}
function employeeLimit(){
  const r = currentRank().name;
  return RANK_INFO[r]?.max ?? 4;
}
function hasMoney(amount){return state.money >= amount}
function spend(amount,reason){
  if(!hasMoney(amount)) return false;
  state.money -= amount;
  addLog(`−${formatMoney(amount)}：${reason}`);
  return true;
}
function earn(amount,reason){
  state.money += amount;
  addLog(`＋${formatMoney(amount)}：${reason}`);
}
function getEmployeeAverage(e){
  return Math.round(
    (e.programming+e.graphics+e.scenario+e.sound+e.planning)/5
  );
}
function statLabel(key){
  return {
    programming:"プログラミング",
    graphics:"グラフィック",
    scenario:"シナリオ",
    sound:"サウンド",
    planning:"企画"
  }[key] || key;
}
function jobByKey(key){return JOBS.find(j=>j.key===key)||JOBS[0]}
function personalityByName(name){return PERSONALITIES.find(p=>p.name===name)||PERSONALITIES[0]}

/* =========================================================
   社員
========================================================= */
function createEmployeeData(boost=0,level=null,tier="general"){
  const job=pick(JOBS);
  const personality=pick(PERSONALITIES);

  if(level===null){
    const type=RECRUIT_TYPES[tier]||RECRUIT_TYPES.general;
    level=rand(type.minLv,type.maxLv);
  }

  const base=rand(42,65)+boost+Math.max(0,level-1)*3;
  const stats={
    programming:clamp(base+rand(-15,15),20,99),
    graphics:clamp(base+rand(-15,15),20,99),
    scenario:clamp(base+rand(-15,15),20,99),
    sound:clamp(base+rand(-15,15),20,99),
    planning:clamp(base+rand(-15,15),20,99)
  };

  stats[job.stat]=clamp(stats[job.stat]+rand(10,22),20,99);

  const avg=Object.values(stats).reduce((a,b)=>a+b,0)/5;

  /*
    採用費は給料とは完全に別。
    レベル・能力・募集ランクを使って候補者ごとに計算する。
  */
  const tierMultiplier={
    general:1,
    active:1.05,
    skilled:1.15,
    headhunt:1.28
  }[tier]||1;

  let hireCost =
    (500000 + avg*25000 + level*180000) *
    tierMultiplier *
    (0.88+Math.random()*0.24);

  hireCost=Math.round(hireCost/10000)*10000;

  const salary=Math.round(
    (650000 + avg*26000 + level*85000) / 10000
  )*10000;

  const firstName=[
    "蓮","陸","葵","凛","湊","陽向","翔","蒼","悠","楓",
    "玲","奏","光","海斗","大和","結衣","美月","杏","咲","零"
  ];
  const family=[
    "佐藤","神崎","高橋","山田","桐谷","白石","成瀬","三枝",
    "相沢","柊木","黒川","水野","藤堂","西園","天野","橘"
  ];

  return {
    id:state.nextEmployeeId++,
    name:pick(family)+" "+pick(firstName),
    age:rand(20,45),
    job:job.key,
    salary,
    hireCost,
    programming:stats.programming,
    graphics:stats.graphics,
    scenario:stats.scenario,
    sound:stats.sound,
    planning:stats.planning,
    experience:0,
    level,
    exp:rand(0,Math.max(0,EXP_THRESHOLD(level)-1)),
    specialty:pick(GENRES),
    motivation:rand(65,100),
    personality:personality.name,
    personalityEffect:personality.effect,
    hair:pick(["#1d2430","#33261f","#59402d","#151a22","#6b4931"]),
    shirt:pick(["#426b93","#477d65","#80576f","#7a683f","#53647c"]),
    skin:pick(["#e4ae87","#d89a73","#efbd94","#c98766"]),
    tier,
    working:false,
    x:rand(15,75),
    y:rand(40,78),
    targetX:rand(15,75),
    targetY:rand(40,78),
    state:"working",
    skillFlags:[]
  };
}

/* =========================================================
   初期化
========================================================= */
function initialSetup(){
  const saved=localStorage.getItem(SAVE_KEY);
  if(saved){
    try{
      const parsed=JSON.parse(saved);
      if(parsed && parsed.companyName){
        state={...state,...parsed};
        normalizeState();
        return;
      }
    }catch(e){}
  }

  const company=prompt("会社名を入力してください","スターライトゲームズ");
  const president=prompt("社長名を入力してください","ゲーム社長");

  state.companyName=(company||"スターライトゲームズ").trim();
  state.presidentName=(president||"ゲーム社長").trim();

  state.employees=[
    createStarterEmployee("プログラマー"),
    createStarterEmployee("グラフィックデザイナー")
  ];

  state.market.genre=pick(GENRES);
  state.market.theme=pick(THEMES);

  addLog("会社を設立しました。初期資金は2,000万円です。");
  addLog(`今週の市場：${state.market.genre} × ${state.market.theme}`);
  saveGame();
}

function createStarterEmployee(jobName){
  const job=JOBS.find(j=>j.name===jobName)||JOBS[0];
  const e=createEmployeeData(0,1,"general");
  e.job=job.key;
  e.level=1;
  e.exp=0;
  e.salary=1200000;
  e.hireCost=0;
  e[job.stat]=clamp(e[job.stat]+10,0,99);
  return e;
}

function normalizeState(){
  state.expansion=state.expansion||{E:false,C:false,A:false,S:false};
  state.employees=state.employees||[];
  state.games=state.games||[];
  state.applicants=state.applicants||[];
  state.financeLog=state.financeLog||[];
  state.awards=state.awards||[];
  state.notifications=state.notifications||[];
  state.nextEmployeeId=state.nextEmployeeId||1;
  state.nextGameId=state.nextGameId||1;

  state.employees.forEach(e=>{
    e.level=e.level||1;
    e.exp=Number.isFinite(e.exp)?e.exp:0;
    e.hireCost=e.hireCost||0;
    e.salary=e.salary||1200000;
    e.motivation=e.motivation??80;
    e.x=e.x??30;
    e.y=e.y??60;
    e.targetX=e.targetX??e.x;
    e.targetY=e.targetY??e.y;
    e.state=e.state||"working";
    e.working=false;
  });

  if(!state.market)state.market={genre:pick(GENRES),theme:pick(THEMES),strength:50};

  updateRank(false);
}

/* =========================================================
   会社ランク
========================================================= */
function updateRank(showNotice=true){
  let newIndex=0;
  for(let i=0;i<RANKS.length;i++){
    if(state.companyXP>=RANKS[i].xp)newIndex=i;
  }

  if(newIndex!==state.rankIndex){
    const old=state.rankIndex;
    state.rankIndex=newIndex;
    state.companyLevel=Math.max(
      state.companyLevel,
      Math.floor(state.companyXP/300)+1
    );

    if(showNotice && newIndex>old){
      const rank=RANKS[newIndex].name;
      notify(`会社ランクが ${rank} に上昇しました！`,"good");
      addLog(`会社ランクが ${rank} に上昇しました。`);

      if(["E","C","A","S"].includes(rank)){
        setTimeout(()=>showExpansionEvent(rank),200);
      }
    }
  }

  state.companyLevel=Math.max(
    1,
    Math.floor(state.companyXP/300)+1
  );
}

function addCompanyXP(amount,reason=""){
  const before=state.companyLevel;
  state.companyXP+=Math.max(0,Math.round(amount));
  updateRank(true);

  if(state.companyLevel>before){
    addLog(`会社Lv.${state.companyLevel}に到達！`);
  }
  if(reason)addLog(`会社XP +${amount}：${reason}`);
}

function expansionData(rank){
  return {
    E:{cost:30000000,from:4,to:8,title:"新しい会社・部署を建設"},
    C:{cost:100000000,from:8,to:10,title:"第二次部署拡大"},
    A:{cost:300000000,from:10,to:20,title:"大規模部署を建設"},
    S:{cost:10000000000,from:20,to:Infinity,title:"世界企業化"}
  }[rank];
}

function showExpansionEvent(rank){
  if(state.expansion[rank])return;
  const d=expansionData(rank);
  if(!d)return;

  const body=`
    <div class="rankHero">
      <div class="muted">会社ランク ${rank} 到達</div>
      <div class="rankText">🏢 ${d.title}</div>
      <p>会社が次の段階へ進みました。大規模な部署拡大を行うことができます。</p>
    </div>
    <div class="grid grid2" style="margin-top:16px">
      <div class="card">
        <h3>💰 必要資金</h3>
        <div class="bigMoney">${formatMoney(d.cost)}</div>
      </div>
      <div class="card">
        <h3>👥 雇用上限</h3>
        <div class="value">${d.from}人 → ${d.to===Infinity?"無制限":d.to+"人"}</div>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:18px">
      <button class="btn green" onclick="expandCompany('${rank}')">🏗️ 拡大する</button>
      <button class="btn" onclick="closeMenu()">今回は見送る</button>
    </div>
    <p class="muted" style="margin-top:14px">見送っても、後から「会社」メニューで実行できます。</p>
  `;

}

function expandCompany(rank){
  const d=expansionData(rank);
  if(!d || state.expansion[rank])return;

  if(!spend(d.cost,`${rank}ランク会社拡張`)){
    alert(`資金が足りません。\n必要：${formatMoney(d.cost)}\n現在：${formatMoney(state.money)}`);
    return;
  }

  state.expansion[rank]=true;
  addCompanyXP(500,`${rank}ランクの部署拡大`);
  notify(`会社が拡大しました！雇用上限が更新されました。`,"good");
  saveGame();
  closeMenu();
  updateTopUI();
}

/* =========================================================
   採用
========================================================= */
function recruit(type){
  const data=RECRUIT_TYPES[type];
  if(!data)return;

  if(state.employees.length>=employeeLimit()){
    alert(`現在の雇用上限は ${employeeLimit()===Infinity?"無制限":employeeLimit()+"人"} です。`);
    return;
  }

  if(!spend(data.fee,`${data.name}の募集費`)){
    alert(`募集費が足りません。必要：${formatMoney(data.fee)}`);
    return;
  }

  const count=rand(data.min,data.max);
  state.applicants=[];

  for(let i=0;i<count;i++){
    state.applicants.push(createEmployeeData(data.boost,null,type));
  }

  state.recruitmentType=type;
  state.selectedApplicant=0;

  addLog(`${data.name}を実施。${count}名の候補者が集まりました。`);
  saveGame();
  renderRecruitModal();
}

function selectApplicant(index){
  if(index<0||index>=state.applicants.length)return;
  state.selectedApplicant=index;
  renderRecruitModal();
}

function moveApplicant(dir){
  if(!state.applicants.length)return;
  state.selectedApplicant=
    (state.selectedApplicant+dir+state.applicants.length)%state.applicants.length;
  renderRecruitModal();
}

function hireApplicant(index=state.selectedApplicant){
  const e=state.applicants[index];
  if(!e)return;

  if(state.employees.length>=employeeLimit()){
    alert("雇用上限に達しています。");
    return;
  }

  if(!spend(e.hireCost,`${e.name}を採用`)){
    alert(`採用資金が足りません。\n必要：${formatMoney(e.hireCost)}\n現在：${formatMoney(state.money)}`);
    return;
  }

  e.id=state.nextEmployeeId++;
  e.exp=0;
  e.working=false;
  e.x=rand(15,75);
  e.y=rand(40,78);
  e.targetX=e.x;
  e.targetY=e.y;
  e.state="working";

  state.employees.push(e);
  state.applicants.splice(index,1);

  if(state.applicants.length){
    state.selectedApplicant=Math.min(index,state.applicants.length-1);
  }else{
    state.selectedApplicant=-1;
  }

  addCompanyXP(30,`社員「${e.name}」を採用`);
  notify(`${e.name}を採用しました！`,"good");
  saveGame();

  renderRecruitModal();
  renderOfficeEmployees();
  updateTopUI();
}

            <p>性格：${escapeHTML(e.personality)}</p>

function statBox(label,value){
  return `<div class="statBox"><small>${label}</small><b>${value}</b></div>`;
}

function levelUpEmployee(id){
  const e=state.employees.find(x=>x.id===id);
  if(!e)return;

  const need=EXP_THRESHOLD(e.level);
  if(e.exp<need){
    alert(`経験値が足りません。\n必要：${need}\n現在：${e.exp}`);
    return;
  }

  e.exp-=need;
  e.level++;

  /*
    レベルアップで複数能力が成長。
    高レベルほど少し成長幅を上げる。
  */
  const keys=["programming","graphics","scenario","sound","planning"];
  const amount=rand(2,5)+(e.level>=10?1:0);

  shuffle(keys).slice(0,rand(2,4)).forEach(k=>{
    e[k]=clamp(e[k]+amount,0,100);
  });

  e.motivation=clamp(e.motivation+rand(2,7),0,100);
  e.experience+=50;

  /*
    給料1.3倍
  */
  e.salary=Math.round(e.salary*1.3/10000)*10000;

  unlockLevelSkill(e);

  addCompanyXP(20,`${e.name}がLv.${e.level}に成長`);
  notify(`${e.name}がLv.${e.level}になりました！ 給料も1.3倍になりました。`,"good");
  addLog(`${e.name}がLv.${e.level}へ。給料：${formatMoney(e.salary)}/年`);

  saveGame();
  renderOfficeEmployees();
  updateTopUI();
  openEmployeeDetail(id);
}

function unlockLevelSkill(e){
  const skills={
    program:[
      [5,"高速コーディング"],
      [7,"最適化の達人"],
      [10,"超高速エンジン"]
    ],
    graphic:[
      [5,"神作画"],
      [7,"アートディレクション"],
      [10,"究極グラフィック"]
    ],
    planner:[
      [5,"企画の天才"],
      [7,"市場予測"],
      [10,"キラーアイデア"]
    ],
    sound:[
      [5,"音の職人"],
      [7,"空間音響"],
      [10,"サウンドマスター"]
    ]
  };

  const list=skills[e.job]||[];
  list.forEach(([lv,name])=>{
    if(e.level>=lv && !e.skillFlags.includes(name)){
      e.skillFlags.push(name);
      addLog(`${e.name}が特殊スキル「${name}」を獲得！`);
    }
  });

  if(e.level===3 && !e.skillFlags.includes("得意分野強化")){
    e.skillFlags.push("得意分野強化");
  }
}

function trainEmployee(id){
  const e=state.employees.find(x=>x.id===id);
  if(!e)return;

  const cost=300000+e.level*100000;
  if(!spend(cost,`${e.name}の特訓`)){
    alert(`特訓費用が足りません。必要：${formatMoney(cost)}`);
    return;
  }

  const keys=["programming","graphics","scenario","sound","planning"];
  const k=pick(keys);
  const gain=rand(2,6);
  e[k]=clamp(e[k]+gain,0,100);
  e.exp+=rand(20,50);
  e.motivation=clamp(e.motivation+rand(1,5),0,100);

}

function fireEmployee(id){
  const e=state.employees.find(x=>x.id===id);

  if(!confirm(`${e.name}を解雇しますか？\nこの操作は取り消せません。`))return;

  state.employees=state.employees.filter(x=>x.id!==id);
  addLog(`${e.name}を解雇しました。`);
  notify(`${e.name}が会社を去りました。`,"warn");

  saveGame();
  closeMenu();
  renderOfficeEmployees();
  updateTopUI();
}

function updateBudgetRange(){
  const scale=document.getElementById("devScale");
  const budget=document.getElementById("devBudget");
  const info=document.getElementById("budgetInfo");
  if(!scale||!budget||!info)return;

  const s=SCALES[scale.value];
  let v=Number(budget.value)||s.min;
  v=clamp(v,s.min,s.max);
  budget.value=v;
  info.textContent=`予算範囲：${formatMoney(s.min)}〜${formatMoney(s.max)}　品質上限：${s.cap}`;
}

function startDevelopment(){
  const name=(document.getElementById("devName")?.value||"").trim();
  const genre=document.getElementById("devGenre")?.value;
  const theme=document.getElementById("devTheme")?.value;
  const scaleKey=document.getElementById("devScale")?.value;
  const budget=Number(document.getElementById("devBudget")?.value);
  const s=SCALES[scaleKey];

  if(!name){
    alert("ゲーム名を入力してください。");
    return;
  }
  if(!s||!Number.isFinite(budget)||budget<s.min||budget>s.max){
    alert("予算が範囲外です。");
    return;
  }
  if(state.development){
    alert("現在すでにゲームを開発中です。");
    return;
  }
  if(!spend(budget,`「${name}」の開発予算`)){
    alert(`資金が足りません。\n必要：${formatMoney(budget)}`);
    return;
  }

  state.development={
    name,genre,theme,scale:scaleKey,budget,
    totalWeeks:s.weeks,
    elapsedWeeks:0,
    paused:false,
    startedAt:Date.now(),
    quality:0
  };

  addCompanyXP(80,`「${name}」の開発開始`);
  addLog(`「${name}」の開発を開始。`);
  saveGame();
  renderDevelopmentModal();
}

function teamPower(){
  if(!state.employees.length)return 0;
  let total=0;

  state.employees.forEach(e=>{
    const avg=getEmployeeAverage(e);
    const levelBonus=e.level*2;
    total+=avg+levelBonus;

    if(e.personality==="🔥 熱血")total+=3;
    if(e.personality==="📚 努力家")total+=2;
    if(e.personality==="😂 ムードメーカー")total+=2;
  });

  return Math.round(total/state.employees.length);
}

function developmentProgress(){
  const d=state.development;
  if(!d)return 0;
  return clamp((d.elapsedWeeks/d.totalWeeks)*100,0,100);
}

function pauseDevelopment(){
  if(!state.development)return;
  state.development.paused=!state.development.paused;
  state.lastTick=Date.now();
  saveGame();
  renderDevelopmentModal();
}

function cancelDevelopment(){
  if(!state.development)return;
  if(!confirm("開発を中止しますか？\n使用済み予算は戻りません。"))return;

  const name=state.development.name;
  state.development=null;
  addLog(`「${name}」の開発を中止しました。`);
  saveGame();
  renderDevelopmentModal();
}

function finishDevelopment(){
  const d=state.development;
  if(!d)return;

  const s=SCALES[d.scale];
  const power=teamPower();

  let compatibility=compatibilityScore(d.genre,d.theme);
  let quality=
    power*0.55+
    compatibility*0.2+
    Math.min(100,d.budget/s.max*100)*0.15+
    rand(0,12);

  quality=clamp(Math.round(quality),10,s.cap);

  const price=rand(1980,6980);
  const rating=clamp(
    (quality*0.75+compatibility*0.15+power*0.1),
   1,100
  );

  const game={
    id:state.nextGameId++,
    name:d.name,
    genre:d.genre,
    theme:d.theme,
    scale:d.scale,
    budget:d.budget,
    quality,
    rating:Math.round(rating*10)/10,
    price,
    weeks:d.totalWeeks,
    releaseYear:state.year,
    releaseMonth:state.month,
    lifetimeSales:0,
    lifetimeRevenue:0,
    currentWeeklySales:0,
    fans:0,
    ageWeeks:0,
    hype:rand(30,70)
  };

  state.games.push(game);
  state.development=null;

  addCompanyXP(300,`「${game.name}」完成`);
  notify(`「${game.name}」が完成しました！ 品質 ${quality} / 評価 ${game.rating}`,"good");
  addLog(`「${game.name}」を発売。品質${quality}、評価${game.rating}`);
  saveGame();

  openGameDetail(game.id);
}

function compatibilityScore(genre,theme){
  const pairs={
    "RPG|ファンタジー":95,
    "RPG|魔法":94,
    "RPG|中世":90,
    "RPG|モンスター":88,
    "SF|宇宙":98,
    "SF|未来":96,
    "SF|乗り物":84,
    "ホラー|ゾンビ":96,
    "ホラー|学校":84,
    "ミステリー|探偵":99,
    "ミステリー|学校":88,
    "音楽|音楽":99,
    "スポーツ|スポーツ":99,
    "レース|乗り物":97,
    "料理|料理":99,
    "ノベル|学校":90,
    "ノベル|現代":85,
    "アクション|戦争":88,
    "アクション|モンスター":90,
    "サバイバル|ゾンビ":93,
    "タワーディフェンス|モンスター":90,
    "経営|現代":88,
    "サンドボックス|動物":82,
    "プラットフォーマー|動物":84
  };
  return pairs[`${genre}|${theme}`]??rand(45,82);
}

/* =========================================================
   ゲーム・売上
========================================================= */
function gameWeeklySales(game){
  const marketBoost=
    game.genre===state.market.genre ? state.market.strength/100 : 0;
  const themeBoost=
    game.theme===state.market.theme ? state.market.strength/140 : 0;

  const ratingBoost=game.rating/100;
  const qualityBoost=game.quality/100;

  let base=
    30+
    qualityBoost*450+
    ratingBoost*600+
    game.hype*5+
    marketBoost*900+
    themeBoost*500;

  const decay=Math.max(.08,1-game.ageWeeks*.018);

  return Math.max(0,Math.round(base*decay*(0.8+Math.random()*.4)));
}

function processWeeklyGames(){
  state.games.forEach(game=>{
    game.ageWeeks++;
    const sales=gameWeeklySales(game);
    game.currentWeeklySales=sales;
    game.lifetimeSales+=sales;

    const gross=sales*game.price;
    const retained=gross*0.72;
    game.lifetimeRevenue+=retained;

    earn(retained,`「${game.name}」の週間売上`);
    const newFans=Math.round(sales*.12*(game.rating/60));
    game.fans+=newFans;
    state.totalFans+=newFans;

    game.hype=clamp(
      game.hype +
      (state.market.genre===game.genre?rand(2,8):rand(-4,2)) +
      (game.rating>=85?rand(0,4):0),
      0,100
    );
  });
}

/* =========================================================
   時間・週処理
========================================================= */
function advanceWeek(){
  state.week++;

  if(state.week>4){
    state.week=1;
    state.month++;

    if(state.month>12){
      state.month=1;
      state.year++;
      annualAwards();
    }

    if(Math.random()<.2){
      state.market.genre=pick(GENRES);
      state.market.theme=pick(THEMES);
      state.market.strength=rand(45,100);
      addLog(`市場トレンド変更：${state.market.genre} × ${state.market.theme}`);
    }

    /*
      年間給与は「4月の始まり」に支払う。
      ゲーム開始時は1年4月なので、最初の支払いは翌年4月。
    */
    if(state.month===4){
      payAnnualSalaries();
    }
  }

  processEmployeesWeekly();
  processDevelopmentWeekly();
  updateRank(true);
  saveGame();
}

function payAnnualSalaries(){
  if(state.year===1)return;

  const total=state.employees.reduce((sum,e)=>sum+e.salary,0);
  if(total<=0)return;

  if(state.money>=total){
    state.money-=total;
    addLog(`社員の年間給与を支払い：−${formatMoney(total)}`);
  }else{
    state.money-=total;
    addLog(`年間給与の支払いで資金不足：−${formatMoney(total)}`);
    notify("年間給与の支払いで資金が大きく減少しました。","warn");
  }
}

function processEmployeesWeekly(){
  state.employees.forEach(e=>{
    let exp=rand(5,14);

    if(e.personality==="📚 努力家")exp=Math.round(exp*1.3);
    if(e.personality==="🔥 熱血")exp=Math.round(exp*1.15);
    if(e.personality==="😴 マイペース")exp=Math.round(exp*.85);
    if(e.personality==="😤 負けず嫌い" && e.level>=5)exp=Math.round(exp*1.15);

    if(state.development)exp+=8;

    e.exp+=exp;
    e.experience+=exp;

    e.motivation=clamp(
      e.motivation+
      (e.personality==="😂 ムードメーカー"?1:0)-
      rand(0,2),
      0,100
    );

    /*
      自動レベルアップはしない。
      経験値が貯まったらプレイヤーがレベルアップする。
    */
  });
}

function processDevelopmentWeekly(){
  const d=state.development;
  if(!d||d.paused)return;

  /*
    1週間経過。
    開発速度は社員の人数・能力・レベルで変化。
  */
  const power=teamPower();
  const speed=clamp(0.75+power/100,0.75,2.0);

  d.elapsedWeeks+=speed;

  if(d.elapsedWeeks>=d.totalWeeks){
    finishDevelopment();
  }
}

/* =========================================================
   リアルタイム更新
========================================================= */
function gameLoop(now){
  if(!state.paused){
    const delta=now-state.lastTick;

    /*
      週そのものは15秒固定。
      開発進捗は1秒ごとに滑らかに反映する。
    */
    if(delta>=WEEK_MS){
      const count=Math.floor(delta/WEEK_MS);
      state.lastTick+=count*WEEK_MS;

      for(let i=0;i<count;i++){
        advanceWeek();
      }
    }

    /*
      開発の小数週進行。
      毎秒少しずつ進め、15秒で1週間相当。
      週処理の大きなイベントとは独立して表示する。
    */
    if(state.development && !state.development.paused){
      const fraction=Math.min(delta/WEEK_MS,1);

      /*
        elapsedWeeksは週処理でも増えるため、
        UI表示用にリアルタイムの小数を加える。
      */
      state.development.displayFraction=fraction;
    }
  }

  if(now-state.lastMoneyUpdate>=1000){
    state.lastMoneyUpdate=now;
    updateTopUI();
    updateLiveModal();
  }

  requestAnimationFrame(gameLoop);
}

  switch(type){
    case "development":renderDevelopmentModal();break;
    case "recruit":renderRecruitModal();break;
    case "employees":renderEmployeesModal();break;
    case "games":renderGamesModal();break;
    case "company":renderCompanyModal();break;
    case "finance":renderFinanceModal();break;
    case "awards":renderAwardsModal();break;
    case "settings":renderSettingsModal();break;
  }
}

function openCustomModal(title,body){
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalBody").innerHTML=body;
  document.getElementById("overlay").classList.add("open");
}

function closeMenu(){
  document.getElementById("overlay").classList.remove("open");
  document.getElementById("modalBody").innerHTML="";
  state.recruitmentType=null;
}

function togglePause(){
  state.paused=!state.paused;
  state.lastTick=Date.now();
  saveGame();
  updateTopUI();
}

document.getElementById("overlay").addEventListener("click",e=>{
  if(e.target.id==="overlay")closeMenu();
});

document.addEventListener("keydown",e=>{
  if(!document.getElementById("overlay").classList.contains("open"))return;

  if(document.getElementById("modalTitle").textContent==="👥 社員採用" && state.recruitmentType){
    if(e.key==="ArrowUp"){
      e.preventDefault();
      moveApplicant(-1);
    }
    if(e.key==="ArrowDown"){
      e.preventDefault();
      moveApplicant(1);
    }
  }

  if(e.key==="Escape")closeMenu();
});

/* =========================================================
   会社
========================================================= */
function renderCompanyModal(){
  const rank=currentRank();
  const next=RANKS[state.rankIndex+1];
  const xpNeed=next?Math.max(0,next.xp-state.companyXP):0;
  const pct=next
    ? clamp((state.companyXP-rank.xp)/(next.xp-rank.xp)*100,0,100)
    : 100;

  const expansionRows=["E","C","A","S"].map(r=>{
    const d=expansionData(r);
    const done=state.expansion[r];
    const unlocked=RANKS.findIndex(x=>x.name===r)<=state.rankIndex;

    return `
      <div class="card">
        <h3>${r}ランク拡張</h3>
        <p>${d.title}</p>
        <p>費用：<b>${formatMoney(d.cost)}</b></p>
        <p>社員上限：${d.from} → ${d.to===Infinity?"無制限":d.to+"人"}</p>
        <button class="btn ${done?"":"green"}"
          ${done||!unlocked?"disabled":""}
          onclick="expandCompany('${r}')">
          ${done?"✅ 拡張済み":unlocked?"🏗️ 拡張する":"🔒 未解放"}
        </button>
      </div>
    `;
  }).join("");

  const body=`
    <div class="rankHero">
      <div class="muted">現在の会社</div>
      <div class="rankText">${rank.name}</div>
      <div>会社Lv.${state.companyLevel}　｜　会社XP ${formatNumber(state.companyXP)}</div>
      <div class="rankBar progress"><i style="width:${pct}%"></i></div>
      <p class="muted">
        ${next?`次のランク ${next.name} まであと ${formatNumber(xpNeed)} XP`:"最高ランク到達"}
      </p>
    </div>

    <div class="grid grid2" style="margin-top:15px">
      <div class="card">
        <h3>🏢 会社情報</h3>
        <p>会社名：${escapeHTML(state.companyName)}</p>
        <p>社長：${escapeHTML(state.presidentName)}</p>
        <p>社員：${state.employees.length} / ${employeeLimit()===Infinity?"無制限":employeeLimit()}</p>
        <p>総ファン数：${formatNumber(state.totalFans)}</p>
      </div>
      <div class="card">
        <h3>📊 ランク一覧</h3>
        <p>${RANKS.map((r,i)=>`<span class="tag" style="${i<=state.rankIndex?"border-color:#4be39b;color:#8dffc9":""}">${r.name}</span>`).join("")}</p>
      </div>
    </div>

    <h3 style="margin-top:22px">🏗️ 部署拡大</h3>
    <div class="grid grid2">${expansionRows}</div>
  `;

  openCustomModal("🏢 会社",body);
}

/* =========================================================
   実績・賞
========================================================= */
function annualAwards(){
  if(!state.games.length)return;

  const best=[...state.games].sort((a,b)=>(
    (b.rating+b.quality*.25+b.hype*.2)-
    (a.rating+a.quality*.25+a.hype*.2)
  ))[0];

  if(!best)return;

  const award={
    year:state.year,
    game:best.name,
    category:"年間ゲーム大賞",
    rating:best.rating
  };

  state.awards.unshift(award);
  state.totalFans+=5000;
  best.hype=clamp(best.hype+20,0,100);

  addCompanyXP(1000,"年間ゲーム大賞");
  notify(`🏆 ${best.name}が年間ゲーム大賞を受賞！`,"good");
  addLog(`🏆 年間ゲーム大賞：「${best.name}」`);
}

  const company=(document.getElementById("setCompany")?.value||"").trim();

  if(company)state.companyName=company;
  if(president)state.presidentName=president;

  saveGame();
  updateTopUI();
  notify("設定を保存しました。","good");
  closeMenu();
}

function resetGame(){
  if(!confirm("本当に最初からやり直しますか？\n現在のデータは消えます。"))return;
  localStorage.removeItem(SAVE_KEY);
  location.reload();
}

  const job=jobByKey(e.job);

    <div class="employee ${className}" style="position:relative;width:54px;height:76px">
      <div class="empHair" style="background:${e.hair}"></div>

      <div class="empBody" style="background:${e.shirt}"></div>
      <div class="empArm a" style="background:${e.shirt}"></div>

      <div class="empTool">${job.tool}</div>

function renderOfficeEmployees(){
  const layer=document.getElementById("employeeLayer");
  if(!layer)return;

  layer.innerHTML="";

  state.employees.forEach(e=>{
    const el=document.createElement("div");
    el.className="employee walking working";
    el.dataset.id=e.id;

    el.innerHTML=`
      <div class="empHair" style="background:${e.hair}"></div>
      <div class="empHead" style="background:${e.skin}"></div>
      <div class="empBody" style="background:${e.shirt}"></div>
      <div class="empArm a" style="background:${e.shirt}"></div>
      <div class="empArm b" style="background:${e.shirt}"></div>
      <div class="empLeg a"></div><div class="empLeg b"></div>
      <div class="empTool">${jobByKey(e.job).tool}</div>
      <div class="empName">${escapeHTML(e.name)} Lv.${e.level}</div>
    `;

    el.addEventListener("click",()=>openEmployeeDetail(e.id));
    layer.appendChild(el);
    e.dom=el;
  });
}

function animateEmployees(){
  const office=document.getElementById("office");
  const w=office.clientWidth;
  const h=office.clientHeight;

  state.employees.forEach(e=>{
    if(!e.dom)return;

    if(Math.random()<0.006){
      e.targetX=rand(8,88);
      e.targetY=rand(37,82);
      e.state=pick(["walking","working","resting"]);
    }

    const dx=e.targetX-e.x;
    const dy=e.targetY-e.y;

    if(Math.abs(dx)>0.1)e.x+=dx*0.015;
    if(Math.abs(dy)>0.1)e.y+=dy*0.015;

    if(Math.abs(dx)<1 && Math.abs(dy)<1){
      if(e.state==="walking")e.state="working";
    }

    e.dom.style.left=(e.x/100*w-27)+"px";
    e.dom.style.top=(e.y/100*h-38)+"px";

    e.dom.classList.toggle("walking",e.state==="walking");
    e.dom.classList.toggle("working",e.state==="working");

    if(e.state==="resting"){
      e.dom.style.opacity=".78";
    }else{
      e.dom.style.opacity="1";
    }
  });

  requestAnimationFrame(animateEmployees);
}

/* =========================================================
   保存
========================================================= */
function saveGame(){
  const copy=JSON.parse(JSON.stringify(state,(key,value)=>{
    if(key==="dom")return undefined;
    return value;
  }));
  localStorage.setItem(SAVE_KEY,JSON.stringify(copy));
  notify("ゲームを保存しました。","good");
}

function escapeHTML(str){
  return String(str??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
function escapeAttr(str){return escapeHTML(str)}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* =========================================================
   起動
========================================================= */
initialSetup();
normalizeState();
updateTopUI();
renderOfficeEmployees();
requestAnimationFrame(gameLoop);
requestAnimationFrame(animateEmployees);

/* 開発中なら時間基準を現在に合わせる */

state.lastMoneyUpdate=Date.now();

/*
  クリック外閉じを保ちつつ、社員のDOMは
  モーダル操作では再生成しない。
*/
setInterval(()=>{
  if(!state.paused){
    saveGameSilent();
  }
},10000);

function saveGameSilent(){
  const copy=JSON.parse(JSON.stringify(state,(key,value)=>{
    if(key==="dom")return undefined;
    return value;
  }));
  localStorage.setItem(SAVE_KEY,JSON.stringify(copy));
}
