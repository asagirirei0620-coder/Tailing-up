<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>ゲーム開発記</title>
<style>
:root{
  --bg:#070a12;
  --panel:#0e1422;
  --panel2:#121a2b;
  --line:rgba(255,255,255,.10);
  --text:#f5f7ff;
  --muted:#8d99b5;
  --accent:#6d7cff;
  --accent2:#35d6ff;
  --good:#48e69a;
  --warn:#ffc857;
  --bad:#ff667d;
  --shadow:0 24px 80px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070d;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
}
button,input,select{font:inherit}
button{cursor:pointer}

#app{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 15% 10%,rgba(71,92,255,.16),transparent 30%),
    radial-gradient(circle at 90% 80%,rgba(0,204,255,.10),transparent 28%),
    linear-gradient(135deg,#05070d,#0a0e18 55%,#070a12);
}

/* START */
#startScreen{
  position:absolute;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 30%,rgba(90,105,255,.25),transparent 35%),
    linear-gradient(145deg,#04060b,#0b1020 55%,#05070d);
}
.startBox{
  width:min(720px,92vw);
  padding:42px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:30px;
  background:rgba(12,17,29,.78);
  backdrop-filter:blur(28px);
  box-shadow:0 40px 120px rgba(0,0,0,.6);
}
.logo{
  text-align:center;
  font-weight:900;
  font-size:clamp(42px,7vw,76px);
  letter-spacing:-4px;
  background:linear-gradient(100deg,#fff,#9eaaff 40%,#42dfff);
  -webkit-background-clip:text;
  color:transparent;
  text-shadow:0 0 40px rgba(89,115,255,.25);
}
.logoSub{
  text-align:center;
  color:var(--muted);
  margin:5px 0 34px;
}
.formGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
.field label{
  display:block;
  font-size:12px;
  color:#8490ad;
  margin:0 0 7px 3px;
}
.field input,.field select{
  width:100%;
  height:50px;
  border:1px solid var(--line);
  border-radius:14px;
  outline:none;
  padding:0 15px;
  color:white;
  background:#090e19;
}
.field input:focus,.field select:focus{
  border-color:#7382ff;
  box-shadow:0 0 0 3px rgba(115,130,255,.12);
}
.startButton{
  width:100%;
  margin-top:24px;
  height:62px;
  border:0;
  border-radius:17px;
  color:white;
  font-weight:900;
  font-size:18px;
  background:linear-gradient(100deg,#596cff,#32cfff);
  box-shadow:0 15px 45px rgba(72,102,255,.28);
  transition:.2s;
}
.startButton:hover{transform:translateY(-2px);filter:brightness(1.08)}
.startHint{
  text-align:center;
  color:#67728b;
  font-size:12px;
  margin-top:15px;
}

/* GAME */
#game{
  width:100%;
  height:100%;
  display:none;
  flex-direction:column;
}
.topbar{
  height:72px;
  flex:none;
  display:flex;
  align-items:center;
  gap:20px;
  padding:0 20px;
  border-bottom:1px solid var(--line);
  background:rgba(7,10,18,.84);
  backdrop-filter:blur(20px);
  z-index:50;
}
.brand{
  min-width:180px;
}
.brandName{
  font-size:19px;
  font-weight:900;
}
.brandSub{
  font-size:10px;
  color:#66728c;
  letter-spacing:1px;
}
.topStats{
  display:flex;
  gap:9px;
  align-items:center;
  flex:1;
}
.stat{
  min-width:130px;
  padding:9px 14px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.035);
}
.statLabel{
  font-size:10px;
  color:#78849f;
}
.statValue{
  margin-top:2px;
  font-size:17px;
  font-weight:900;
}
#pauseBtn{
  height:43px;
  padding:0 16px;
  border:1px solid var(--line);
  border-radius:12px;
  color:white;
  background:#111827;
}
#pauseBtn:hover{background:#172036}

/* MAIN */
.main{
  min-height:0;
  flex:1;
  display:grid;
  grid-template-columns:minmax(0,1fr) 275px;
  overflow:hidden;
}

/* OFFICE */
.office{
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    radial-gradient(circle at 50% 25%,rgba(100,120,255,.13),transparent 35%),
    #0b101a;
  background-size:52px 52px,52px 52px,auto,auto;
}
.office:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(180deg,transparent 55%,rgba(0,0,0,.22)),
    radial-gradient(circle at 50% 100%,rgba(50,214,255,.07),transparent 40%);
  pointer-events:none;
}
.window{
  position:absolute;
  left:5%;
  top:5%;
  width:36%;
  height:25%;
  border:5px solid #263249;
  border-radius:8px;
  background:
    radial-gradient(circle at 70% 20%,rgba(255,255,255,.35),transparent 3%),
    linear-gradient(145deg,#17295c,#0e77a5 50%,#152f59);
  box-shadow:inset 0 0 50px rgba(0,0,0,.4),0 15px 30px rgba(0,0,0,.25);
}
.window:after{
  content:"";
  position:absolute;
  left:50%;
  top:0;
  bottom:0;
  width:5px;
  background:#263249;
  transform:translateX(-50%);
}
.window:before{
  content:"";
  position:absolute;
  top:50%;
  left:0;
  right:0;
  height:5px;
  background:#263249;
  transform:translateY(-50%);
}
.ceilingLight{
  position:absolute;
  top:3%;
  left:50%;
  width:30%;
  height:12px;
  border-radius:20px;
  background:#dce8ff;
  box-shadow:0 0 30px #8baaff,0 0 80px rgba(108,140,255,.4);
  transform:translateX(-50%);
  opacity:.8;
}
.floor{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:37%;
  background:
    linear-gradient(30deg,rgba(255,255,255,.025) 12%,transparent 12.5%,transparent 87%,rgba(255,255,255,.025) 87.5%),
    linear-gradient(150deg,rgba(255,255,255,.025) 12%,transparent 12.5%,transparent 87%,rgba(255,255,255,.025) 87.5%),
    #111827;
  background-size:70px 70px;
  border-top:1px solid rgba(255,255,255,.08);
}
.wallLabel{
  position:absolute;
  left:5%;
  top:34%;
  color:rgba(255,255,255,.2);
  font-weight:900;
  letter-spacing:5px;
  font-size:12px;
}
.plant{
  position:absolute;
  width:70px;
  height:105px;
  bottom:29%;
  right:8%;
}
.plant .pot{
  position:absolute;
  bottom:0;
  left:18px;
  width:35px;
  height:38px;
  background:linear-gradient(90deg,#553a38,#8d6253,#553a38);
  border-radius:3px 3px 10px 10px;
}
.leaf{
  position:absolute;
  width:30px;
  height:55px;
  border-radius:100% 0 100% 0;
  background:linear-gradient(135deg,#54d68b,#16784d);
  transform-origin:bottom center;
}
.leaf.l1{left:15px;bottom:28px;transform:rotate(-30deg)}
.leaf.l2{left:30px;bottom:30px;transform:rotate(25deg)}
.leaf.l3{left:4px;bottom:42px;transform:rotate(-55deg)}
.leaf.l4{left:36px;bottom:47px;transform:rotate(50deg)}

.desk{
  position:absolute;
  width:190px;
  height:70px;
  border-radius:10px;
  background:linear-gradient(#2d3b53,#182235);
  border:1px solid #46536a;
  box-shadow:0 18px 30px rgba(0,0,0,.25);
}
.desk:before{
  content:"";
  position:absolute;
  left:20px;
  right:20px;
  bottom:-58px;
  height:60px;
  border-left:8px solid #182235;
  border-right:8px solid #182235;
}
.desk .monitor{
  position:absolute;
  left:50%;
  top:-45px;
  width:70px;
  height:45px;
  border:4px solid #25334c;
  border-radius:6px;
  background:linear-gradient(135deg,#122444,#284f78);
  transform:translateX(-50%);
  box-shadow:0 0 20px rgba(56,170,255,.16);
}
.desk .monitor:after{
  content:"";
  position:absolute;
  width:25px;
  height:4px;
  left:50%;
  bottom:-8px;
  transform:translateX(-50%);
  background:#26334a;
}
.desk1{left:12%;top:50%}
.desk2{left:40%;top:57%}
.desk3{left:68%;top:47%}
.desk4{left:28%;top:77%}
.desk5{left:57%;top:79%}

.whiteboard{
  position:absolute;
  top:37%;
  right:5%;
  width:170px;
  height:105px;
  background:#e9eef6;
  border:8px solid #27344a;
  box-shadow:0 18px 30px rgba(0,0,0,.2);
}
.whiteboard span{
  position:absolute;
  font-size:12px;
  font-weight:900;
  color:#53627a;
}
.whiteboard .a{left:14px;top:14px}
.whiteboard .b{left:20px;top:40px;color:#4e6cff}
.whiteboard .c{left:80px;top:67px;color:#e35773}

/* CEO */
.ceoDesk{
  position:absolute;
  left:50%;
  bottom:8%;
  width:220px;
  height:76px;
  transform:translateX(-50%);
  background:linear-gradient(180deg,#4b382d,#2b211c);
  border:2px solid #725441;
  border-radius:10px;
  box-shadow:0 25px 45px rgba(0,0,0,.35);
}
.ceoDesk:before,.ceoDesk:after{
  content:"";
  position:absolute;
  bottom:-70px;
  width:10px;
  height:72px;
  background:#241d1a;
}
.ceoDesk:before{left:25px}
.ceoDesk:after{right:25px}
.ceoLabel{
  position:absolute;
  top:-23px;
  left:50%;
  transform:translateX(-50%);
  font-size:10px;
  color:#bfc8dc;
  white-space:nowrap;
}
.ceo{
  position:absolute;
  left:50%;
  bottom:14%;
  width:50px;
  height:100px;
  transform:translateX(-50%);
  z-index:9;
  transition:transform .4s;
}
.charHead{
  position:absolute;
  left:12px;
  top:0;
  width:27px;
  height:29px;
  border-radius:45% 45% 42% 42%;
  background:#d49b72;
  border:2px solid #6e493b;
}
.charHair{
  position:absolute;
  left:9px;
  top:-3px;
  width:33px;
  height:18px;
  border-radius:60% 60% 35% 35%;
  background:#1b1b25;
}
.charEye{
  position:absolute;
  top:14px;
  width:4px;
  height:4px;
  background:#172033;
  border-radius:50%;
}
.charEye.a{left:19px}
.charEye.b{left:29px}
.charBody{
  position:absolute;
  top:29px;
  left:7px;
  width:36px;
  height:42px;
  border-radius:8px 8px 4px 4px;
  background:#222c45;
  border:2px solid #475776;
}
.charTie{
  position:absolute;
  top:32px;
  left:22px;
  width:7px;
  height:27px;
  background:#5b6cff;
  clip-path:polygon(20% 0,80% 0,100% 80%,50% 100%,0 80%);
}
.charArm{
  position:absolute;
  top:34px;
  width:9px;
  height:39px;
  background:#222c45;
  border-radius:8px;
  transform-origin:top;
}
.charArm.a{left:2px;transform:rotate(10deg)}
.charArm.b{right:2px;transform:rotate(-10deg)}
.charLeg{
  position:absolute;
  top:68px;
  width:11px;
  height:32px;
  background:#171c2b;
  border-radius:4px;
}
.charLeg.a{left:11px}
.charLeg.b{right:11px}

/* EMPLOYEES */
.employeeLayer{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:10;
}
.employee{
  position:absolute;
  width:50px;
  height:105px;
  transform:translate(-50%,-50%);
  transition:none;
  pointer-events:none;
}
.employee .charBody{background:var(--shirt,#315d95)}
.employee .charTie{display:none}
.employee .tool{
  position:absolute;
  z-index:3;
}
.employee.programmer .tool{
  left:38px;
  top:42px;
  width:18px;
  height:14px;
  border:3px solid #4e668d;
  background:#14243c;
}
.employee.designer .tool{
  left:38px;
  top:43px;
  width:18px;
  height:12px;
  border:2px solid #8f9ebc;
  background:#5c6aff;
  transform:rotate(-8deg);
}
.employee.planner .tool{
  left:39px;
  top:42px;
  width:16px;
  height:20px;
  background:#e9edf5;
  border:2px solid #aab3c4;
}
.employee.sound .tool{
  left:38px;
  top:10px;
  width:20px;
  height:20px;
  border:5px solid #5368aa;
  border-radius:50%;
}
.employeeName{
  position:absolute;
  left:50%;
  top:102px;
  transform:translateX(-50%);
  white-space:nowrap;
  font-size:9px;
  color:#dce4f4;
  text-shadow:0 2px 6px #000;
}
.employee.walking .charLeg.a{
  animation:walkA .22s infinite alternate;
}
.employee.walking .charLeg.b{
  animation:walkB .22s infinite alternate;
}
.employee.working .charArm.a{
  animation:typeA .18s infinite alternate;
}
.employee.working .charArm.b{
  animation:typeB .18s infinite alternate;
}
@keyframes walkA{to{transform:rotate(18deg)}}
@keyframes walkB{to{transform:rotate(-18deg)}}
@keyframes typeA{to{transform:rotate(-20deg)}}
@keyframes typeB{to{transform:rotate(18deg)}}

/* MENU */
.menuBar{
  border-left:1px solid var(--line);
  background:rgba(8,12,21,.92);
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
  overflow:hidden;
}
.menuTitle{
  color:#65718d;
  font-size:11px;
  font-weight:900;
  letter-spacing:2px;
  padding:3px 5px 7px;
}
.menuButton{
  flex:1;
  min-height:58px;
  max-height:90px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:18px;
  background:linear-gradient(135deg,#111a2a,#0c1321);
  color:#dce4f5;
  display:flex;
  align-items:center;
  gap:13px;
  padding:0 17px;
  text-align:left;
  transition:.2s;
  position:relative;
  overflow:hidden;
}
.menuButton:before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,rgba(104,121,255,.16),transparent);
  opacity:0;
  transition:.2s;
}
.menuButton:hover{
  transform:translateX(-4px);
  border-color:rgba(112,130,255,.45);
  box-shadow:0 12px 30px rgba(0,0,0,.25);
}
.menuButton:hover:before{opacity:1}
.menuIcon{font-size:26px;z-index:1}
.menuText{font-weight:800;font-size:14px;z-index:1}
.menuSmall{display:block;font-size:9px;color:#66738f;margin-top:2px;font-weight:500}

/* OVERLAY */
#overlay{
  position:absolute;
  inset:72px 275px 0 0;
  z-index:80;
  display:none;
  align-items:center;
  justify-content:center;
  padding:5vh 5vw;
  background:rgba(2,5,11,.62);
  backdrop-filter:blur(12px);
}
.modal{
  width:min(1080px,94%);
  height:min(760px,88%);
  border:1px solid rgba(255,255,255,.13);
  border-radius:28px;
  background:
    radial-gradient(circle at 20% 0%,rgba(100,120,255,.12),transparent 35%),
    linear-gradient(145deg,rgba(16,23,39,.98),rgba(8,13,23,.98));
  box-shadow:0 40px 130px rgba(0,0,0,.65);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  animation:modalIn .22s ease;
}
@keyframes modalIn{
  from{opacity:0;transform:translateY(15px) scale(.97)}
  to{opacity:1;transform:none}
}
.modalHeader{
  height:76px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 26px;
  border-bottom:1px solid var(--line);
}
.modalTitle{
  font-size:24px;
  font-weight:900;
}
.modalClose{
  width:42px;
  height:42px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#111827;
  color:#fff;
  font-size:20px;
}
.modalBody{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:24px;
}

/* GENERAL CONTENT */
.sectionTitle{
  font-size:12px;
  color:#7784a0;
  letter-spacing:2px;
  font-weight:900;
  margin:0 0 12px;
}
.card{
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(255,255,255,.035);
  padding:18px;
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.primary{
  border:0;
  border-radius:13px;
  height:48px;
  padding:0 20px;
  color:#fff;
  font-weight:900;
  background:linear-gradient(100deg,#596cff,#32cfff);
}
.secondary{
  border:1px solid var(--line);
  border-radius:13px;
  height:48px;
  padding:0 18px;
  color:#fff;
  background:#101827;
}
.primary:hover,.secondary:hover{filter:brightness(1.08)}
.choice{
  border:1px solid var(--line);
  border-radius:14px;
  background:#0d1524;
  color:#dbe3f5;
  padding:15px;
  text-align:left;
  transition:.18s;
}
.choice:hover,.choice.selected{
  border-color:#6e7dff;
  background:linear-gradient(135deg,rgba(93,108,255,.18),rgba(47,201,255,.06));
}
.choiceTitle{font-weight:900}
.choiceSub{font-size:11px;color:#74809a;margin-top:4px}

input.bigInput{
  width:100%;
  height:54px;
  border-radius:14px;
  border:1px solid var(--line);
  background:#080e18;
  color:#fff;
  outline:none;
  padding:0 16px;
  font-size:16px;
}
input.bigInput:focus{
  border-color:#6d7cff;
  box-shadow:0 0 0 3px rgba(109,124,255,.12);
}

/* DEVELOPMENT */
.devHero{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:18px;
}
.devTitle{
  font-size:30px;
  font-weight:900;
  margin-bottom:8px;
}
.progressBox{
  margin-top:18px;
  padding:18px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(255,255,255,.025);
}
.progressTop{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:9px;
}
.progressPercent{
  font-size:32px;
  font-weight:900;
}
.progressTrack{
  height:16px;
  background:#080c15;
  border-radius:20px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.08);
}
.progressFill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#6173ff,#3de0ff);
  box-shadow:0 0 20px rgba(65,210,255,.4);
  transition:width .45s linear;
}
.statBars{display:grid;gap:12px}
.barRow{
  display:grid;
  grid-template-columns:90px 1fr 40px;
  align-items:center;
  gap:10px;
  font-size:11px;
}
.bar{
  height:8px;
  background:#090e18;
  border-radius:20px;
  overflow:hidden;
}
.bar i{
  display:block;
  height:100%;
  border-radius:20px;
  background:linear-gradient(90deg,#6576ff,#36d9ff);
}
.devForm{display:grid;gap:15px}
.labelSmall{
  color:#78849f;
  font-size:10px;
  font-weight:800;
  margin-bottom:6px;
}
.developmentActive{
  margin-bottom:16px;
}

/* RECRUIT */
.recruitLayout{
  display:grid;
  grid-template-columns:320px 1fr;
  gap:18px;
  height:100%;
  min-height:0;
}
.applicantList{
  border:1px solid var(--line);
  border-radius:20px;
  overflow:auto;
  background:rgba(255,255,255,.025);
  padding:9px;
}
.applicant{
  padding:15px;
  border-radius:15px;
  border:1px solid transparent;
  margin-bottom:6px;
  cursor:pointer;
  transition:.15s;
}
.applicant:hover{background:rgba(255,255,255,.045)}
.applicant.selected{
  background:linear-gradient(100deg,rgba(98,113,255,.20),rgba(50,214,255,.05));
  border-color:rgba(109,124,255,.5);
}
.applicantName{font-weight:900}
.applicantMeta{font-size:10px;color:#77839d;margin-top:3px}
.recruitDetail{
  min-width:0;
  display:grid;
  grid-template-columns:330px 1fr;
  gap:22px;
}
.bigCharacter{
  min-height:450px;
  border-radius:22px;
  border:1px solid var(--line);
  background:
    radial-gradient(circle at 50% 25%,rgba(105,125,255,.20),transparent 35%),
    linear-gradient(145deg,#111b30,#090f1c);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}
.bigCharacter .employee{
  position:relative;
  transform:scale(2.7);
  left:auto;
  top:auto;
}
.bigCharacter .employeeName{display:none}
.detailInfo{
  display:flex;
  flex-direction:column;
  gap:14px;
  min-width:0;
}
.detailName{
  font-size:30px;
  font-weight:900;
}
.detailMeta{
  color:#8390aa;
}
.abilityGrid{display:grid;gap:10px}
.abilityRow{
  display:grid;
  grid-template-columns:100px 1fr 38px;
  align-items:center;
  gap:10px;
  font-size:11px;
}
.personality{
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.025);
}
.recruitActions{
  margin-top:auto;
  display:flex;
  gap:10px;
}
.price{
  font-size:21px;
  font-weight:900;
}

/* EMPLOYEES */
.employeeManage{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:18px;
  height:100%;
}
.employeeList{
  border:1px solid var(--line);
  border-radius:20px;
  padding:8px;
  overflow:auto;
}
.empItem{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px;
  border-radius:14px;
  cursor:pointer;
  border:1px solid transparent;
}
.empItem.selected{
  border-color:#6475ff;
  background:rgba(100,115,255,.12);
}
.empAvatar{
  width:36px;height:42px;position:relative;flex:none;
  transform:scale(.65);
}
.empDetail{
  display:grid;
  grid-template-columns:310px 1fr;
  gap:18px;
}
.empLarge{
  border:1px solid var(--line);
  border-radius:20px;
  min-height:450px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle at 50% 30%,rgba(100,120,255,.16),transparent 40%),#0c1321;
}
.empLarge .employee{
  position:relative;
  left:auto;
  top:auto;
  transform:scale(2.6);
}
.empLarge .employeeName{display:none}

/* GAME LIST */
.gameCard{
  position:relative;
  padding:20px;
  border-radius:20px;
  border:1px solid var(--line);
  background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.018));
  overflow:hidden;
}
.gameCard:before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  right:-80px;
  top:-80px;
  border-radius:50%;
  background:rgba(90,110,255,.15);
  filter:blur(20px);
}
.gameName{font-size:22px;font-weight:900}
.gameTag{
  display:inline-block;
  margin-top:8px;
  padding:5px 9px;
  border-radius:8px;
  background:rgba(255,255,255,.06);
  color:#9da9c1;
  font-size:10px;
}
.rating{
  font-size:40px;
  font-weight:900;
  background:linear-gradient(100deg,#fff,#67dbff);
  -webkit-background-clip:text;
  color:transparent;
}

/* COMPANY */
.rankBig{
  font-size:90px;
  line-height:1;
  font-weight:1000;
  background:linear-gradient(135deg,#fff,#7388ff,#42dfff);
  -webkit-background-clip:text;
  color:transparent;
}
.companyMetric{
  font-size:28px;
  font-weight:900;
}

/* TOAST */
#toastBox{
  position:absolute;
  right:300px;
  top:88px;
  z-index:200;
  display:grid;
  gap:8px;
  pointer-events:none;
}
.toast{
  min-width:240px;
  padding:13px 16px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:13px;
  background:rgba(12,18,31,.92);
  backdrop-filter:blur(15px);
  box-shadow:0 15px 40px rgba(0,0,0,.35);
  animation:toastIn .2s ease;
}
@keyframes toastIn{
  from{opacity:0;transform:translateX(20px)}
  to{opacity:1;transform:none}
}
.toast.good{border-color:rgba(72,230,154,.3)}
.toast.bad{border-color:rgba(255,102,125,.3)}

/* EVENT */
#eventOverlay{
  position:absolute;
  inset:72px 275px 0 0;
  z-index:150;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(3,5,10,.65);
  backdrop-filter:blur(9px);
}
.eventBox{
  width:min(720px,88%);
  padding:28px;
  border-radius:25px;
  border:1px solid rgba(255,255,255,.13);
  background:linear-gradient(145deg,#151e32,#090f1b);
  box-shadow:0 35px 100px rgba(0,0,0,.65);
}
.eventTop{
  display:flex;
  align-items:center;
  gap:20px;
}
.eventCharacter{
  width:110px;height:150px;
  border-radius:18px;
  background:#0b1220;
  display:flex;
  align-items:center;
  justify-content:center;
}
.eventCharacter .employee{
  position:relative;
  left:auto;
  top:auto;
  transform:scale(1.5);
}
.eventTitle{font-size:25px;font-weight:900}
.eventText{color:#8b97b0;line-height:1.7;margin-top:5px}
.eventActions{display:flex;gap:10px;margin-top:22px}

/* RESPONSIVE */
@media(max-width:1000px){
  .main{grid-template-columns:minmax(0,1fr) 220px}
  #overlay,#eventOverlay{right:220px}
  .menuBar{padding:12px}
  .menuText{font-size:11px}
  .menuIcon{font-size:21px}
  .recruitLayout{grid-template-columns:230px 1fr}
  .recruitDetail{grid-template-columns:230px 1fr}
  .empDetail{grid-template-columns:230px 1fr}
}
@media(max-width:760px){
  .topbar{height:62px;padding:0 10px;gap:8px}
  .brand{min-width:110px}
  .brandName{font-size:14px}
  .topStats{gap:4px}
  .stat{min-width:80px;padding:6px 8px}
  .statValue{font-size:12px}
  .stat:nth-child(3),.stat:nth-child(4){display:none}
  .main{grid-template-columns:1fr 75px}
  .menuBar{padding:7px;gap:7px}
  .menuTitle,.menuText,.menuSmall{display:none}
  .menuButton{min-height:55px;padding:0;justify-content:center;border-radius:14px}
  .menuIcon{font-size:25px}
  #overlay,#eventOverlay{inset:62px 75px 0 0;padding:10px}
  .modal{width:100%;height:100%;border-radius:18px}
  .modalHeader{height:60px;padding:0 15px}
  .modalTitle{font-size:18px}
  .modalBody{padding:14px}
  .devHero,.grid2,.grid3{grid-template-columns:1fr}
  .recruitLayout,.employeeManage{grid-template-columns:1fr;height:auto}
  .applicantList,.employeeList{max-height:180px}
  .recruitDetail,.empDetail{grid-template-columns:1fr}
  .bigCharacter,.empLarge{min-height:260px}
  #toastBox{right:85px}
}
</style>
</head>
<body>

<div id="app">

  <section id="startScreen">
    <div class="startBox">
      <div class="logo">ゲーム開発記</div>
      <div class="logoSub">小さな会社から、世界一のゲーム会社へ。</div>

<script>
/* =========================================================
   GAME STATE
========================================================= */

const genres = [
  "RPG","アクション","アドベンチャー","シミュレーション",
  "ストラテジー","パズル","レース","スポーツ","シューティング",
  "ホラー","サバイバル","音楽","格闘","プラットフォーマー",
  "ノベル","ミステリー","経営","サンドボックス","タワーディフェンス","MMO"
];

const themes = [
  "ファンタジー","SF","現代","学校","中世","未来","古代","戦争",
  "探偵","宇宙","海","西部劇","モンスター","ゾンビ","魔法",
  "スポーツ","料理","音楽","動物","乗り物"
];

const personalities = [
  ["🔥","熱血"],
  ["🧊","冷静"],
  ["😄","社交的"],
  ["🤫","人見知り"],
  ["🎨","自由人"],
  ["📚","努力家"],
  ["😴","マイペース"],
  ["😤","負けず嫌い"],
  ["😂","ムードメーカー"],
  ["💰","現実主義"]
];

const jobs = [
  ["programmer","💻","プログラマー"],
  ["designer","🎨","グラフィックデザイナー"],
  ["planner","📋","プランナー"],
  ["sound","🎵","サウンドクリエイター"]
];

const scales = {
  small:{name:"小規模",min:100,max:250,budgetMin:100,budgetMax:250,weeks:4,cap:70},
  medium:{name:"中規模",min:300,max:800,budgetMin:300,budgetMax:800,weeks:8,cap:85},
  large:{name:"大規模",min:800,max:2500,budgetMin:800,budgetMax:2500,weeks:16,cap:95},
  huge:{name:"超大作",min:2000,max:8000,budgetMin:2000,budgetMax:8000,weeks:32,cap:100}
};

let state = {
  started:false,
  paused:false,
  company:"",
  president:"",
  difficulty:"normal",
  money:2000,
  rank:"G",
  year:1,
  month:4,
  week:1,
  totalWeeks:0,
  fans:0,
  reputation:0,
  games:[],
  employees:[],
  applicants:[],
  awards:[],
  activeDevelopment:null,
  selectedApplicant:0,
  selectedEmployee:0,
  market:{genre:"RPG",theme:"ファンタジー",strength:1},
  nextEvent:5,
  event:null,
  menu:null,
  employeeCounter:0
};

let lastTime = performance.now();
let moneyAccumulator = 0;
let weekAccumulator = 0;
let uiAccumulator = 0;
let saveAccumulator = 0;
let employeeAIAccumulator = 0;

/* =========================================================
   HELPERS
========================================================= */

function moneyText(v){
  const n = Math.max(0,Math.round(v));
  return n.toLocaleString("ja-JP") + "万";
}

function yenFromMan(v){
  return Math.round(v * 10000);
}

function escapeHTML(s){
  return String(s ?? "").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

function rand(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function pick(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function toast(text,type=""){
  const box=document.getElementById("toastBox");
  const el=document.createElement("div");
  el.className="toast "+type;
  el.textContent=text;
  box.appendChild(el);
  setTimeout(()=>el.remove(),2800);
}

function statBar(label,value){
  return `
    <div class="barRow">
      <span>${label}</span>
      <div class="bar"><i style="width:${clamp(value,0,100)}%"></i></div>
      <b>${Math.round(value)}</b>
    </div>
  `;
}

function createCharacterHTML(e){
  return `
    <div class="employee ${e.job}" style="--shirt:${e.shirt}">
      <div class="charHead"></div>
      <div class="charHair" style="background:${e.hair}"></div>
      <div class="charEye a"></div>
      <div class="charEye b"></div>
      <div class="charBody"></div>
      <div class="charArm a"></div>
      <div class="charArm b"></div>
      <div class="charLeg a"></div>
      <div class="charLeg b"></div>
      <div class="tool"></div>
      <div class="employeeName">${escapeHTML(e.name)}</div>
    </div>
  `;
}

function createEmployeeData(level=1){
  const job=pick(jobs);
  const personality=pick(personalities);

  let base=level===1?rand(35,62):
           level===2?rand(50,72):
           level===3?rand(65,84):
           rand(78,94);

  const stats={
    programming:rand(25,65),
    graphics:rand(25,65),
    scenario:rand(25,65),
    sound:rand(25,65),
    planning:rand(25,65)
  };

  const key={
    programmer:"programming",
    designer:"graphics",
    planner:"planning",
    sound:"sound"
  }[job[0]];

  stats[key]=clamp(base+rand(-5,10),1,99);

  if(personality[1]==="努力家") base+=4;
  if(personality[1]==="熱血") base+=3;
  if(personality[1]==="自由人") stats.scenario+=7;
  if(personality[1]==="ムードメーカー") stats.planning+=5;

  const total=Object.values(stats).reduce((a,b)=>a+b,0);
  const salary=Math.round((180 + total*0.85 + rand(0,100))/10)*10;

  return {
    id:++state.employeeCounter,
    name:pick([
      "佐藤 健","山田 葵","鈴木 蓮","田中 美咲","高橋 悠",
      "伊藤 陽斗","渡辺 凛","中村 蒼","小林 結衣","加藤 陸",
      "吉田 玲奈","山本 大地","松本 海","井上 花","木村 翔"
    ])+" "+rand(1,99),
    age:rand(20,39),
    salary,
    job:job[0],
    jobIcon:job[1],
    jobName:job[2],
    programming:stats.programming,
    graphics:stats.graphics,
    scenario:stats.scenario,
    sound:stats.sound,
    planning:stats.planning,
    experience:rand(0,35),
    specialty:pick(genres),
    motivation:rand(72,100),
    personalityIcon:personality[0],
    personality:personality[1],
    hair:pick(["#171923","#3a2521","#56382c","#8b6748","#17151c","#b18b62"]),
    shirt:pick(["#315d95","#6d477e","#286c67","#8a5b3c","#394b79","#6b7541"]),
    x:rand(15,85),
    y:rand(48,78),
    tx:rand(15,85),
    ty:rand(48,78),
    state:"working",
    stateTimer:rand(2,7)
  };
}

function getRankMax(){
  return {G:4,F:6,E:9,D:12,C:16,B:20,A:25,S:30}[state.rank]||4;
}

function averageEmployeePower(){
  if(!state.employees.length)return 35;
  let total=0;
  state.employees.forEach(e=>{
    total += (
      e.programming+
      e.graphics+
      e.scenario+
      e.sound+
      e.planning
    )/5;
  });
  return total/state.employees.length;
}

function getDateText(){
  return `${state.year}年 ${state.month}月 ${state.week}週`;
}

function formatJob(e){
  return `${e.jobIcon} ${e.jobName}`;
}

/* =========================================================
   START
========================================================= */

function startGame(){
  state.company=document.getElementById("companyInput").value.trim() || "スターライトゲームズ";
  state.president=document.getElementById("presidentInput").value.trim() || "無名の社長";
  state.difficulty=document.getElementById("difficultyInput").value;

  if(state.difficulty==="easy")state.money=2500;
  if(state.difficulty==="hard")state.money=1500;

  state.started=true;

  document.getElementById("startScreen").style.display="none";
  document.getElementById("game").style.display="flex";
  document.getElementById("companyNameUI").textContent=state.company;

  generateApplicants("normal",4);
  createOfficeEmployees();
  updateAllUI();

  toast(`${state.company}を設立しました！`,"good");

  lastTime=performance.now();
  requestAnimationFrame(gameLoop);
}

/* =========================================================
   OFFICE
========================================================= */

function createOfficeEmployees(){
  const layer=document.getElementById("employeeLayer");
  layer.innerHTML="";
  state.employees.forEach(e=>addEmployeeToOffice(e));
}

function addEmployeeToOffice(e){
  const layer=document.getElementById("employeeLayer");
  if(document.getElementById("emp-"+e.id))return;

  const wrap=document.createElement("div");
  wrap.id="emp-"+e.id;
  wrap.className="employee";
  wrap.innerHTML=createCharacterHTML(e);
  layer.appendChild(wrap);

  updateEmployeeDOM(e);
}

function removeEmployeeFromOffice(id){
  const el=document.getElementById("emp-"+id);
  if(el)el.remove();
}

function updateEmployeeDOM(e){
  const el=document.getElementById("emp-"+e.id);
  if(!el)return;

  el.style.left=e.x+"%";
  el.style.top=e.y+"%";

  const inner=el.querySelector(".employee");
  if(inner){
    inner.className=`employee ${e.job} ${e.state}`;
    inner.style.setProperty("--shirt",e.shirt);
    const hair=inner.querySelector(".charHair");
    if(hair)hair.style.background=e.hair;
  }
}

function updateEmployeeAI(dt){
  if(state.paused)return;

  state.employees.forEach(e=>{
    e.stateTimer-=dt;

    if(e.stateTimer<=0){
      const r=Math.random();

      if(r<.58){
        e.state="working";
        e.tx=rand(12,88);
        e.ty=rand(47,82);
        e.stateTimer=rand(3,8);
      }else if(r<.78){
        e.state="walking";
        e.tx=rand(12,88);
        e.ty=rand(46,83);
        e.stateTimer=rand(3,6);
      }else if(r<.9){
        e.state="talking";
        e.tx=rand(25,75);
        e.ty=rand(52,78);
        e.stateTimer=rand(2,5);
      }else{
        e.state="break";
        e.tx=rand(10,90);
        e.ty=rand(45,84);
        e.stateTimer=rand(3,7);
      }
    }

    if(e.state==="walking" || e.state==="talking" || e.state==="break"){
      const speed=(e.state==="walking"?18:8)*dt;
      const dx=e.tx-e.x;
      const dy=e.ty-e.y;
      const dist=Math.hypot(dx,dy);

      if(dist>1){
        e.x += dx/dist*speed;
        e.y += dy/dist*speed;
      }else{
        e.x=e.tx;
        e.y=e.ty;
      }
    }

    updateEmployeeDOM(e);
  });
}

/* =========================================================
   REAL TIME LOOP
========================================================= */

function gameLoop(now){
  if(!state.started)return;

  const dt=Math.min((now-lastTime)/1000,.1);
  lastTime=now;

  if(!state.paused){
    realTimeMoney(dt);
    realTimeDevelopment(dt);

    employeeAIAccumulator+=dt;
    if(employeeAIAccumulator>.12){
      updateEmployeeAI(employeeAIAccumulator);
      employeeAIAccumulator=0;
    }

    weekAccumulator+=dt;
    if(weekAccumulator>=15){
      weekAccumulator-=15;
      advanceWeek();
    }

    saveAccumulator+=dt;
    if(saveAccumulator>=5){
      saveAccumulator=0;
      saveGame();
    }
  }

  uiAccumulator+=dt;
  if(uiAccumulator>=.25){
    uiAccumulator=0;
    updateLiveUI();
  }

  requestAnimationFrame(gameLoop);
}

/* =========================================================
   MONEY REAL TIME
========================================================= */

function realTimeMoney(dt){
  let incomePerSecond=0;

  state.games.forEach(g=>{
    if(!g.released)return;

    const age=Math.max(0,state.totalWeeks-g.releaseWeek);
    const decay=Math.max(.08,1-age*.012);

    let base=g.weeklyRevenue/15;
    base*=decay;

    if(state.market.genre===g.genre)base*=1.25;
    if(state.market.theme===g.theme)base*=1.15;

    incomePerSecond+=base;
    g.lifetimeRevenue+=base*dt;
    g.lifetimeSales+=Math.max(0,base*dt/(g.price||4000));
  });

  state.money+=incomePerSecond*dt;

  if(incomePerSecond>0 && Math.random()<dt*.4){
    state.fans+=incomePerSecond*.003;
  }
}

/* =========================================================
   DEVELOPMENT REAL TIME
========================================================= */

function realTimeDevelopment(dt){
  const d=state.activeDevelopment;
  if(!d)return;

  const staff=averageEmployeePower();

  let speed=.65 + state.employees.length*.055;
  speed += staff/170;
  speed += d.scale==="huge"?-.12:0;

  if(d.genre===state.market.genre)speed*=1.08;

  d.progress=clamp(d.progress+speed*dt,0,100);

  if(d.progress>=100){
    finishDevelopment();
  }
}

/* =========================================================
   WEEK
========================================================= */

function advanceWeek(){
  state.totalWeeks++;
  state.week++;

  if(state.week>4){
    state.week=1;
    state.month++;

    if(state.month>12){
      state.month=1;
      state.year++;
    }
  }

  marketUpdate();
  updateEmployeeGrowth();
  salaryCheck();
  employeeEventCheck();

  if(state.month===12 && state.week===4){
    runAwards();
  }

  checkRank();
}

/* =========================================================
   SALARY
========================================================= */

function salaryCheck(){
  /*
    最初のゲーム開始時は1年目4月なので支払いなし。
    2年目以降の4月第1週に年俸をまとめて支払う。
  */
  if(state.year>=2 && state.month===4 && state.week===1){
    const total=state.employees.reduce((a,e)=>a+e.salary,0);

    if(total>0){
      state.money-=total;
      toast(`年俸支払い：${moneyText(total)}`,"bad");

      state.employees.forEach(e=>{
        e.motivation=clamp(e.motivation+3,0,100);
      });
    }
  }
}

/* =========================================================
   MARKET
========================================================= */

function marketUpdate(){
  if(Math.random()<.2){
    state.market={
      genre:pick(genres),
      theme:pick(themes),
      strength:rand(1,5)
    };
    toast(`市場トレンド：${state.market.genre} / ${state.market.theme}`);
  }
}

/* =========================================================
   EMPLOYEE GROWTH
========================================================= */

function updateEmployeeGrowth(){
  state.employees.forEach(e=>{
    let bonus=.4;

    if(e.personality==="努力家")bonus*=1.25;
    if(e.personality==="熱血")bonus*=1.12;

    e.experience+=bonus;

    const stat=pick(["programming","graphics","scenario","sound","planning"]);
    e[stat]=clamp(e[stat]+Math.random()*.45*bonus,0,100);

    if(state.activeDevelopment){
      e.motivation=clamp(e.motivation+rand(-2,2),0,100);
    }
  });
}

/* =========================================================
   RANK
========================================================= */

function checkRank(){
  const score=
    state.fans*.002+
    state.reputation*.5+
    state.games.length*7+
    averageEmployeePower()*.2;

  let newRank="G";

  if(score>=450)newRank="S";
  else if(score>=320)newRank="A";
  else if(score>=220)newRank="B";
  else if(score>=145)newRank="C";
  else if(score>=90)newRank="D";
  else if(score>=50)newRank="E";
  else if(score>=25)newRank="F";

  if(newRank!==state.rank){
    const old=state.rank;
    state.rank=newRank;
    toast(`会社ランク ${old} → ${newRank}！`,"good");
  }
}

========================================================= */

function generateApplicants(tier="normal",count=4){
  const levels={
    normal:1,
    active:2,
    skilled:3,
    headhunt:4
  };

  state.applicants=[];
  for(let i=0;i<count;i++){
    state.applicants.push(createEmployeeData(levels[tier]||1));
  }
  state.selectedApplicant=0;
}

function recruit(type){
  const data={
    general:{name:"📢 一般募集",cost:20,min:2,max:4,tier:"normal"},
    active:{name:"📣 積極募集",cost:40,min:3,max:6,tier:"active"},
    skilled:{name:"⭐ スキル重視",cost:80,min:2,max:5,tier:"skilled"},
    headhunt:{name:"💎 ヘッドハンティング",cost:150,min:1,max:3,tier:"headhunt"}
  }[type];

  if(state.money<data.cost){
    toast("採用費が足りません。","bad");
    return;
  }

  if(state.employees.length>=getRankMax()){
    toast(`現在のランクでは社員は${getRankMax()}人までです。`,"bad");
    return;
  }

  state.money-=data.cost;

  const count=rand(data.min,data.max);
  generateApplicants(data.tier,count);

  renderRecruit();
  toast(`${data.name}：${count}名の応募がありました！`,"good");
}

function hireApplicant(){
  const e=state.applicants[state.selectedApplicant];
  if(!e)return;

  if(state.employees.length>=getRankMax()){
    toast("社員数の上限です。","bad");
    return;
  }

  const cost=rand(100,300);

  if(state.money<cost){
    toast(`採用費 ${moneyText(cost)} が足りません。`,"bad");
    return;
  }

  state.money-=cost;

  e.id=++state.employeeCounter;
  e.x=rand(15,85);
  e.y=rand(48,82);
  e.tx=e.x;
  e.ty=e.y;
  e.state="walking";
  e.stateTimer=2;

  state.employees.push(e);
  addEmployeeToOffice(e);

  toast(`${e.name}を${moneyText(cost)}で採用しました！`,"good");

  state.applicants.splice(state.selectedApplicant,1);

  if(state.applicants.length){
    state.selectedApplicant=clamp(state.selectedApplicant,0,state.applicants.length-1);
  }else{
    generateApplicants("normal",0);
  }

  renderRecruit();
  updateAllUI();
}

function rejectApplicant(){
  if(!state.applicants.length)return;

  state.applicants.splice(state.selectedApplicant,1);

  if(state.applicants.length){
    state.selectedApplicant=clamp(state.selectedApplicant,0,state.applicants.length-1);
  }

  renderRecruit();
}

  }

    title="追加予算の相談";
    text=`${e.name}「もう少し予算があれば、もっと良い作品にできます！」<br>追加予算100万円を投入しますか？`;

    `;
  }

function answerEvent(answer){
  const ev=state.event;
  if(!ev)return;

  const e=ev.employee;

  if(answer==="yes"){
    e.salary=Math.round(e.salary*1.3);
    e.motivation=clamp(e.motivation+12,0,100);
    toast(`${e.name}の年俸を引き上げました。`,"good");
  }

  if(answer==="idea"){
    e.motivation=clamp(e.motivation+10,0,100);
    state.reputation+=5;
    if(state.activeDevelopment){
      state.activeDevelopment.progress+=3;
    }
    toast(`${e.name}のアイデアを採用しました！`,"good");
  }

  if(answer==="training"){
    if(state.money>=50){
      state.money-=50;
      const stat=pick(["programming","graphics","scenario","sound","planning"]);
      e[stat]=clamp(e[stat]+8,0,100);
      e.experience+=5;
      toast(`${e.name}の能力が成長しました！`,"good");
    }else{
      toast("研修費が足りません。","bad");
    }
  }

  if(answer==="budget"){
    if(state.money>=100){
      state.money-=100;
      if(state.activeDevelopment){
        state.activeDevelopment.progress+=5;
        state.activeDevelopment.qualityBonus+=5;
      }
      toast("追加予算を投入しました！","good");
    }else{
      toast("追加予算が足りません。","bad");
    }
  }

  if(answer==="no"){
    e.motivation=clamp(e.motivation-8,0,100);
  }

  document.getElementById("eventOverlay").style.display="none";
  state.event=null;
}

/* =========================================================
   DEVELOPMENT
========================================================= */

function startDevelopment(){
  if(state.activeDevelopment){
    toast("すでにゲームを開発中です。","bad");
    return;
  }

  const title=document.getElementById("gameTitleInput").value.trim();
  const genre=document.querySelector("#genreChoices .choice.selected")?.dataset.value;
  const theme=document.querySelector("#themeChoices .choice.selected")?.dataset.value;
  const scale=document.querySelector("#scaleChoices .choice.selected")?.dataset.value;

  if(!title){
    toast("ゲームタイトルを入力してください。","bad");
    return;
  }

  if(!genre || !theme || !scale){
    toast("ジャンル・テーマ・規模を選択してください。","bad");
    return;
  }

  const s=scales[scale];
  const budget=Number(document.getElementById("budgetInput").value);

  if(!budget || budget<s.budgetMin || budget>s.budgetMax){
    toast(`予算は${moneyText(s.budgetMin)}〜${moneyText(s.budgetMax)}です。`,"bad");
    return;
  }

  if(state.money<budget){
    toast("資金が足りません。","bad");
    return;
  }

  state.money-=budget;

  state.activeDevelopment={
    title,
    genre,
    theme,
    scale,
    budget,
    progress:0,
    qualityBonus:0,
    startWeek:state.totalWeeks,
    minWeeks:s.weeks,
    cap:s.cap
  };

  toast(`「${title}」の開発を開始しました！`,"good");
  renderDevelopment();
}

function finishDevelopment(){
  const d=state.activeDevelopment;
  if(!d)return;

  const s=scales[d.scale];
  const team=averageEmployeePower();
  const compatibility=getCompatibility(d.genre,d.theme);

  let quality=
    team*.58+
    compatibility*.22+
    Math.min(100,d.budget/s.budgetMax*100)*.10+
    d.qualityBonus+
    rand(-5,8);

  quality=clamp(quality,20,s.cap);

  const rating=clamp(Math.round(quality),1,100);

  const price=rand(1980,6980);
  const weeklyRevenue=
    Math.max(8,rating*rating*.035 + state.employees.length*2 + rand(0,40));

  const game={
    title:d.title,
    genre:d.genre,
    theme:d.theme,
    scale:d.scale,
    budget:d.budget,
    rating,
    price,
    weeklyRevenue,
    releaseWeek:state.totalWeeks,
    lifetimeRevenue:0,
    lifetimeSales:0,
    released:true,
    awards:[]
  };

  state.games.push(game);
  state.reputation+=rating/10;
  state.fans+=rating*4;

  state.activeDevelopment=null;

  toast(`「${game.title}」が完成しました！ 評価 ${rating}点`,"good");
  openMenu("games");
}

/* =========================================================
   COMPATIBILITY
========================================================= */

function getCompatibility(genre,theme){
  const good=[
    ["RPG","ファンタジー"],["RPG","魔法"],["RPG","中世"],
    ["SF","宇宙"],["SF","未来"],["SF","戦争"],
    ["ホラー","ゾンビ"],["ホラー","現代"],["ホラー","モンスター"],
    ["スポーツ","スポーツ"],["音楽","音楽"],["レース","乗り物"],
    ["ミステリー","探偵"],["ノベル","学校"],["ノベル","現代"],
    ["経営","料理"],["経営","現代"],["サバイバル","海"],
    ["ストラテジー","戦争"],["アクション","モンスター"]
  ];

  if(good.some(x=>x[0]===genre&&x[1]===theme))return 100;
  return rand(55,88);
}

   AWARDS
========================================================= */

function runAwards(){
  if(!state.games.length)return;

  const best=state.games.reduce((a,b)=>a.rating>b.rating?a:b);

  state.awards.push({
    year:state.year,
    title:best.title,
    award:"年間ゲーム大賞"
  });

  best.awards.push("年間ゲーム大賞");
  state.fans+=best.rating*5;
  state.reputation+=15;

  toast(`🏆 ${best.title}が年間ゲーム大賞を受賞！`,"good");
}

}

function selectChoice(el,container){

}

function updateBudgetRange(){
  const key=document.querySelector("#scaleChoices .choice.selected")?.dataset.value;
  if(!key)return;
  const s=scales[key];
  const input=document.getElementById("budgetInput");
  if(input){
    input.min=s.budgetMin;
    input.max=s.budgetMax;
    input.value=s.budgetMin;
  }
  const text=document.getElementById("budgetRangeText");
  if(text)text.textContent=`${s.name}：${moneyText(s.budgetMin)}〜${moneyText(s.budgetMax)}`;
}

function averageStat(stat){
  if(!state.employees.length)return 0;
  return state.employees.reduce((a,e)=>a+e[stat],0)/state.employees.length;
}

function selectApplicant(index){
  if(index<0 || index>=state.applicants.length)return;

function handleRecruitKeys(e){
  if(state.menu!=="recruit")return;
  if(!state.applicants.length)return;

  if(e.key==="ArrowUp"){
    e.preventDefault();
    state.selectedApplicant=
      (state.selectedApplicant-1+state.applicants.length)%state.applicants.length;
    renderRecruit();
  }

  if(e.key==="ArrowDown"){
    e.preventDefault();
    state.selectedApplicant=
      (state.selectedApplicant+1)%state.applicants.length;
    renderRecruit();
  }
}

document.addEventListener("keydown",handleRecruitKeys);

function updateLiveUI(){
  document.getElementById("moneyUI").textContent=moneyText(state.money);
  document.getElementById("rankUI").textContent=state.rank;
  document.getElementById("employeeCountUI").textContent=
    `${state.employees.length} / ${getRankMax()}`;
  document.getElementById("dateUI").textContent=getDateText();

  if(state.menu==="development" && state.activeDevelopment){
    const p=document.getElementById("devProgressText");
    const f=document.getElementById("devProgressFill");
    if(p)p.textContent=state.activeDevelopment.progress.toFixed(1)+"%";
    if(f)f.style.width=state.activeDevelopment.progress+"%";
  }
}

function updateAllUI(){
  updateLiveUI();

  if(state.menu==="development")renderDevelopment();
  if(state.menu==="recruit")renderRecruit();
  if(state.menu==="employees")renderEmployees();
  if(state.menu==="games")renderGames();
  if(state.menu==="company")renderCompany();
  if(state.menu==="finance")renderFinance();
  if(state.menu==="awards")renderAwards();
}

/* =========================================================
   PAUSE
========================================================= */

function togglePause(){
  state.paused=!state.paused;
  document.getElementById("pauseBtn").textContent=
    state.paused?"▶ 再開":"Ⅱ 一時停止";
}

/* =========================================================
   SAVE / LOAD
========================================================= */

function saveGame(){
  if(!state.started)return;

  try{
    localStorage.setItem("game_dev_record_save",JSON.stringify(state));
  }catch(e){}
}

function loadGame(){
  try{
    const raw=localStorage.getItem("game_dev_record_save");
    if(!raw)return false;

    const saved=JSON.parse(raw);
    state=Object.assign(state,saved);

    document.getElementById("startScreen").style.display="none";
    document.getElementById("game").style.display="flex";
    document.getElementById("companyNameUI").textContent=state.company;

    createOfficeEmployees();
    updateAllUI();

    state.started=true;
    lastTime=performance.now();
    requestAnimationFrame(gameLoop);

    return true;
  }catch(e){
    return false;
  }
}

function deleteSave(){
  if(confirm("セーブデータを削除しますか？")){
    localStorage.removeItem("game_dev_record_save");
    toast("セーブデータを削除しました。","bad");
  }
}

/* =========================================================
   BANKRUPTCY
========================================================= */

setInterval(()=>{
  if(!state.started || state.paused)return;

  if(state.money<-500){
    triggerGameOver();
  }
},1000);

function triggerGameOver(){
  state.paused=true;

  const overlay=document.getElementById("overlay");
  const body=document.getElementById("modalBody");

  overlay.style.display="flex";
  document.getElementById("modalTitle").textContent="💀 会社倒産";

  body.innerHTML=`
    <div style="height:100%;display:flex;align-items:center;justify-content:center">
      <div style="text-align:center">
        <div style="font-size:80px">💀</div>
        <div style="font-size:34px;font-weight:1000;margin-top:15px">
          会社は倒産しました
        </div>
        <div style="color:#7d89a2;margin-top:10px">
          ${escapeHTML(state.company)}の挑戦はここで終わりました。
        </div>
        <button class="primary" style="margin-top:25px" onclick="location.reload()">
          最初からやり直す
        </button>
      </div>
    </div>
  `;
}

/* =========================================================
   CEO IDLE ANIMATION
========================================================= */

let ceoTime=0;

function animateCEO(){
  if(!state.started)return;

  ceoTime+=.025;

  const ceo=document.getElementById("ceo");
  if(ceo){
    const y=Math.sin(ceoTime)*1.2;
    ceo.style.marginBottom=y+"px";
  }

  requestAnimationFrame(animateCEO);
}

requestAnimationFrame(animateCEO);

/* =========================================================
   INITIAL LOAD
========================================================= */

window.addEventListener("load",()=>{
  const loaded=loadGame();

  if(!loaded){
    document.getElementById("startScreen").style.display="flex";
  }
});

/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    if(document.getElementById("eventOverlay").style.display==="flex"){
      return;
    }
    if(document.getElementById("overlay").style.display==="flex"){
      closeMenu();
    }
  }

  if(e.key===" " && state.started){
    if(document.activeElement.tagName!=="INPUT"){
      e.preventDefault();
      togglePause();
    }
  }
});
</script>
