<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ゲーム開発記</title>
<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,"Noto Sans JP",sans-serif;
  background:#020617;
  color:#e5e7eb;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

#startScreen{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 30%,#1e3a8a 0,#0f172a 35%,#020617 75%);
}

.startBox{
  width:min(560px,92vw);
  padding:38px;
  border:1px solid #475569;
  border-radius:22px;
  background:rgba(15,23,42,.95);
  box-shadow:0 30px 100px #000;
}

.logo{
  text-align:center;
  font-size:42px;
  font-weight:900;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#94a3b8;
  margin-bottom:28px;
}

.field{
  margin-bottom:16px;
}

.field label{
  display:block;
  margin-bottom:7px;
  color:#cbd5e1;
  font-weight:bold;
}

.field input,
.field select{
  width:100%;
  padding:13px 14px;
  border-radius:10px;
  border:1px solid #475569;
  background:#020617;
  color:#fff;
  outline:none;
}

.field input:focus,
.field select:focus{
  border-color:#60a5fa;
}

.startButton{
  width:100%;
  padding:15px;
  margin-top:8px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:#fff;
  font-size:18px;
  font-weight:bold;
}

.startButton:hover{
  filter:brightness(1.12);
}

#game{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

#topbar{
  height:66px;
  flex:0 0 66px;
  display:flex;
  align-items:center;
  gap:16px;
  padding:0 16px;
  background:#0f172a;
  border-bottom:1px solid #334155;
  z-index:50;
}

.gameTitle{
  font-size:21px;
  font-weight:900;
  white-space:nowrap;
}

.companyTop{
  color:#94a3b8;
  font-size:13px;
  white-space:nowrap;
}

.moneyBox{
  margin-left:auto;
  min-width:155px;
  text-align:right;
}

.money{
  color:#86efac;
  font-size:20px;
  font-weight:900;
}

.moneyLabel{
  font-size:10px;
  color:#64748b;
}

.topInfo{
  display:flex;
  gap:8px;
  align-items:center;
}

.badge{
  padding:7px 10px;
  border-radius:8px;
  background:#1e293b;
  border:1px solid #334155;
  font-size:12px;
}

.pauseButton{
  border:1px solid #475569;
  background:#1e293b;
  color:#fff;
  padding:9px 13px;
  border-radius:9px;
}

.pauseButton:hover{
  background:#334155;
}

#main{
  flex:1 1 0;
  min-height:0;
  height:auto;
  display:grid;
  grid-template-columns:minmax(0,1fr) 380px;
  overflow:hidden;
}

#office{
  position:relative;
  min-width:0;
  min-height:0;
  overflow:hidden;
  background:
    linear-gradient(#d8c39b 0 72%,#9a6b43 72% 100%);
}

.officeWall{
  position:absolute;
  inset:0 0 28%;
  background:
    linear-gradient(90deg,
      transparent 0 49.5%,
      rgba(120,90,50,.18) 49.5% 50.5%,
      transparent 50.5%),
    linear-gradient(#ead8b3,#d6bd91);
}

.window{
  position:absolute;
  top:35px;
  width:170px;
  height:115px;
  background:
    linear-gradient(90deg,transparent 48%,#94a3b8 48% 52%,transparent 52%),
    linear-gradient(transparent 48%,#94a3b8 48% 52%,transparent 52%),
    linear-gradient(#7dd3fc,#bae6fd);
  border:10px solid #795548;
  box-shadow:0 5px 12px rgba(0,0,0,.2);
}

.window.left{
  left:40px;
}

.window.right{
  right:40px;
}

.wallClock{
  position:absolute;
  top:48px;
  left:50%;
  transform:translateX(-50%);
  width:65px;
  height:65px;
  border-radius:50%;
  background:#fff;
  border:6px solid #475569;
  color:#111827;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.officeFloor{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:28%;
  background:
    repeating-linear-gradient(
      90deg,
      #9a6b43 0 80px,
      #8b5e3c 80px 82px
    );
}

.officeSign{
  position:absolute;
  top:170px;
  left:50%;
  transform:translateX(-50%);
  padding:8px 22px;
  background:#78350f;
  color:#fef3c7;
  border:4px solid #451a03;
  font-weight:900;
  letter-spacing:3px;
}

.desk{
  position:absolute;
  width:150px;
  height:65px;
  background:#8b5e3c;
  border:4px solid #5b3a29;
  border-radius:5px;
  box-shadow:0 8px 10px rgba(0,0,0,.2);
}

.desk:before,
.desk:after{
  content:"";
  position:absolute;
  bottom:-34px;
  width:9px;
  height:35px;
  background:#5b3a29;
}

.desk:before{
  left:14px;
}

.desk:after{
  right:14px;
}

.desk .monitor{
  position:absolute;
  width:52px;
  height:35px;
  top:-38px;
  left:49px;
  background:#111827;
  border:4px solid #334155;
  border-radius:3px;
}

.desk .monitor:after{
  content:"";
  position:absolute;
  left:19px;
  bottom:-10px;
  width:8px;
  height:10px;
  background:#334155;
}

.desk .keyboard{
  position:absolute;
  width:55px;
  height:7px;
  background:#cbd5e1;
  top:10px;
  left:48px;
}

.ceoDesk{
  left:50%;
  bottom:105px;
  transform:translateX(-50%);
  width:190px;
  height:75px;
  background:#713f12;
  border-color:#451a03;
}

.ceoDesk .monitor{
  width:70px;
  height:42px;
  left:60px;
  top:-48px;
}

.ceoDesk .keyboard{
  width:70px;
  left:60px;
}

.ceoName{
  position:absolute;
  bottom:70px;
  left:50%;
  transform:translateX(-50%);
  background:#451a03;
  color:#fef3c7;
  padding:5px 12px;
  border-radius:6px;
  font-size:12px;
  font-weight:bold;
  z-index:8;
}

#employeesLayer{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:20;
}

.employee{
  position:absolute;
  width:42px;
  height:72px;
  transform-origin:center bottom;
  will-change:transform;
}

.employee .head{
  position:absolute;
  width:25px;
  height:25px;
  top:0;
  left:9px;
  border-radius:5px 5px 8px 8px;
  border:2px solid #422006;
}

.employee .hair{
  position:absolute;
  width:27px;
  height:12px;
  top:-2px;
  left:8px;
  border-radius:8px 8px 3px 3px;
  z-index:2;
}

.employee .body{
  position:absolute;
  top:25px;
  left:6px;
  width:31px;
  height:29px;
  border-radius:5px 5px 3px 3px;
  border:2px solid #172033;
}

.employee .leg{
  position:absolute;
  top:52px;
  width:9px;
  height:19px;
  background:#1e293b;
  border-radius:2px;
}

.employee .leg.l{
  left:9px;
}

.employee .leg.r{
  right:9px;
}

.employee .tool{
  position:absolute;
  z-index:3;
  font-size:13px;
  top:30px;
  right:-8px;
}

.employee.typing .body{
  animation:typing .45s infinite alternate;
}

.employee.walking .leg.l{
  animation:walkL .22s infinite alternate;
}

.employee.walking .leg.r{
  animation:walkR .22s infinite alternate;
}

@keyframes typing{
  from{transform:translateY(0)}
  to{transform:translateY(2px)}
}

@keyframes walkL{
  from{transform:rotate(18deg)}
  to{transform:rotate(-18deg)}
}

@keyframes walkR{
  from{transform:rotate(-18deg)}
  to{transform:rotate(18deg)}
}

#ceoCharacter{
  position:absolute;
  left:50%;
  bottom:185px;
  width:58px;
  height:92px;
  transform:translateX(-50%);
  z-index:25;
  pointer-events:none;
}

.ceoCharHead{
  position:absolute;
  width:32px;
  height:32px;
  left:13px;
  top:0;
  background:#f2c6a0;
  border:3px solid #422006;
  border-radius:7px 7px 10px 10px;
}

.ceoCharHair{
  position:absolute;
  width:35px;
  height:15px;
  left:11px;
  top:-3px;
  background:#292524;
  border-radius:12px 12px 4px 4px;
  z-index:3;
}

.ceoCharBody{
  position:absolute;
  left:7px;
  top:31px;
  width:44px;
  height:39px;
  background:#1e293b;
  border:3px solid #0f172a;
  border-radius:7px;
}

.ceoCharShirt{
  position:absolute;
  left:22px;
  top:34px;
  width:14px;
  height:35px;
  background:#f8fafc;
  z-index:2;
  clip-path:polygon(0 0,100% 0,70% 100%,30% 100%);
}

.ceoTie{
  position:absolute;
  left:27px;
  top:35px;
  width:5px;
  height:30px;
  background:#dc2626;
  z-index:3;
}

.ceoArm{
  position:absolute;
  top:38px;
  width:10px;
  height:30px;
  background:#1e293b;
  border:2px solid #0f172a;
  border-radius:5px;
}

.ceoArm.left{
  left:1px;
  transform:rotate(8deg);
}

.ceoArm.right{
  right:1px;
  transform:rotate(-8deg);
}

.ceoLeg{
  position:absolute;
  top:68px;
  width:13px;
  height:24px;
  background:#172033;
  border-radius:3px;
}

.ceoLeg.left{
  left:13px;
}

.ceoLeg.right{
  right:13px;
}

#ceoLabel{
  position:absolute;
  left:50%;
  bottom:165px;
  transform:translateX(-50%);
  padding:4px 10px;
  background:#0f172a;
  border:2px solid #475569;
  color:#fff;
  border-radius:6px;
  font-size:11px;
  font-weight:bold;
  z-index:30;
  white-space:nowrap;
}

#panel{
  min-width:0;
  min-height:0;
  height:100%;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:#0f172a;
  border-left:1px solid #334155;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  flex:0 0 auto;
  border-bottom:1px solid #334155;
}

.tab{
  padding:11px 4px;
  border:0;
  background:#111827;
  color:#94a3b8;
  font-size:11px;
  font-weight:bold;
  border-right:1px solid #334155;
}

.tab:last-child{
  border-right:0;
}

.tab.active{
  background:#2563eb;
  color:#fff;
}

#panelContent{
  flex:1 1 0;
  min-height:0;
  height:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:16px;
  scrollbar-width:auto;
}

#panelContent::-webkit-scrollbar{
  width:10px;
}

#panelContent::-webkit-scrollbar-track{
  background:#111827;
}

#panelContent::-webkit-scrollbar-thumb{
  background:#475569;
  border-radius:10px;
}

#panelContent::-webkit-scrollbar-thumb:hover{
  background:#64748b;
}

.sectionTitle{
  font-size:19px;
  font-weight:900;
  margin-bottom:14px;
}

.card{
  background:#111827;
  border:1px solid #334155;
  border-radius:12px;
  padding:13px;
  margin-bottom:12px;
}

.cardTitle{
  font-weight:900;
  margin-bottom:7px;
}

.small{
  color:#94a3b8;
  font-size:12px;
  line-height:1.6;
}

.statGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.stat{
  padding:8px;
  border-radius:8px;
  background:#1e293b;
}

.stat span{
  display:block;
  color:#94a3b8;
  font-size:10px;
}

.stat b{
  font-size:14px;
}

.action{
  width:100%;
  padding:10px;
  border:1px solid #475569;
  background:#1e293b;
  color:#fff;
  border-radius:8px;
  margin-top:7px;
  text-align:left;
}

.action:hover{
  background:#334155;
}

.action.primary{
  background:#2563eb;
  border-color:#3b82f6;
}

.action.danger{
  background:#7f1d1d;
  border-color:#991b1b;
}

.action.green{
  background:#166534;
  border-color:#15803d;
}

input.smallInput,
select.smallInput{
  width:100%;
  padding:9px;
  border:1px solid #475569;
  background:#020617;
  color:#fff;
  border-radius:8px;
  margin-top:6px;
}

.employeeCard{
  position:relative;
  padding-left:64px;
}

.miniPerson{
  position:absolute;
  left:15px;
  top:15px;
  width:35px;
  height:55px;
}

.miniPerson .h{
  position:absolute;
  left:8px;
  top:0;
  width:19px;
  height:19px;
  border-radius:5px;
  background:#f2c6a0;
  border:2px solid #422006;
}

.miniPerson .b{
  position:absolute;
  left:4px;
  top:18px;
  width:27px;
  height:25px;
  border-radius:4px;
  background:#2563eb;
}

.miniPerson .l1,
.miniPerson .l2{
  position:absolute;
  top:42px;
  width:7px;
  height:13px;
  background:#172033;
}

.miniPerson .l1{left:7px}
.miniPerson .l2{right:7px}

.progress{
  width:100%;
  height:8px;
  background:#020617;
  border-radius:10px;
  overflow:hidden;
  margin-top:6px;
}

.progress div{
  height:100%;
  background:#3b82f6;
}

.genreGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6px;
}

.genreButton{
  padding:9px 5px;
  border:1px solid #334155;
  background:#1e293b;
  color:#cbd5e1;
  border-radius:7px;
  font-size:11px;
}

.genreButton.selected{
  background:#2563eb;
  color:#fff;
  border-color:#60a5fa;
}

.gameCover{
  height:105px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-weight:900;
  font-size:17px;
  margin-bottom:10px;
  background:
    linear-gradient(135deg,#312e81,#7c3aed,#db2777);
}

#toast{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translateX(-50%) translateY(30px);
  opacity:0;
  pointer-events:none;
  z-index:5000;
  background:#0f172a;
  border:1px solid #475569;
  padding:12px 18px;
  border-radius:10px;
  box-shadow:0 10px 40px #000;
  transition:.25s;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.overlay{
  position:fixed;
  inset:0;
  z-index:4000;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(2,6,23,.72);
  backdrop-filter:blur(3px);
}

.overlay.show{
  display:flex;
}

.eventBox{
  width:min(620px,92vw);
  max-height:88vh;
  overflow:auto;
  padding:22px;
  border:1px solid #475569;
  border-radius:18px;
  background:#0f172a;
  box-shadow:0 30px 100px #000;
}

.eventScene{
  min-height:180px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  background:
    linear-gradient(#d8c39b 0 65%,#9a6b43 65%);
  border-radius:12px;
  overflow:hidden;
  margin-bottom:15px;
}

.eventPerson{
  width:100px;
  height:150px;
  position:relative;
}

.eventPerson .head{
  position:absolute;
  left:29px;
  top:5px;
  width:48px;
  height:48px;
  background:#f2c6a0;
  border:4px solid #422006;
  border-radius:10px 10px 15px 15px;
}

.eventPerson .hair{
  position:absolute;
  left:25px;
  top:1px;
  width:56px;
  height:22px;
  background:#292524;
  border-radius:18px 18px 5px 5px;
  z-index:2;
}

.eventPerson .body{
  position:absolute;
  left:18px;
  top:52px;
  width:64px;
  height:58px;
  background:#2563eb;
  border:4px solid #172033;
  border-radius:8px;
}

.eventPerson .legs{
  position:absolute;
  top:108px;
  left:28px;
  width:15px;
  height:35px;
  background:#172033;
  box-shadow:29px 0 #172033;
}

.eventPerson .tool{
  position:absolute;
  right:-8px;
  top:58px;
  font-size:28px;
}

.eventTitle{
  font-size:20px;
  font-weight:900;
  margin-bottom:8px;
}

.eventText{
  color:#cbd5e1;
  line-height:1.7;
  margin-bottom:14px;
}

.eventButtons{
  display:grid;
  gap:8px;
}

.eventButtons button{
  padding:12px;
  border-radius:9px;
  border:1px solid #475569;
  background:#1e293b;
  color:#fff;
  text-align:left;
}

.eventButtons button:hover{
  background:#334155;
}

.centerEmployee{
  position:fixed;
  left:50%;
  top:40%;
  transform:translate(-50%,-50%);
  z-index:3900;
  display:none;
}

.centerEmployee.show{
  display:block;
}

.centerEmployee .bigPerson{
  width:150px;
  height:220px;
  position:relative;
  filter:drop-shadow(0 15px 25px rgba(0,0,0,.5));
}

.bigPerson .head{
  position:absolute;
  left:43px;
  top:5px;
  width:64px;
  height:64px;
  background:#f2c6a0;
  border:5px solid #422006;
  border-radius:12px 12px 18px 18px;
}

.bigPerson .hair{
  position:absolute;
  left:38px;
  top:0;
  width:74px;
  height:27px;
  background:#292524;
  border-radius:22px 22px 7px 7px;
  z-index:3;
}

.bigPerson .body{
  position:absolute;
  left:25px;
  top:68px;
  width:100px;
  height:88px;
  background:#2563eb;
  border:5px solid #172033;
  border-radius:12px;
}

.bigPerson .arm{
  position:absolute;
  top:76px;
  width:24px;
  height:75px;
  background:#2563eb;
  border:5px solid #172033;
  border-radius:12px;
}

.bigPerson .arm.l{
  left:8px;
  transform:rotate(5deg);
}

.bigPerson .arm.r{
  right:8px;
  transform:rotate(-5deg);
}

.bigPerson .leg{
  position:absolute;
  top:150px;
  width:27px;
  height:65px;
  background:#172033;
  border-radius:5px;
}

.bigPerson .leg.l{
  left:45px;
}

.bigPerson .leg.r{
  right:45px;
}

.bigPerson .tool{
  position:absolute;
  right:0;
  top:90px;
  font-size:34px;
  z-index:5;
}

.gameOver{
  position:fixed;
  inset:0;
  z-index:10000;
  background:#020617;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.gameOver.show{
  display:flex;
}

.gameOver h1{
  font-size:50px;
  color:#ef4444;
  margin-bottom:15px;
}

@media(max-width:900px){
  #main{
    grid-template-columns:minmax(0,1fr) 330px;
  }

  .gameTitle{
    font-size:17px;
  }
}

@media(max-width:700px){
  #topbar{
    gap:7px;
    padding:0 8px;
  }

  .companyTop{
    display:none;
  }

  .moneyBox{
    min-width:115px;
  }

  #main{
    grid-template-columns:minmax(0,1fr) 300px;
  }

  .window{
    display:none;
  }
}
</style>
</head>
<body>

<div id="startScreen">
  <div class="startBox">
    <div class="logo">🎮 ゲーム開発記</div>
    <div class="subtitle">小さな会社から、世界一のゲーム会社へ。</div>

    <div class="field">
      <label>会社名</label>
      <input id="companyInput" placeholder="例：キノコゲームズ">
    </div>

    <div class="field">
      <label>社長名</label>
      <input id="presidentInput" placeholder="例：キノコ">
    </div>

    <div class="field">
      <label>難易度</label>
      <select id="difficultyInput">

<script>
"use strict";

const $=id=>document.getElementById(id);

const GENRES=[
  "RPG","アクション","アドベンチャー","シミュレーション",
  "ストラテジー","パズル","レース","スポーツ","シューティング",
  "ホラー","サバイバル","音楽","格闘","プラットフォーマー",
  "ノベル","ミステリー","経営","サンドボックス",
  "タワーディフェンス","MMO"
];

const THEMES=[
  "ファンタジー","SF","現代","学校","中世","未来","古代",
  "戦争","探偵","宇宙","海","西部劇","モンスター","ゾンビ",
  "魔法","スポーツ","料理","音楽","動物","乗り物"
];

const PERSONALITIES=[
  ["🔥","熱血"],
  ["🧊","冷静"],
  ["😄","社交的"],
  ["🤫","人見知り"],
  ["🎨","自由人"],
  ["📚","努力家"],
  ["😴","マイペース"],
  ["😤","負けず嫌い"],
  ["😂","ムードメーカー"],
  ["💰","現実主義"]
];

const JOBS=[
  {name:"プログラマー",icon:"💻",color:"#2563eb"},
  {name:"グラフィックデザイナー",icon:"🎨",color:"#db2777"},
  {name:"プランナー",icon:"📋",color:"#16a34a"},
  {name:"サウンドクリエイター",icon:"🎵",color:"#9333ea"}
];

const SCALES={
  small:{
    name:"小規模",
    min:1000000,
    max:2500000,
    weeks:4,
    cap:70
  },
  medium:{
    name:"中規模",
    min:3000000,
    max:8000000,
    weeks:8,
    cap:85
  },
  large:{
    name:"大規模",
    min:8000000,
    max:25000000,
    weeks:16,
    cap:95
  },
  huge:{
    name:"超大作",
    min:20000000,
    max:80000000,
    weeks:32,
    cap:100
  }
};

const RANKS=[
  {rank:"G",max:4},
  {rank:"F",max:6},
  {rank:"E",max:9},
  {rank:"D",max:12},
  {rank:"C",max:16},
  {rank:"B",max:20},
  {rank:"A",max:25},
  {rank:"S",max:30}
];

let state=null;
let activeTab="development";
let paused=false;
let gameStarted=false;
let weekTimer=0;
let uiTimer=0;
let lastFrame=performance.now();
let eventBusy=false;
let panelDirty=true;
let selectedGenre=GENRES[0];
let selectedTheme=THEMES[0];

function money(n){
  return "¥"+Math.round(n).toLocaleString("ja-JP");
}

function rand(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function randFloat(min,max){
  return Math.random()*(max-min)+min;
}

function choice(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function showToast(text){
  const t=$("toast");
  t.textContent=text;
  t.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer=setTimeout(()=>t.classList.remove("show"),2500);
}

function startGame(){

  const company=$("companyInput").value.trim() || "キノコゲームズ";
  const president=$("presidentInput").value.trim() || "キノコ";
  const difficulty=$("difficultyInput").value;

  let moneyStart=20000000;

  if(difficulty==="easy") moneyStart=25000000;
  if(difficulty==="hard") moneyStart=15000000;

  state={
    company,
    president,
    difficulty,

    money:moneyStart,

    year:1,
    month:4,
    day:1,
    week:1,

    rank:"G",

    employees:[],
    applicants:[],
    games:[],

    development:null,

    fans:0,
    reputation:0,

    market:{
      genre:choice(GENRES),
      theme:choice(THEMES),
      strength:rand(55,90)
    },

    awards:[],

    nextEmployeeEvent:rand(3,6),
    gameOver:false
  };

  gameStarted=true;

  $("startScreen").style.display="none";
  $("game").style.display="flex";

  $("companyTop").textContent=company;

  createEmployeeLayer();
  renderPanel();
  updateLiveUI();

  lastFrame=performance.now();
  requestAnimationFrame(gameLoop);

  showToast("会社設立！ゲーム開発を始めよう！");
}

function createEmployeeData(jobName=null){
  const job=jobName || choice(JOBS);

  const strength=rand(35,70);

  const e={
    id:crypto.randomUUID(),
    name:choice([
      "田中","佐藤","鈴木","高橋","伊藤","渡辺","山本",
      "中村","小林","加藤","吉田","山田","松本","井上",
      "木村","林","斎藤","清水","山口","森"
    ])+" "+choice(["一郎","太郎","花子","健","翔","蓮","優","葵","結衣","大輔"]),

    age:rand(20,45),
    salary:Math.round((strength/100)*2800000+900000),

    programming:rand(25,75),
    graphics:rand(25,75),
    scenario:rand(25,75),
    sound:rand(25,75),
    planning:rand(25,75),

    experience:rand(0,45),
    specialty:job.name,

    motivation:rand(70,100),
    personality:choice(PERSONALITIES),

    x:rand(8,90),
    y:rand(45,67),

    homeX:0,
    homeY:0,

    targetX:0,
    targetY:0,

    state:"work",
    stateTimer:randFloat(3,8),
    speed:randFloat(4,8),
    direction:1,
    el:null,

    returningFromEvent:false,
    eventType:null
  };

  e.homeX=e.x;
  e.homeY=e.y;

  return e;
}

function createEmployeeLayer(){

  const layer=$("employeesLayer");
  layer.innerHTML="";

  state.employees.forEach((e,i)=>{

    const el=document.createElement("div");
    el.className="employee typing";
    el.dataset.id=e.id;

    const head=document.createElement("div");
    head.className="head";

    const hair=document.createElement("div");
    hair.className="hair";

    const body=document.createElement("div");
    body.className="body";

    const legL=document.createElement("div");
    legL.className="leg l";

    const legR=document.createElement("div");
    legR.className="leg r";

    const tool=document.createElement("div");
    tool.className="tool";

    const colors=[
      "#2563eb","#dc2626","#16a34a","#9333ea",
      "#ea580c","#0891b2","#be123c","#4f46e5"
    ];

    const hairColors=[
      "#171717","#292524","#451a03","#713f12",
      "#475569","#78350f"
    ];

    head.style.background=choice([
      "#f2c6a0","#e9b384","#d99b70","#f5d0ae"
    ]);

    body.style.background=choice(colors);
    hair.style.background=choice(hairColors);

    tool.textContent=
      e.specialty==="プログラマー" ? "💻" :
      e.specialty==="グラフィックデザイナー" ? "🎨" :
      e.specialty==="プランナー" ? "📋" : "🎵";

    el.append(
      hair,
      head,
      body,
      legL,
      legR,
      tool
    );

    e.el=el;
    layer.appendChild(el);

    animateEmployee(e,0);
  });
}

function setEmployeeState(e,newState){

  e.state=newState;

  if(!e.el)return;

  e.el.classList.remove("typing","walking");

  if(newState==="work"){
    e.el.classList.add("typing");
  }

  if(newState==="walk" || newState==="return"){
    e.el.classList.add("walking");
  }
}

function updateEmployeeAI(e,dt){

  e.stateTimer-=dt;

  if(e.returningFromEvent){

    e.targetX=e.homeX;
    e.targetY=e.homeY;

    const dx=e.targetX-e.x;
    const dy=e.targetY-e.y;
    const dist=Math.sqrt(dx*dx+dy*dy);

    if(dist<1.2){
      e.x=e.homeX;
      e.y=e.homeY;
      e.returningFromEvent=false;
      setEmployeeState(e,"work");
      e.stateTimer=randFloat(4,9);
    }else{
      e.x+=(dx/dist)*e.speed*dt;
      e.y+=(dy/dist)*e.speed*dt;
      e.direction=dx>=0?1:-1;
      setEmployeeState(e,"return");
    }

    return;
  }

  if(e.state==="walk" || e.state==="break"){

    const dx=e.targetX-e.x;
    const dy=e.targetY-e.y;
    const dist=Math.sqrt(dx*dx+dy*dy);

    if(dist<1){

      if(e.state==="walk"){
        setEmployeeState(e,"break");
        e.stateTimer=randFloat(2,5);
      }else{
        e.targetX=e.homeX;
        e.targetY=e.homeY;
        setEmployeeState(e,"return");
      }

    }else{

      e.x+=(dx/dist)*e.speed*dt;
      e.y+=(dy/dist)*e.speed*dt;

      e.direction=dx>=0?1:-1;

      if(e.state==="walk")setEmployeeState(e,"walk");
      if(e.state==="return")setEmployeeState(e,"return");
    }

    return;
  }

  if(e.state==="return"){

    const dx=e.homeX-e.x;
    const dy=e.homeY-e.y;
    const dist=Math.sqrt(dx*dx+dy*dy);

    if(dist<1){
      e.x=e.homeX;
      e.y=e.homeY;
      setEmployeeState(e,"work");
      e.stateTimer=randFloat(5,10);
    }else{
      e.x+=(dx/dist)*e.speed*dt;
      e.y+=(dy/dist)*e.speed*dt;
      e.direction=dx>=0?1:-1;
    }

    return;
  }

  if(e.state==="work" && e.stateTimer<=0){

    const r=Math.random();

    if(r<0.72){

      e.targetX=rand(12,88);
      e.targetY=rand(45,68);

      setEmployeeState(e,"walk");

    }else{

      e.targetX=rand(15,85);
      e.targetY=rand(45,65);

      setEmployeeState(e,"walk");
    }

    e.stateTimer=randFloat(4,9);
  }

  if(e.state==="break" && e.stateTimer<=0){

    e.targetX=e.homeX;
    e.targetY=e.homeY;
    setEmployeeState(e,"return");
  }
}

function animateEmployee(e,dt){

  if(!e.el)return;

  const bob=
    e.state==="walk" || e.state==="return"
      ? Math.sin(performance.now()/100)*2
      : Math.sin(performance.now()/700)*.5;

  const scaleX=e.direction<0?-1:1;

  e.el.style.transform=
    `translate3d(calc(${e.x}% - 21px),calc(${e.y}% - 60px + ${bob}px),0) scaleX(${scaleX})`;
}

function gameLoop(now){

  if(!gameStarted)return;

  const dt=Math.min(.05,(now-lastFrame)/1000);
  lastFrame=now;

  if(!paused && state && !state.gameOver){

    for(const e of state.employees){
      updateEmployeeAI(e,dt);
      animateEmployee(e,dt);
    }

    weekTimer+=dt;

    if(weekTimer>=15){
      weekTimer-=15;
      advanceWeek();
    }

    uiTimer+=dt;

    if(uiTimer>=.2){
      uiTimer=0;
      updateLiveUI();
    }
  }

  requestAnimationFrame(gameLoop);
}

function advanceWeek(){

  if(!state || state.gameOver)return;

  state.week++;

  state.day+=7;

  if(state.day>28){

    state.day=1;
    state.month++;

    if(state.month>12){
      state.month=1;
      state.year++;
    }
  }

  developGameWeek();
  earnGameRevenue();
  updateEmployeeGrowth();
  marketUpdate();
  checkEmployeeEvent();

  if(state.month===12 && state.day===1){
    runAwards();
  }

  checkRank();

  if(state.money<-5000000){
    triggerGameOver("資金が−500万円を下回りました。");
    return;
  }

  saveGame();
  updateLiveUI();

  if(panelDirty)renderPanel();
}

function developGameWeek(){

  const d=state.development;

  if(!d)return;

  const team=state.employees;

  let skill=0;

  for(const e of team){

    let s=(
      e.programming+
      e.graphics+
      e.scenario+
      e.sound+
      e.planning
    )/5;

    if(e.specialty==="プログラマー")s+=8;
    if(e.specialty==="グラフィックデザイナー")s+=8;
    if(e.specialty==="プランナー")s+=8;
    if(e.specialty==="サウンドクリエイター")s+=8;

    skill+=s;
  }

  if(team.length===0){
    d.progress+=0.2;
  }else{
    d.progress+=Math.max(
      .7,
      skill/team.length/22
    );
  }

  const compatibility=getCompatibility(
    d.genre,
    d.theme
  );

  d.quality=clamp(
    d.quality+
    ((skill/Math.max(1,team.length))/90)*.5+
    compatibility/300+
    Math.random()*0.35,
    0,
    d.cap
  );

  d.progress=clamp(
    d.progress,
    0,
    100
  );

  if(d.progress>=100){
    finishDevelopment();
  }
}

function finishDevelopment(){

  const d=state.development;

  if(!d)return;

  const quality=Math.round(clamp(d.quality,1,100));

  const game={
    id:crypto.randomUUID(),
    title:d.title,
    genre:d.genre,
    theme:d.theme,
    scale:d.scale,
    quality,
    rating:calculateRating(quality),
    price:d.price,
    sales:0,
    revenue:0,
    weeks:0,
    fans:0,
    releasedWeek:state.week,
    hype:rand(40,75),
    awards:[]
  };

  state.games.push(game);

  state.development=null;

  showToast(`🎉「${game.title}」完成！ 評価 ${game.rating.toFixed(1)}/10`);

  panelDirty=true;
}

function calculateRating(q){

  let rating=
    4+
    q*.055+
    randFloat(-.5,.7);

  return clamp(rating,1,10);
}

function earnGameRevenue(){

  for(const g of state.games){

    g.weeks++;

    const trend=
      state.market.genre===g.genre ? 1.35 : 1;

    const themeTrend=
      state.market.theme===g.theme ? 1.22 : 1;

    const quality=
      .45+(g.quality/100)*.9;

    const hype=
      .7+(g.hype/100)*.9;

    const decline=
      Math.max(.12,1-(g.weeks*.025));

    let weeklySales=
      80+
      g.quality*25+
      g.rating*120+
      state.fans*.015;

    weeklySales*=
      trend*
      themeTrend*
      quality*
      hype*
      decline;

    weeklySales*=randFloat(.75,1.25);

    weeklySales=Math.max(0,Math.floor(weeklySales));

    const revenue=weeklySales*g.price*.72;

    g.sales+=weeklySales;
    g.revenue+=revenue;

    state.money+=revenue;

    g.fans+=Math.floor(weeklySales*.04);

    state.fans+=Math.floor(weeklySales*.012);

    g.hype=clamp(
      g.hype+
      randFloat(-2,2),
      5,
      100
    );
  }
}

function updateEmployeeGrowth(){

  for(const e of state.employees){

    let gain=.25;

    if(e.personality[1]==="努力家"){
      gain*=1.35;
    }

    if(e.personality[1]==="熱血"){
      gain*=1.15;
    }

    if(state.development){
      gain+=.15;
    }

    e.experience+=gain;

    const chance=
      .15+
      e.experience/1000;

    if(Math.random()<chance){

      const stat=choice([
        "programming",
        "graphics",
        "scenario",
        "sound",
        "planning"
      ]);

      e[stat]=clamp(
        e[stat]+randFloat(.1,.6),
        1,
        100
      );
    }

    if(e.personality[1]==="現実主義" && Math.random()<.01){
      e.salary*=1.02;
    }
  }
}

function marketUpdate(){

  if(Math.random()<.2){

    state.market={
      genre:choice(GENRES),
      theme:choice(THEMES),
      strength:rand(55,95)
    };

    showToast(
      `📈 市場トレンド更新：${state.market.genre} × ${state.market.theme}`
    );
  }
}

function getCompatibility(genre,theme){

  const pairs={
    "RPG|ファンタジー":96,
    "RPG|SF":90,
    "アクション|戦争":88,
    "アクション|モンスター":91,
    "ホラー|ゾンビ":97,
    "ホラー|学校":91,
    "音楽|音楽":100,
    "スポーツ|スポーツ":100,
    "料理|料理":100,
    "ミステリー|探偵":98,
    "シューティング|宇宙":94,
    "サバイバル|ゾンビ":95,
    "ノベル|学校":91,
    "経営|現代":90,
    "MMO|ファンタジー":94,
    "サンドボックス|動物":87,
    "レース|乗り物":99
  };

  const key=genre+"|"+theme;

  if(pairs[key]!=null)return pairs[key];

  return rand(35,90);
}

function checkRank(){

  const old=state.rank;

  const score=
    state.fans+
    state.games.length*300+
    state.games.reduce((a,g)=>a+g.quality*15,0)+
    state.money/1000000;

  let rank="G";

  if(score>3000)rank="F";
  if(score>7000)rank="E";
  if(score>15000)rank="D";
  if(score>30000)rank="C";
  if(score>60000)rank="B";
  if(score>120000)rank="A";
  if(score>250000)rank="S";

  state.rank=rank;

  if(old!==rank){
    showToast(`🏆 会社ランクが ${old} → ${rank} に上がった！`);
  }
}

function checkEmployeeEvent(){

  if(eventBusy)return;

  if(state.employees.length===0)return;

  state.nextEmployeeEvent--;

  if(state.nextEmployeeEvent<=0){

    state.nextEmployeeEvent=rand(3,6);

    const e=choice(state.employees);

    startEmployeeEvent(e);
  }
}

function moveEmployeeToCEO(e){

  e.targetX=50;
  e.targetY=55;

  setEmployeeState(e,"walk");
}

function startEmployeeEvent(e){

  if(eventBusy)return;

  eventBusy=true;

  e.eventType=choice([
    "salary",
    "budget",
    "idea",
    "training"
  ]);

  e.targetX=50;
  e.targetY=55;

  moveEmployeeToCEO(e);

  const wait=()=>{

    if(!eventBusy)return;

    const dx=e.x-50;
    const dy=e.y-55;
    const dist=Math.sqrt(dx*dx+dy*dy);

    if(dist<3){

      showEmployeeEvent(e);

    }else{

      requestAnimationFrame(wait);

    }
  };

  requestAnimationFrame(wait);
}

function answerSalary(e,yes){

  if(yes){

    e.salary=Math.round(e.salary*1.3);
    e.motivation=clamp(e.motivation+8,0,100);

    showToast(`${e.name}の給与を30%アップした！`);

  }else{

    e.motivation=clamp(e.motivation-8,0,100);

    showToast(`${e.name}は少し残念そうだ……`);

  }

  finishEmployeeEvent(e);
}

function answerBudget(e){

  if(!state.development){

    showToast("現在開発中のゲームがありません。");
    finishEmployeeEvent(e);
    return;
  }

  $("employeeOverlay").classList.remove("show");

  const amount=prompt(
    "追加予算を入力してください。\n例：1000000",
    "1000000"
  );

  if(amount===null){

    finishEmployeeEvent(e);
    return;
  }

  const add=Math.floor(Number(amount));

  if(!Number.isFinite(add)||add<=0){

    showToast("金額が正しくありません。");
    finishEmployeeEvent(e);
    return;
  }

  if(state.money<add){

    showToast("資金が足りません。");
    finishEmployeeEvent(e);
    return;
  }

  state.money-=add;

  state.development.budget+=add;

  state.development.quality=
    clamp(
      state.development.quality+
      Math.min(8,add/1000000*1.2),
      0,
      state.development.cap
    );

  state.development.innovation+=
    Math.min(20,add/500000);

  showToast(
    `💰 ${money(add)}を追加投入した！`
  );

  finishEmployeeEvent(e);
}

function trainingEmployee(e){

  const cost=500000;

  if(state.money<cost){

    showToast("研修費が足りません。");
    finishEmployeeEvent(e);
    return;
  }

  state.money-=cost;

  const stat=choice([
    "programming",
    "graphics",

  e[stat]=clamp(e[stat]+rand(3,8),0,100);
  e.experience+=rand(3,8);

}

function recruit(type){

  const configs={
    general:{
      cost:200000,
      min:2,
      max:4,
      quality:0
    },
    active:{
      cost:400000,
      min:3,
      max:6,
      quality:8
    },
    skilled:{
      cost:800000,
      min:2,
      max:5,
      quality:17
    },
    headhunt:{
      cost:1500000,
      min:1,
      max:3,
      quality:27
    }
  };

  const c=configs[type];

  if(!c)return;

  if(state.money<c.cost){

    showToast("採用活動費が足りません。");
    return;
  }

  if(state.employees.length>=getRankMax()){

    showToast("現在の会社ランクではこれ以上雇えません。");
    return;
  }

  state.money-=c.cost;

  state.applicants=[];

  const count=rand(c.min,c.max);

  for(let i=0;i<count;i++){

    const e=createEmployeeData();

    const bonus=c.quality;

    e.programming=clamp(e.programming+rand(0,bonus),0,100);
    e.graphics=clamp(e.graphics+rand(0,bonus),0,100);
    e.scenario=clamp(e.scenario+rand(0,bonus),0,100);
    e.sound=clamp(e.sound+rand(0,bonus),0,100);
    e.planning=clamp(e.planning+rand(0,bonus),0,100);

    e.salary+=bonus*20000;

    state.applicants.push(e);
  }

  showToast(`📢 ${count}人の応募者が集まった！`);

  panelDirty=true;
  renderPanel();
}

function hireApplicant(index){

  const e=state.applicants[index];

  if(!e)return;

  const cost=rand(1000000,3000000);

  if(state.money<cost){

    return;
  }

  if(state.employees.length>=getRankMax()){

    showToast("社員数上限です。");
    return;

  state.money-=cost;

  state.employees.push(e);

  state.applicants.splice(index,1);

  e.homeX=rand(10,88);
  e.homeY=rand(45,68);
  e.x=e.homeX;
  e.y=e.homeY;

  createEmployeeLayer();

  showToast(

  );

  panelDirty=true;
  renderPanel();
}

function getRankMax(){

  return RANKS.find(
    x=>x.rank===state.rank
  )?.max || 4;

function startDevelopment(){

  if(state.development){

    showToast("現在すでにゲームを開発中です。");
    return;
  }

  const scaleKey=$("scaleSelect")?.value || "small";
  const scale=SCALES[scaleKey];

  const title=$("gameTitleInput")?.value.trim() || "新作ゲーム";

  let budget=Number(
    $("budgetInput")?.value
  );

  if(!Number.isFinite(budget))budget=scale.min;

  budget=clamp(
    budget,
    scale.min,
    scale.max
  );

  if(state.money<budget){

    showToast("開発予算が足りません。");
    return;
  }

  state.money-=budget;

  state.development={
    title,
    genre:selectedGenre,
    theme:selectedTheme,
    scale:scale.name,
    budget,
    minWeeks:scale.weeks,
    cap:scale.cap,
    progress:0,
    quality:rand(5,12),
    innovation:rand(0,8),
    price:rand(1980,6980),
    startedWeek:state.week
  };

  showToast(`🎮 「${title}」の開発開始！`);

  panelDirty=true;
  renderPanel();
}

function cancelDevelopment(){

  if(!state.development)return;

  const refund=Math.floor(
    state.development.budget*.55
  );

  state.money+=refund;
  state.development=null;

  showToast(`開発を中止。${money(refund)}を回収した。`);

  panelDirty=true;
  renderPanel();
}

function runAwards(){

  if(state.games.length===0)return;

  const eligible=
    state.games.filter(
      g=>g.releasedWeek>state.week-52
    );

  if(eligible.length===0)return;

  const awards=[
    ["年間ゲーム大賞",g=>g.quality+g.rating*6+g.sales*.001],
    ["最優秀グラフィック賞",g=>g.quality],
    ["最優秀シナリオ賞",g=>g.rating*10+g.quality*.4],
    ["最優秀サウンド賞",g=>g.rating*9+g.quality*.35],
    ["最優秀アイデア賞",g=>g.hype+g.quality*.5],
    ["プレイヤー投票賞",g=>g.sales*.01+g.rating*10]
  ];

  for(const [name,score] of awards){

    let winner=null;
    let best=-Infinity;

    for(const g of eligible){

      const s=score(g)+randFloat(0,15);

      if(s>best){
        best=s;
        winner=g;
      }
    }

    if(winner){

      winner.awards.push(name);

      state.awards.push({
        year:state.year,
        name,
        title:winner.title
      });

      state.fans+=Math.floor(winner.sales*.02);
      winner.hype=clamp(winner.hype+15,0,100);
    }
  }

  showToast("🏆 年間ゲーム・オブ・ザ・イヤーが開催された！");
}

      <div class="cardTitle">
        ${escapeHTML(state.company)}
      </div>

      <div class="small">
        社長：${escapeHTML(state.president)}
      </div>

      <div class="statGrid" style="margin-top:10px">

        <div class="stat">
          <span>会社ランク</span>
          <b>${state.rank}</b>
        </div>

        <div class="stat">
          <span>設立年</span>
          <b>${state.year}年目</b>
        </div>

        <div class="stat">
          <span>社員</span>
          <b>${state.employees.length}/${getRankMax()}</b>
        </div>

        <div class="stat">
          <span>ファン</span>
          <b>${Math.floor(state.fans).toLocaleString()}</b>
        </div>

        <div class="stat">
          <span>総売上</span>
          <b>${money(totalRevenue)}</b>
        </div>

        <div class="stat">
          <span>年間給与総額</span>
          <b>${money(totalSalary)}</b>
        </div>

      </div>
    </div>

    <div class="card">
      <div class="cardTitle">📈 市場トレンド</div>

      <div class="small">
        今週注目：
        <b>${state.market.genre}</b>
        ×
        <b>${state.market.theme}</b>
        <br>
        市場強度：${state.market.strength}
      </div>

      <div class="progress">
        <div style="width:${state.market.strength}%"></div>
      </div>
    </div>

    <div class="card">
      <div class="cardTitle">🏆 受賞歴</div>

      ${
        state.awards.length
        ? state.awards.slice().reverse().map(a=>`
          <div class="small" style="padding:6px 0">
            ${a.year}年 🏆 ${a.name}
            <br>
            「${escapeHTML(a.title)}」
          </div>
        `).join("")
        : `<div class="small">まだ受賞歴はありません。</div>`
      }
    </div>

    <div class="card">
      <div class="cardTitle">💾 データ</div>

      <button class="action green" onclick="saveGame()">
        💾 セーブ
      </button>

      <button class="action" onclick="loadGame()">
        📂 ロード
      </button>

      <button class="action danger" onclick="deleteSave()">
        🗑 セーブデータ削除
      </button>
    </div>
  `;
}

function updateLiveUI(){

  if(!state)return;

  $("moneyTop").textContent=money(state.money);

  $("dateTop").textContent=
    `${state.year}年目 ${state.month}月${state.day}日`;

  $("rankTop").textContent=state.rank;

  $("employeeTop").textContent=
    state.employees.length;

  const hour=
    9+
    Math.floor(
      ((weekTimer/15)*8)
    );

  const h=Math.min(17,hour);

  $("wallClock").textContent=
    `${String(h).padStart(2,"0")}:00`;

  if(!state.development &&
     activeTab==="development" &&
     !panelDirty){

    renderPanel();
  }

  if(state.development &&
     activeTab==="development" &&
     !panelDirty){

    const content=$("panelContent");

    if(
      content &&
      !content.matches(":hover")
    ){
      renderPanel();
    }
  }
}

function togglePause(){

  paused=!paused;

  $("pauseButton").textContent=
    paused ? "▶ 再開" : "⏸ 一時停止";

  showToast(
    paused ? "⏸ 時間を停止しました。" : "▶ 時間を再開しました。"
  );
}

function saveGame(){

  if(!state)return;

  const save=JSON.parse(
    JSON.stringify({
      ...state,
      employees:state.employees.map(e=>{
        const copy={...e};
        delete copy.el;
        return copy;
      })
    })
  );

  localStorage.setItem(
    "gameDevelopmentSave",
    JSON.stringify(save)
  );

  showToast("💾 セーブしました！");
}

function loadGame(){

  const raw=
    localStorage.getItem("gameDevelopmentSave");

  if(!raw){

    showToast("セーブデータがありません。");
    return;
  }

  try{

    state=JSON.parse(raw);

    state.employees.forEach(e=>{
      e.el=null;
      e.returningFromEvent=false;
    });

    state.applicants ||= [];
    state.games ||= [];
    state.awards ||= [];
    state.market ||= {
      genre:choice(GENRES),
      theme:choice(THEMES),
      strength:70
    };

    createEmployeeLayer();

    renderPanel();
    updateLiveUI();

    showToast("📂 セーブデータをロードしました！");

  }catch(err){

    console.error(err);

    showToast("ロードに失敗しました。");
  }
}

function deleteSave(){

  if(!confirm(
    "セーブデータを削除しますか？"
  ))return;

  localStorage.removeItem(
    "gameDevelopmentSave"
  );

  showToast("🗑 セーブデータを削除しました。");
}

function triggerGameOver(reason){

  state.gameOver=true;

  $("gameOverText").textContent=
    reason;

  $("gameOver").classList.add("show");
}

function escapeHTML(str){

  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeAttr(str){

  return String(str)
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");
}

window.addEventListener("keydown",e=>{

  if(e.key===" " &&
     document.activeElement.tagName!=="INPUT"){

    e.preventDefault();
    togglePause();
  }
});

window.addEventListener("beforeunload",()=>{

  if(state && gameStarted){
    saveGame();
  }
});

/* 社員が社長に来たとき、実際の社長席中央付近へ寄せる */
function keepEmployeesAwayFromCEO(){

  if(!state)return;

  for(const e of state.employees){

    if(e.returningFromEvent)continue;

    const dx=e.x-50;
    const dy=e.y-55;
    const dist=Math.sqrt(dx*dx+dy*dy);

    if(dist<7){

      const angle=Math.atan2(dy,dx);

      e.x=50+Math.cos(angle)*7;
      e.y=55+Math.sin(angle)*7;
    }
  }
}

/* 社長キャラは常に画面内に存在 */
function animateCEO(){

  const ceo=$("ceoCharacter");

  if(!ceo)return;

  const bob=
    Math.sin(performance.now()/850)*1.2;

  ceo.style.transform=
    `translateX(-50%) translateY(${bob}px)`;
}

(function extraAnimationLoop(){

  animateCEO();

  if(gameStarted){
    keepEmployeesAwayFromCEO();
  }

  requestAnimationFrame(extraAnimationLoop);

})();
</script>

</body>
</html>
