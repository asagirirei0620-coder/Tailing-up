<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>ゲーム開発記</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#10131a;color:#fff}
button,input,select{font:inherit}
button{cursor:pointer;border:0;color:#fff}
#app{width:100%;height:100%;display:flex;flex-direction:column;background:
radial-gradient(circle at 35% 20%,rgba(70,100,170,.12),transparent 35%),
#10131a}

/* ===== TOP ===== */
#topbar{
height:74px;flex:none;display:flex;align-items:center;
padding:0 22px;gap:22px;
background:rgba(17,21,30,.96);
border-bottom:1px solid rgba(255,255,255,.08);
box-shadow:0 5px 25px rgba(0,0,0,.3);
z-index:20
}
.logo{font-weight:900;font-size:24px;letter-spacing:1px;white-space:nowrap}
.logo span{color:#71b7ff}
.companyName{font-size:13px;color:#9ca6b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topStats{margin-left:auto;display:flex;align-items:center;gap:20px}
.stat{min-width:90px}
.stat small{display:block;color:#818b9d;font-size:10px;margin-bottom:3px}
.stat strong{font-size:15px}
.money{color:#ffd76a!important}
.pauseBtn{
width:44px;height:44px;border-radius:12px;background:#242b38;
font-size:18px;transition:.2s
}
.pauseBtn:hover{background:#313b4d}

/* ===== MAIN ===== */
#main{min-height:0;flex:1;display:flex}
#officeScene{
position:relative;min-width:0;flex:1;overflow:hidden;
background:
linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px),
linear-gradient(180deg,#26303a 0%,#1b222b 100%);
background-size:40px 40px,40px 40px,100% 100%;
}

/* windows */
.window{
position:absolute;top:7%;left:5%;width:30%;height:23%;
border:8px solid #20252d;background:
linear-gradient(135deg,rgba(100,180,255,.25),rgba(45,80,125,.45));
box-shadow:inset 0 0 30px rgba(0,0,0,.3),0 10px 25px rgba(0,0,0,.15)
}
.window:before,.window:after{content:"";position:absolute;background:#20252d}
.window:before{width:7px;height:100%;left:50%;top:0}
.window:after{height:7px;width:100%;left:0;top:50%}
.window2{left:auto;right:5%;width:24%;height:18%}

/* floor */
.floor{
position:absolute;bottom:0;left:0;width:100%;height:30%;
background:
linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),
linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
#202832;
background-size:55px 55px;
border-top:2px solid rgba(255,255,255,.05)
}

/* office furniture */
.desk{
position:absolute;width:145px;height:55px;background:#493b35;
border-radius:7px;box-shadow:0 10px 15px rgba(0,0,0,.28);
border:2px solid #5e4c42
}
.desk:after{
content:"";position:absolute;left:12px;right:12px;bottom:-25px;height:25px;
border-left:6px solid #382f2b;border-right:6px solid #382f2b
}
.pc{
position:absolute;width:48px;height:32px;background:#10151c;border:3px solid #596879;
border-radius:3px;top:-38px;left:48px
}
.pc:after{content:"";position:absolute;left:18px;bottom:-9px;width:8px;height:7px;background:#657385}
.plant{position:absolute;font-size:28px;filter:drop-shadow(0 5px 5px rgba(0,0,0,.3))}
.whiteboard{
position:absolute;right:7%;top:36%;width:180px;height:100px;
background:#e9edf0;border:8px solid #444d58;border-radius:5px;color:#333;
box-shadow:0 10px 20px rgba(0,0,0,.3)
}
.whiteboard:before{content:"GAME PLAN";position:absolute;top:12px;left:15px;font-size:12px;font-weight:900;color:#555}
.whiteboard:after{content:"■■ □□ ★";position:absolute;top:42px;left:18px;color:#6d86a7;font-size:20px}

/* desks positions */
.d1{left:10%;top:43%}.d2{left:35%;top:43%}.d3{left:12%;top:68%}.d4{left:37%;top:68%}
.d5{left:61%;top:60%}

/* CEO area */
.ceoDesk{
position:absolute;left:50%;bottom:10%;transform:translateX(-50%);
width:210px;height:70px;background:#4a3a31;border:2px solid #6a5144;border-radius:8px;
box-shadow:0 14px 25px rgba(0,0,0,.35)
}
.ceoDesk:before{
content:"CEO";position:absolute;left:50%;top:8px;transform:translateX(-50%);
font-size:10px;color:#d8bd8e;letter-spacing:3px;font-weight:900
}
.ceoCharacter{
position:absolute;left:50%;bottom:18%;transform:translateX(-50%);
width:48px;height:75px;z-index:5;animation:ceoIdle 2.8s ease-in-out infinite
}
@keyframes ceoIdle{50%{transform:translateX(-50%) translateY(-2px)}}
.head{position:absolute;left:13px;top:0;width:22px;height:22px;background:#d89b76;border-radius:7px}
.hair{position:absolute;left:12px;top:-3px;width:24px;height:10px;background:#25262b;border-radius:8px 8px 3px 3px;z-index:2}
.body{position:absolute;left:7px;top:21px;width:34px;height:39px;background:#263449;border-radius:8px 8px 3px 3px}
.tie{position:absolute;left:21px;top:24px;width:5px;height:27px;background:#c94c55;z-index:2}
.arm{position:absolute;top:27px;width:9px;height:28px;background:#d89b76;border-radius:6px}
.arm.l{left:0;transform:rotate(12deg)}.arm.r{right:0;transform:rotate(-12deg)}
.leg{position:absolute;top:57px;width:11px;height:20px;background:#1c2431;border-radius:4px}
.leg.l{left:11px}.leg.r{right:11px}
.ceoLabel{
position:absolute;left:50%;bottom:4%;transform:translateX(-50%);
font-size:12px;font-weight:800;color:#dce5f0;z-index:6
}

/* ===== EMPLOYEES ===== */
#employeeLayer{position:absolute;inset:0;pointer-events:none;z-index:8}
.employee{
position:absolute;width:40px;height:62px;transform:translate(-50%,-50%);
transition:none;filter:drop-shadow(0 5px 5px rgba(0,0,0,.35))
}
.empHead{position:absolute;left:10px;top:0;width:20px;height:20px;border-radius:7px;background:var(--skin)}
.empHair{position:absolute;left:8px;top:-3px;width:24px;height:10px;border-radius:8px 8px 2px 2px;background:var(--hair);z-index:2}
.empBody{position:absolute;left:6px;top:19px;width:28px;height:31px;border-radius:7px 7px 3px 3px;background:var(--shirt)}
.empArm{position:absolute;top:23px;width:7px;height:23px;background:var(--skin);border-radius:5px}
.empArm.a{left:2px;transform:rotate(10deg)}.empArm.b{right:2px;transform:rotate(-10deg)}
.empLeg{position:absolute;top:47px;width:8px;height:15px;background:#28303d;border-radius:4px}
.empLeg.a{left:9px}.empLeg.b{right:9px}
.empTool{position:absolute;left:28px;top:24px;font-size:13px;z-index:3}
.empName{
position:absolute;top:-22px;left:50%;transform:translateX(-50%);
font-size:10px;white-space:nowrap;color:#e9edf5;background:rgba(10,12,16,.65);
padding:2px 5px;border-radius:4px
}
.working .empBody{animation:workBody .55s infinite alternate}
.walking .empLeg.a{animation:walkA .25s infinite alternate}
.walking .empLeg.b{animation:walkB .25s infinite alternate}
@keyframes workBody{to{transform:translateY(-1px)}}@keyframes walkA{to{transform:rotate(12deg)}}@keyframes walkB{to{transform:rotate(-12deg)}}

/* speech */
.officeToast{
position:absolute;left:50%;top:8%;transform:translateX(-50%) translateY(-10px);
padding:10px 17px;background:rgba(12,15,21,.9);border:1px solid rgba(255,255,255,.1);
border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:15
}
.officeToast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== RIGHT MENU ===== */
#menuBar{
width:275px;flex:none;padding:20px 18px;display:flex;flex-direction:column;gap:12px;
background:#151a22;border-left:1px solid rgba(255,255,255,.08);
box-shadow:-10px 0 30px rgba(0,0,0,.22);z-index:18
}
.menuTitle{font-size:12px;color:#758096;font-weight:800;letter-spacing:2px;margin:2px 5px 5px}
.menuBtn{
height:64px;border-radius:14px;background:#202733;border:1px solid rgba(255,255,255,.06);
display:flex;align-items:center;text-align:left;padding:0 18px;gap:14px;
transition:.18s;box-shadow:0 5px 10px rgba(0,0,0,.13)
}
.menuBtn:hover{background:#2b3545;transform:translateX(-3px);border-color:rgba(113,183,255,.35)}
.menuBtn:active{transform:scale(.98)}
.menuIcon{font-size:25px;width:32px;text-align:center}
.menuBtn span:last-child{font-weight:800;font-size:15px}

/* ===== MODAL ===== */
#modalRoot{position:fixed;inset:0;z-index:100;pointer-events:none}
.modalBack{
position:absolute;inset:0;background:rgba(4,6,10,.72);backdrop-filter:blur(5px);
display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s;pointer-events:none
}
.modalBack.open{opacity:1;pointer-events:auto}
.modal{
width:min(1050px,calc(100vw - 330px));height:min(720px,calc(100vh - 120px));
min-height:430px;background:#171c25;border:1px solid rgba(255,255,255,.1);
border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.6);
overflow:hidden;transform:translateY(18px) scale(.98);transition:.22s;
display:flex;flex-direction:column
}
.modalBack.open .modal{transform:none}
.modalHeader{
height:68px;flex:none;display:flex;align-items:center;padding:0 22px;
border-bottom:1px solid rgba(255,255,255,.07);background:#1b212c
}
.modalHeader h2{margin:0;font-size:21px}
.modalClose{
margin-left:auto;width:40px;height:40px;border-radius:10px;background:#29313d;font-size:20px
}
.modalClose:hover{background:#3a4657}
.modalBody{padding:22px;overflow:auto;min-height:0;flex:1}
.modalBody::-webkit-scrollbar{width:7px}.modalBody::-webkit-scrollbar-thumb{background:#394454;border-radius:10px}

/* common cards */
.card{
background:#202733;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:16px
}
.sectionTitle{font-size:12px;color:#8590a4;font-weight:900;letter-spacing:1px;margin-bottom:10px}
.primary{
background:linear-gradient(135deg,#4d91dc,#6b6de0);border-radius:11px;padding:12px 18px;font-weight:900;
box-shadow:0 7px 18px rgba(70,110,210,.22)
}
.primary:hover{filter:brightness(1.1)}
.danger{background:#7d3942;border-radius:10px;padding:10px 15px}
.muted{color:#8993a5}
.grid{display:grid;gap:12px}

/* ===== DEVELOPMENT ===== */
.devGrid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}
.label{font-size:12px;color:#909bad;font-weight:800;margin-bottom:7px}
.textInput{
width:100%;height:45px;border-radius:9px;border:1px solid #374150;background:#11161e;
color:#fff;padding:0 13px;outline:none
}
.textInput:focus{border-color:#6caeff}
.choiceGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.choice{
padding:10px 7px;border-radius:8px;background:#252d39;border:1px solid transparent;
font-size:12px
}
.choice.selected{background:#365f88;border-color:#75b9ff;box-shadow:0 0 0 1px rgba(117,185,255,.2)}
.scaleGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.scale{
padding:12px 7px;background:#242c38;border-radius:10px;border:1px solid transparent;text-align:center
}
.scale.selected{background:#405f83;border-color:#7ab9ff}
.scale b{display:block;font-size:13px}.scale small{color:#a4afc0}
.devSummary{text-align:center;height:100%;display:flex;flex-direction:column;justify-content:center}
.progressCircle{
width:190px;height:190px;margin:5px auto 20px;border-radius:50%;
background:conic-gradient(#70b6ff 0deg,#70b6ff var(--deg),#2a3340 var(--deg));
display:grid;place-items:center;position:relative
}
.progressCircle:after{content:"";position:absolute;width:154px;height:154px;border-radius:50%;background:#171c25}
.progressValue{position:relative;z-index:2;font-size:34px;font-weight:900}
.devStats{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}
.devStat{background:#202733;border-radius:9px;padding:10px}.devStat small{color:#8791a2;display:block}.devStat b{font-size:14px}

/* ===== RECRUIT ===== */
.recruitTop{display:flex;gap:10px;align-items:center;margin-bottom:15px}
.recruitBtn{
padding:11px 14px;background:#252d39;border-radius:10px;border:1px solid rgba(255,255,255,.06)
}
.recruitBtn:hover{background:#344052}
.recruitLayout{display:grid;grid-template-columns:250px 1fr;gap:16px;height:calc(100% - 70px)}
.candidateList{overflow:auto;padding-right:4px}
.candidate{
padding:12px;border-radius:10px;background:#202733;margin-bottom:7px;border:1px solid transparent;
cursor:pointer
}
.candidate:hover{background:#293342}
.candidate.selected{background:#304e6c;border-color:#76b7f7}
.candidate b{display:block}.candidate small{color:#a4afbf}
.candidateMain{display:grid;grid-template-columns:1fr 300px;gap:18px}
.candidateVisual{
background:linear-gradient(145deg,#1e2734,#12161d);border-radius:15px;
display:flex;align-items:center;justify-content:center;min-height:300px;position:relative
}
.bigPerson{position:relative;width:130px;height:220px}
.bigPerson .bpHead{position:absolute;left:37px;top:8px;width:56px;height:56px;border-radius:18px;background:var(--skin)}
.bigPerson .bpHair{position:absolute;left:33px;top:0;width:64px;height:28px;border-radius:22px 22px 7px 7px;background:var(--hair);z-index:2}
.bigPerson .bpBody{position:absolute;left:22px;top:58px;width:86px;height:90px;border-radius:20px 20px 8px 8px;background:var(--shirt)}
.bigPerson .bpArm{position:absolute;top:70px;width:23px;height:72px;border-radius:15px;background:var(--skin)}
.bigPerson .bpArm.a{left:5px;transform:rotate(9deg)}.bigPerson .bpArm.b{right:5px;transform:rotate(-9deg)}
.bigPerson .bpLeg{position:absolute;top:140px;width:26px;height:76px;background:#28313f;border-radius:12px}
.bigPerson .bpLeg.a{left:32px}.bigPerson .bpLeg.b{right:32px}
.bigTool{position:absolute;right:-12px;top:78px;font-size:35px;z-index:5}
.statRows{display:grid;gap:8px}
.statRow{display:grid;grid-template-columns:95px 1fr 38px;gap:7px;align-items:center;font-size:12px}
.bar{height:7px;background:#2b3440;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#6faef0;border-radius:10px}
.candidateActions{margin-top:15px;display:flex;gap:8px;justify-content:flex-end}

/* ===== EMPLOYEES / GAMES ===== */
.employeeGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.employeeCard{display:grid;grid-template-columns:70px 1fr;gap:12px;background:#202733;border-radius:13px;padding:13px}
.miniPerson{width:60px;height:75px;position:relative;margin:auto}
.miniPerson .head{left:19px}.miniPerson .hair{left:17px}.miniPerson .body{left:13px}
.employeeInfo h3{margin:0 0 3px;font-size:15px}.employeeInfo p{margin:3px 0;color:#919cad;font-size:11px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.tag{padding:3px 6px;border-radius:5px;background:#303947;font-size:10px}
.gameGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gameCard{padding:17px;background:#202733;border-radius:14px;border:1px solid rgba(255,255,255,.05)}
.gameCard h3{margin:0 0 6px}.gameMeta{color:#8d98aa;font-size:11px}
.rating{font-size:27px;font-weight:900;margin:12px 0;color:#ffd76a}

/* ===== COMPANY / FINANCE ===== */
.bigNumber{font-size:31px;font-weight:900}.rankBadge{
display:inline-flex;padding:5px 10px;border-radius:7px;background:#36577b;font-weight:900
}
.companyStats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.companyStat{padding:20px;background:#202733;border-radius:13px}
.companyStat small{display:block;color:#8993a5;margin-bottom:7px}
.financeList{display:grid;gap:8px}.financeItem{display:flex;justify-content:space-between;padding:13px;background:#202733;border-radius:9px}
.plus{color:#72db9c}.minus{color:#ff8585}

/* ===== AWARDS / SETTINGS ===== */
.award{padding:15px;background:#202733;border-radius:12px;margin-bottom:8px}
.award strong{display:block;font-size:15px}.award span{color:#a0aabc;font-size:12px}
.settingRow{display:flex;justify-content:space-between;align-items:center;padding:16px;background:#202733;border-radius:12px;margin-bottom:8px}
.smallBtn{background:#303947;border-radius:8px;padding:8px 13px}

/* toast */
#saveToast{
position:fixed;bottom:25px;left:50%;transform:translateX(-50%) translateY(15px);
background:#242d3a;border:1px solid rgba(255,255,255,.1);padding:11px 18px;
border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:200
}
#saveToast.show{opacity:1;transform:translateX(-50%)}

/* responsive */
@media(max-width:900px){
#menuBar{width:190px;padding:12px 10px}
.menuBtn{height:55px;padding:0 10px}.menuBtn span:last-child{font-size:12px}
.menuIcon{font-size:20px;width:26px}
.modal{width:calc(100vw - 215px);height:calc(100vh - 90px)}
.topStats{gap:8px}.stat{min-width:70px}
}
@media(max-width:700px){
#topbar{height:60px;padding:0 10px}.logo{font-size:18px}
.companyName{display:none}.topStats .stat:nth-child(2){display:none}
#menuBar{width:72px;padding:8px 6px}.menuTitle{display:none}
.menuBtn{height:55px;padding:0;justify-content:center}
.menuBtn span:last-child{display:none}.menuIcon{font-size:22px}
.modal{width:calc(100vw - 90px);height:calc(100vh - 80px)}
.devGrid,.recruitLayout,.candidateMain{grid-template-columns:1fr}
.candidateVisual{min-height:250px}
}
</style>
</head>
<body>
<div id="app">

<header id="topbar">
  <div class="logo">🎮 ゲーム<span>開発記</span></div>
  <div class="companyName" id="companyName">未設立</div>

  <div class="topStats">
    <div class="stat"><small>会社ランク</small><strong id="rank">G</strong></div>
    <div class="stat"><small>時間</small><strong id="dateText">1年目 4月1週</strong></div>
    <div class="stat"><small>資金</small><strong id="money" class="money">2,000万円</strong></div>
    <button class="pauseBtn" id="pauseBtn" onclick="togglePause()">Ⅱ</button>
  </div>
</header>

<main id="main">

<section id="officeScene">
  <div class="window"></div>
  <div class="window window2"></div>

  <div class="desk d1"><div class="pc"></div></div>
  <div class="desk d2"><div class="pc"></div></div>
  <div class="desk d3"><div class="pc"></div></div>
  <div class="desk d4"><div class="pc"></div></div>
  <div class="desk d5"><div class="pc"></div></div>

  <div class="plant" style="left:4%;bottom:17%">🪴</div>
  <div class="plant" style="right:4%;bottom:13%">🌿</div>
  <div class="whiteboard"></div>

  <div class="floor"></div>

  <div class="ceoDesk"></div>
  <div class="ceoCharacter">
    <div class="hair"></div><div class="head"></div>
    <div class="body"></div><div class="tie"></div>
    <div class="arm l"></div><div class="arm r"></div>
    <div class="leg l"></div><div class="leg r"></div>
  </div>
  <div class="ceoLabel">社長</div>

  <div id="employeeLayer"></div>
  <div class="officeToast" id="officeToast"></div>
</section>

<aside id="menuBar">
  <div class="menuTitle">MENU</div>

  <button class="menuBtn" onclick="openMenu('development')">
    <span class="menuIcon">🎮</span><span>ゲーム開発</span>
  </button>

  <button class="menuBtn" onclick="openMenu('recruitment')">
    <span class="menuIcon">👥</span><span>社員採用</span>
  </button>

  <button class="menuBtn" onclick="openMenu('employees')">
    <span class="menuIcon">🧑‍💻</span><span>社員</span>
  </button>

  <button class="menuBtn" onclick="openMenu('games')">
    <span class="menuIcon">📦</span><span>ゲーム</span>
  </button>

  <button class="menuBtn" onclick="openMenu('company')">
    <span class="menuIcon">🏢</span><span>会社</span>
  </button>

  <button class="menuBtn" onclick="openMenu('finance')">
    <span class="menuIcon">💰</span><span>財務</span>
  </button>

  <button class="menuBtn" onclick="openMenu('awards')">
    <span class="menuIcon">🏆</span><span>実績</span>
  </button>

  <button class="menuBtn" onclick="openMenu('settings')">
    <span class="menuIcon">⚙️</span><span>設定</span>
  </button>
</aside>

</main>
</div>

<div id="modalRoot"></div>
<div id="saveToast">保存しました</div>

<script>
"use strict";

/* =========================================================
   GAME DATA
========================================================= */

const WEEK_MS = 15000;
const SAVE_KEY = "GAME_DEVELOPMENT_RECORD_V3";

const JOBS = [
  {id:"programmer",name:"プログラマー",icon:"💻",tool:"💻"},
  {id:"designer",name:"グラフィックデザイナー",icon:"🎨",tool:"🖌️"},
  {id:"planner",name:"プランナー",icon:"📋",tool:"📋"},
  {id:"sound",name:"サウンドクリエイター",icon:"🎵",tool:"🎧"}
];

const PERSONALITIES = [
  ["🔥","熱血"],["🧊","冷静"],["😄","社交的"],["🤫","人見知り"],
  ["🎨","自由人"],["📚","努力家"],["😴","マイペース"],

/* =========================================================
   BASIC HELPERS
========================================================= */

function yen(n){
  return Math.max(0,Math.floor(n)).toLocaleString("ja-JP")+"円";
}

function formatMoney(n){
  n = Math.floor(n);

  if(Math.abs(n) < 10000){
    return n.toLocaleString("ja-JP")+"円";
  }

  const man = n / 10000;

  if(Number.isInteger(man)){
    return man.toLocaleString("ja-JP")+"万円";
  }

  return man.toLocaleString("ja-JP",{
    maximumFractionDigits:1
  })+"万円";
}

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function rand(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function pick(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function escapeHTML(str){
  return String(str ?? "").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

function notify(text){
  const el=document.getElementById("saveToast");
  el.textContent=text;
  el.classList.add("show");
  clearTimeout(notify.timer);
  notify.timer=setTimeout(()=>el.classList.remove("show"),1800);
}

function logFinance(text,amount){
  state.financeLog.unshift({
    year:state.year,
    month:state.month,
    week:state.week,
    text,
    amount
  });

  state.financeLog=state.financeLog.slice(0,80);
}

function officeLoop(now){
  const delta=Math.min(50,now-lastOfficeTime);
  lastOfficeTime=now;

  if(!state.paused){
    state.employees.forEach(e=>{
      if(e.targetX!==null){
        const dx=e.targetX-e.x;
        const dy=e.targetY-e.y;
        const dist=Math.sqrt(dx*dx+dy*dy);

        if(dist<0.4){
          e.x=e.targetX;
          e.y=e.targetY;
          e.targetX=null;
          e.targetY=null;
          e.mode="working";
          e.nextAction=now+rand(2500,7000);
        }else{
          const speed=0.006*delta;
          e.x+=dx/dist*speed;
          e.y+=dy/dist*speed;
          e.mode="walking";
        }
      }else if(now>e.nextAction){
        if(Math.random()<0.6){
          const points=[
            [rand(8,75),rand(40,76)],
            [rand(8,75),rand(40,76)],
            [50,55]
          ];
          const p=pick(points);
          e.targetX=p[0];
          e.targetY=p[1];
          e.mode="walking";
        }else{
          e.mode=Math.random()<.75?"working":"talking";
          e.nextAction=now+rand(2000,6000);
        }
      }

      updateEmployeeAppearance(e);
    });
  }

  requestAnimationFrame(officeLoop);
}

function updateClock(){
  if(state.paused)return;

  const now=performance.now();

  const elapsed=now-state.lastWeekAt;
  state.weekFraction=clamp(elapsed/WEEK_MS,0,0.999);

  if(elapsed>=WEEK_MS){
    advanceWeek();
    state.lastWeekAt=now;
    state.weekFraction=0;
  }
}

function advanceWeek(){
  state.week++;

  if(state.week>4){
    state.week=1;
    state.month++;

    if(state.month>12){
      state.month=1;
      state.year++;
      runAnnualAwards();
    }

    if(state.month===4){

    }

  updateMarket();

  if(state.development){
    developGameWeek();
  }

  earnGameRevenue();
  employeeGrowth();
  maybeEmployeeEvent();
  checkRank();

  updateTopUI();
}

  let total=0;

========================================================= */

function calculateDevelopmentProgress(){
  if(!state.development)return 0;

  const d=state.development;
  const elapsedWeeks=
    (performance.now()-d.startedAt)/WEEK_MS;

  return clamp(elapsedWeeks/d.requiredWeeks*100,0,100);
}

function calculateQuality(){
  if(!state.development)return 0;

  const d=state.development;
  const scale=SCALES[d.scale];

  if(state.employees.length===0){
    return Math.round(scale.quality*0.25);
  }

  let total=0;

  state.employees.forEach(e=>{
    let main=0;

    if(d.genre==="RPG"||d.genre==="アドベンチャー"||d.genre==="ノベル"||d.genre==="ミステリー"){
      main=(e.planning+e.scenario)/2;
    }else if(d.genre==="アクション"||d.genre==="格闘"||d.genre==="シューティング"){
      main=(e.programming+e.graphics)/2;
    }else if(d.genre==="音楽"){
      main=(e.sound+e.graphics)/2;
    }else if(d.genre==="経営"||d.genre==="シミュレーション"||d.genre==="ストラテジー"){
      main=(e.planning+e.programming)/2;
    }else{
      main=(e.programming+e.graphics+e.planning)/3;
    }

    total+=main;
  });

  let team=total/state.employees.length;
  let compatibility=getCompatibility(d.genre,d.theme);

  let quality=
    team*.52+
    compatibility*.22+
    d.budget/scale.max*100*.16+
    state.market.strength*.10;

  quality+=rand(-5,5);

  return Math.round(clamp(
    quality,
    1,
    scale.quality
  ));
}

function getCompatibility(genre,theme){
  const excellent=[
    ["RPG","ファンタジー"],["RPG","魔法"],["SF","宇宙"],
    ["SF","未来"],["ホラー","ゾンビ"],["ミステリー","探偵"],
    ["スポーツ","スポーツ"],["音楽","音楽"],["レース","乗り物"],
    ["アドベンチャー","海"],["戦争","中世"],["料理","料理"]
  ];

  if(excellent.some(x=>x[0]===genre&&x[1]===theme))return rand(90,100);

  if(genre===theme)return rand(88,96);

  return rand(45,82);
}

function getRequiredWeeks(scale){
  const base=SCALES[scale].weeks;
  const teamPower=Math.max(1,state.employees.length);

  let reduction=0;

  state.employees.forEach(e=>{
    reduction+=getEmployeeAverage(e)/250;
  });

  return Math.max(base,Math.ceil(base/(1+reduction)));
}

function startDevelopment(){
  if(state.development){
    notify("現在すでにゲームを開発中です");
    return;
  }

  const name=document.getElementById("gameNameInput")?.value.trim();

  if(!name){
    notify("ゲーム名を入力してください");
    return;
  }

  const scale=SCALES[selectedScale];

  selectedBudget=clamp(
    selectedBudget,
    scale.min,
    scale.max
  );

  if(state.money<selectedBudget){
    notify("資金が足りません");
    return;
  }

  const requiredWeeks=getRequiredWeeks(selectedScale);

  changeMoney(-selectedBudget,"ゲーム開発費："+name);

  state.development={
    id:state.nextGameId++,
    name,
    genre:selectedGenre,
    theme:selectedTheme,
    scale:selectedScale,
    budget:selectedBudget,
    requiredWeeks,
    startedAt:performance.now(),
    startedWeek:state.week,
    quality:0
  };

  closeMenu();
  showOfficeToast("「"+name+"」の開発を開始しました！");
}

function developGameWeek(){
  if(!state.development)return;

  const progress=calculateDevelopmentProgress();

  if(progress>=100){
    finishDevelopment();
  }
}

function finishDevelopment(){
  if(!state.development)return;

  const d=state.development;
  const quality=calculateQuality();

  const price=rand(1980,6980);

  const game={
    id:d.id,
    name:d.name,
    genre:d.genre,
    theme:d.theme,
    scale:d.scale,
    budget:d.budget,
    quality,
    rating:clamp(
      (quality*.72)+rand(8,28),
      1,
      100
    ),
    price,
    weeklySales:0,
    lifetimeSales:0,
    lifetimeRevenue:0,
    weeksReleased:0,
    hype:rand(45,85),
    releasedYear:state.year,
    releasedMonth:state.month
  };

  game.weeklySales=Math.floor(
    (game.rating*120+game.hype*70+state.totalFans*.03)*
    (SCALES[d.scale]===SCALES.huge?2.2:
     SCALES[d.scale]===SCALES.large?1.5:
     SCALES[d.scale]===SCALES.medium?1:0.55)
  );

  state.games.push(game);
  state.development=null;

  notify("ゲーム「"+game.name+"」が完成しました！");
  showOfficeToast("🎉 新作ゲーム発売！");
}

/* =========================================================
   REVENUE
========================================================= */

function earnGameRevenue(){
  if(state.games.length===0)return;

  let total=0;

  state.games.forEach(g=>{
    g.weeksReleased++;

    const trend=
      g.genre===state.market.genre ? 1+state.market.strength/150 : 1;

    const ageFactor=Math.max(
      .25,
      1-(g.weeksReleased*.018)
    );

    const hypeFactor=Math.max(
      .35,
      g.hype/100
    );

    g.weeklySales=Math.max(
      0,
      Math.floor(
        g.weeklySales*0.45+
        g.rating*65*
        trend*
        ageFactor*
        hypeFactor
      )
    );

    const revenue=Math.floor(
      g.weeklySales*g.price*.72
    );

    g.lifetimeSales+=g.weeklySales;
    g.lifetimeRevenue+=revenue;

    total+=revenue;

    state.totalFans+=Math.floor(
      g.weeklySales/1200
    );

    g.hype=Math.max(20,g.hype-rand(1,4));
  });

  if(total>0){
    changeMoney(total,"ゲーム売上");
  }
}

function employeeGrowth(){
  state.employees.forEach(e=>{
    let gain=0.2;

    if(e.personality==="努力家")gain+=.12;
    if(e.personality==="熱血")gain+=.08;

    e.experience+=gain;

    const chance=.015+e.experience*.0002;

    if(Math.random()<chance){
      const stat=pick([
        "programming","graphics","scenario","sound","planning"
      ]);

      e[stat]=clamp(e[stat]+1,1,100);
    }

    e.motivation=clamp(
      e.motivation+(Math.random()<.5?1:-1),
      25,
      100
    );
  });
}

function checkRank(){
  let score=0;

  score+=state.totalFans*.02;
  score+=state.games.length*8;

  state.games.forEach(g=>{
    score+=g.rating*.2;
  });

  score+=state.money/1000000*.5;

  let index=0;

  if(score>80)index=1;
  if(score>180)index=2;
  if(score>350)index=3;
  if(score>600)index=4;
  if(score>1000)index=5;
  if(score>1700)index=6;
  if(score>3000)index=7;

  const newRank=RANKS[index];

  if(RANKS.indexOf(newRank)>RANKS.indexOf(state.rank)){
    state.rank=newRank;
    showOfficeToast("🏆 会社ランクが "+newRank+" に上がりました！");
  }
}

   RECRUITMENT
========================================================= */

const RECRUIT_TYPES={
 general:{name:"一般募集",fee:200000,min:2,max:4,boost:0},
 active:{name:"積極募集",fee:400000,min:3,max:6,boost:8},
 skilled:{name:"技能募集",fee:800000,min:2,max:5,boost:18},
 headhunt:{name:"ヘッドハンティング",fee:1500000,min:1,max:3,boost:30}
};

function recruit(type){
  if(state.applicants.length>0){
    notify("現在の候補者を確認してください");
    return;
  }

  const data=RECRUIT_TYPES[type];

  if(state.money<data.fee){
    notify("募集費が足りません");
    return;
  }

  changeMoney(-data.fee,data.name+"募集費");

  const count=rand(data.min,data.max);

  state.applicants=[];

  for(let i=0;i<count;i++){
    state.applicants.push(createEmployeeData(data.boost));
  }

  state.selectedApplicant=0;

  renderRecruitment();
  notify(count+"名の候補者が集まりました");
}

function hireApplicant(){
  const e=state.applicants[state.selectedApplicant];

  if(!e)return;

  if(state.employees.length>=getRankMax()){
    notify("現在のランクではこれ以上社員を雇えません");
    return;
  }

  if(state.money<e.salary){
    notify("採用費用が足りません");
    return;
  }

  changeMoney(-e.salary,"社員採用："+e.name);

  state.employees.push(e);
  state.applicants.splice(state.selectedApplicant,1);

  if(state.selectedApplicant>=state.applicants.length){
    state.selectedApplicant=Math.max(0,state.applicants.length-1);
  }

  createOfficeEmployees();

  if(state.applicants.length===0){
    notify(e.name+"を採用しました");
    renderRecruitment();
  }else{
    notify(e.name+"を採用しました");
    renderRecruitment();
  }
}

function selectApplicant(index){
  if(index<0||index>=state.applicants.length)return;
  state.selectedApplicant=index;
  renderRecruitment();
}

function installApplicantKeyboard(){
  if(applicantKeyHandler){
    document.removeEventListener("keydown",applicantKeyHandler);
  }

  applicantKeyHandler=(ev)=>{
    const back=document.getElementById("modalBack");
    if(!back?.classList.contains("open"))return;

    if(ev.key==="ArrowDown"){
      ev.preventDefault();
      selectApplicant(
        (state.selectedApplicant+1)%state.applicants.length
      );
    }

    if(ev.key==="ArrowUp"){
      ev.preventDefault();
      selectApplicant(
        (state.selectedApplicant-1+state.applicants.length)%
        state.applicants.length
      );
    }

    if(ev.key==="Enter"&&state.applicants.length){
      ev.preventDefault();
      hireApplicant();
    }
  };

  document.addEventListener("keydown",applicantKeyHandler);
}

function removeApplicant(){
  if(state.applicants.length===0)return;

  const name=state.applicants[state.selectedApplicant].name;

  state.applicants.splice(state.selectedApplicant,1);

  if(state.selectedApplicant>=state.applicants.length){
    state.selectedApplicant=Math.max(0,state.applicants.length-1);
  }

  notify(name+"を見送りました");
  renderRecruitment();
}

/* =========================================================
   SAVE / LOAD
========================================================= */

function saveGame(show=true){
  try{
    localStorage.setItem(
      SAVE_KEY,
      JSON.stringify({
        version:3,
        state:{
          ...state,
          lastWeekAt:undefined,
          weekFraction:0
        }
      })
    );

    if(show)notify("保存しました");
  }catch(e){
    notify("保存に失敗しました");
  }
}

function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);

    if(!raw)return false;

    const save=JSON.parse(raw);

    if(!save?.state)return false;

    Object.assign(state,save.state);

    state.lastWeekAt=performance.now();
    state.weekFraction=0;

    return true;
  }catch(e){
    return false;
  }
}

function deleteSave(){
  if(!confirm("セーブデータを削除して最初から始めますか？"))return;

  localStorage.removeItem(SAVE_KEY);
  location.reload();
}

   PAUSE
========================================================= */

function togglePause(){
  state.paused=!state.paused;

  if(!state.paused){
    state.lastWeekAt=performance.now();
  }

  updateTopUI();
}

/* =========================================================
   START
========================================================= */

function initialSetup(){
  const loaded=loadGame();

  if(!loaded){
    const company=prompt(
      "会社名を入力してください",
      "スターライトゲームズ"
    );

    const president=prompt(
      "社長名を入力してください",
      "社長"
    );

    state.companyName=
      company?.trim()||"スターライトゲームズ";

    state.presidentName=
      president?.trim()||"社長";

    /* 最初から社員を少人数用意 */
    state.employees.push(createEmployeeData(8));
    state.employees.push(createEmployeeData(4));

    logFinance("創業資金",20000000);
    saveGame(false);
  }

  createOfficeEmployees();
  updateTopUI();

  requestAnimationFrame(officeLoop);

  setInterval(()=>{
    if(!state.paused){
      updateClock();
    }

    const second=Math.floor(performance.now()/1000);

    if(second!==lastRenderSecond){
      lastRenderSecond=second;

      updateTopUI();

      const back=document.getElementById("modalBack");

      if(back?.classList.contains("open")){
        const title=document.getElementById("modalTitle")?.textContent||"";

        if(title.startsWith("🎮 開発中")){
          renderActiveDevelopment();
        }
      }
    }
  },1000);

  setInterval(()=>{
    saveGame(false);
  },30000);
}

/* =========================================================
   CLOSE MODAL BY BACKDROP / ESC
========================================================= */

document.addEventListener("click",e=>{
  if(e.target.id==="modalBack"){
    closeMenu();
  }
});

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    closeMenu();
  }
});

/* =========================================================
   START GAME
========================================================= */

initialSetup();

</script>
</body>
</html>
